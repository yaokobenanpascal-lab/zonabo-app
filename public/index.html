// ---------- Appels vers le backend partagé (API + base de données) ----------
// Comme le frontend est servi par le même serveur Express, on utilise des chemins
// relatifs — pas besoin de CORS ni de configurer une URL séparée.
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text().catch(() => "Erreur serveur"));
  return r.json();
}
async function apiSend(path, method, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const r = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    const msg = await r.text().catch(() => "Erreur serveur");
    throw new Error(msg || "Erreur serveur");
  }
  return r.json();
}

// Petit pointeur local pour se souvenir "je suis connecté en tant que vendeur/livreur/
// acheteur avec ce nom/téléphone" d'une visite à l'autre sur CET appareil — les
// vraies données (produits, commandes, abonnement) vivent côté serveur, partagées
// entre tous les appareils.
function loadProfile(key) {
  try {
    const raw = localStorage.getItem(`profile_${key}`);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveProfile(key, data) {
  try {
    localStorage.setItem(`profile_${key}`, JSON.stringify(data));
  } catch {
    // échec silencieux
  }
}
function clearProfile(key) {
  try {
    localStorage.removeItem(`profile_${key}`);
  } catch {
    // rien à supprimer
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Lance un paiement CinetPay générique (utilisé pour les abonnements vendeur/livreur).
// L'argent est collecté directement sur le compte marchand CinetPay du propriétaire
// (celui associé à CINETPAY_CONFIG.site_id) — voir la note en fin de fichier pour
// savoir où configurer le compte de règlement (bancaire/mobile money) côté CinetPay.
function launchCinetPaySubscription({ transactionId, amount, description, customer, onSuccess, onError }) {
  if (!window.CinetPay) {
    onError && onError("Le module de paiement n'a pas pu se charger (vérifie ta connexion internet).");
    return;
  }
  const [firstName, ...rest] = (customer.name || "Zonako").trim().split(" ");
  window.CinetPay.setConfig({
    apikey: CINETPAY_CONFIG.apikey,
    site_id: CINETPAY_CONFIG.site_id,
    mode: CINETPAY_CONFIG.mode,
    notify_url: CINETPAY_CONFIG.notify_url,
  });
  window.CinetPay.getCheckout({
    transaction_id: transactionId,
    amount,
    currency: "XOF",
    channels: "ALL",
    description,
    customer_name: firstName,
    customer_surname: rest.join(" ") || firstName,
    customer_phone_number: customer.phone,
    customer_address: "Côte d'Ivoire",
    customer_city: "Abidjan",
    customer_country: "CI",
    customer_state: "CI",
    customer_zip_code: "00225",
  });
  window.CinetPay.waitResponse((data) => {
    if (data.status === "ACCEPTED") {
      onSuccess && onSuccess(transactionId);
    } else {
      onError && onError("Paiement refusé ou annulé.");
    }
  });
  window.CinetPay.onError((data) => {
    onError && onError("Une erreur est survenue pendant le paiement. Réessaie dans un instant.");
    console.error("Erreur CinetPay (abonnement):", data);
  });
}

// Filet de sécurité "essai + abonnement" : calcule si un vendeur/livreur a encore
// accès (essai en cours OU abonnement actif et non expiré).
function getAccessState(info, trialDays) {
  const trialStartedAt = info.trialStartedAt || Date.now();
  const daysUsed = Math.floor((Date.now() - trialStartedAt) / 86400000);
  const daysLeft = Math.max(0, trialDays - daysUsed);
  const subscriptionActive = info.subscriptionStatus === "active" && info.subscriptionExpiresAt && info.subscriptionExpiresAt > Date.now();
  const trialActive = !subscriptionActive && daysLeft > 0;
  return { subscriptionActive, trialActive, daysLeft, granted: subscriptionActive || trialActive };
}

// Écran de paywall + bandeau d'essai, partagé entre l'espace vendeur et l'espace livreur.
function SubscriptionGate({ role, info, trialDays, accessFee, color, children }) {
  const [paying, setPaying] = useState(false);
  const [payError, setPayError] = useState("");
  const [payNotice, setPayNotice] = useState("");
  const { subscriptionActive, trialActive, daysLeft, granted } = getAccessState(info, trialDays);
  const roleLabel = role === "vendor" ? "vendeur" : "livreur";

  async function pay() {
    setPayError("");
    setPayNotice("");
    setPaying(true);
    try {
      // On relie d'abord un transaction_id à cet abonnement, AVANT de lancer le
      // paiement — c'est ce qui permettra au webhook /api/cinetpay/notify de
      // savoir quoi activer une fois CinetPay confirmé le paiement.
      const transactionId = `ZK-SUB-${role}-${info.phone}-${Date.now()}`;
      await apiSend("/api/payments/pending", "POST", { transactionId, kind: "subscription", role, phone: info.phone, amount: accessFee });
      launchCinetPaySubscription({
        transactionId,
        amount: accessFee,
        description: `Abonnement Zonako ${roleLabel === "vendeur" ? "Vendeur" : "Livreur"} (30 jours)`,
        customer: { name: info.name, phone: info.phone },
        onSuccess: () => {
          setPaying(false);
          setPayNotice("Paiement reçu — vérification en cours, ton abonnement s'activera dans quelques instants.");
        },
        onError: (msg) => { setPaying(false); setPayError(msg); },
      });
    } catch (e) {
      setPaying(false);
      setPayError("Erreur pendant la préparation du paiement. Réessaie.");
    }
  }

  if (!granted) {
    return (
      <div className="max-w-sm mx-auto px-4 py-10 text-center">
        <div className="w-11 h-11 rounded-lg flex items-center justify-center mb-4 mx-auto" style={{ backgroundColor: color }}>
          <Lock size={18} className="text-white" />
        </div>
        <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">
          {info.subscriptionStatus === "active" ? "Abonnement expiré" : "Ton essai gratuit est terminé"}
        </h2>
        <p className="f-body text-sm text-[#14213D]/50 mb-5">
          Pour continuer à utiliser l'espace {roleLabel}, active ton abonnement Zonako : {accessFee.toLocaleString("fr-FR")} F pour 30 jours.
        </p>
        {payError && <p className="f-body text-xs text-[#C1440E] mb-3">{payError}</p>}
        {payNotice && <p className="f-body text-xs text-[#2D6A4F] mb-3">{payNotice}</p>}
        <button
          disabled={paying}
          onClick={pay}
          className="w-full text-white f-display font-semibold py-3 rounded-full text-sm disabled:opacity-40"
          style={{ backgroundColor: color }}
        >
          {paying ? "Paiement en cours…" : `Payer ${accessFee.toLocaleString("fr-FR")} F et activer`}
        </button>
      </div>
    );
  }

  return (
    <>
      {trialActive && (
        <div className="max-w-5xl mx-auto px-4 pt-4">
          <div className="f-mono text-xs bg-[#F2A93B]/15 text-[#14213D] px-3 py-2 rounded-lg flex items-center justify-between gap-2">
            <span>🎁 Essai gratuit : encore {daysLeft} jour{daysLeft > 1 ? "s" : ""}</span>
            <button onClick={pay} disabled={paying} className="f-mono underline whitespace-nowrap">{paying ? "…" : "Payer maintenant"}</button>
          </div>
          {payError && <p className="f-body text-xs text-[#C1440E] px-1 mt-1">{payError}</p>}
          {payNotice && <p className="f-body text-xs text-[#2D6A4F] px-1 mt-1">{payNotice}</p>}
        </div>
      )}
      {subscriptionActive && (
        <div className="max-w-5xl mx-auto px-4 pt-4">
          <p className="f-mono text-[10px] text-[#2D6A4F]">✓ Abonnement actif jusqu'au {new Date(info.subscriptionExpiresAt).toLocaleDateString("fr-FR")}</p>
        </div>
      )}
      {children}
    </>
  );
}

// Compresse une photo choisie par le vendeur (fichier local) en une image légère
// encodée en base64, pour qu'elle puisse être stockée et rechargée instantanément.
function compressImage(file, maxWidth = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function savePhoneToken(phone, token) {
  try { localStorage.setItem(`phone_token_${phone}`, token); } catch { /* échec silencieux */ }
}
function getPhoneToken(phone) {
  try { return localStorage.getItem(`phone_token_${phone}`) || null; } catch { return null; }
}

// Inscription avec vérification du numéro par SMS (code à usage unique). Une fois
// vérifié, le jeton reçu sert à prouver "j'agis bien en tant que ce numéro" pour
// toutes les actions sensibles (publier un produit, commander, confirmer une
// livraison...).
function RegisterWithPhoneVerification({ title, subtitle, accentColor, onSubmit }) {
  const [form, setForm] = useState({ name: "", phone: "" });
  const [step, setStep] = useState("info"); // "info" | "code"
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [testMode, setTestMode] = useState(false);

  async function sendCode() {
    setError("");
    setBusy(true);
    try {
      const r = await apiSend("/api/auth/send-code", "POST", { phone: form.phone });
      setTestMode(!!r.testMode);
      setStep("code");
    } catch {
      setError("Impossible d'envoyer le code. Vérifie le numéro.");
    }
    setBusy(false);
  }

  async function verify() {
    setError("");
    setBusy(true);
    try {
      const { token } = await apiSend("/api/auth/verify-code", "POST", { phone: form.phone, code });
      savePhoneToken(form.phone, token);
      onSubmit(form, token);
    } catch {
      setError("Code incorrect ou expiré.");
    }
    setBusy(false);
  }

  return (
    <div className="max-w-sm mx-auto px-4 py-8">
      <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">{title}</h2>
      <p className="f-body text-sm text-[#14213D]/50 mb-5">{subtitle}</p>
      {step === "info" ? (
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter" && form.name && form.phone) sendCode(); }}>
          <input placeholder="Ton nom" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          <input placeholder="Ton numéro de téléphone" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button
            disabled={!form.name || !form.phone || busy}
            onClick={sendCode}
            className="w-full disabled:opacity-30 text-[#14213D] f-display font-semibold py-3 rounded-full text-sm"
            style={{ backgroundColor: accentColor }}
          >
            {busy ? "Envoi…" : "Recevoir mon code par SMS"}
          </button>
        </div>
      ) : (
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter" && code) verify(); }}>
          <p className="f-body text-xs text-[#14213D]/50">
            Code envoyé au {form.phone}.{testMode ? " (Mode test — pas de Twilio configuré : regarde les logs du serveur pour le code.)" : ""}
          </p>
          <input placeholder="Code reçu par SMS" value={code} onChange={(e) => setCode(e.target.value)} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button disabled={!code || busy} onClick={verify} className="w-full disabled:opacity-30 text-[#14213D] f-display font-semibold py-3 rounded-full text-sm" style={{ backgroundColor: accentColor }}>
            {busy ? "Vérification…" : "Vérifier et entrer"}
          </button>
          <button onClick={() => { setStep("info"); setCode(""); setError(""); }} className="w-full f-mono text-xs text-[#14213D]/40 underline">Changer de numéro</button>
        </div>
      )}
    </div>
  );
}

// Changer de numéro de téléphone (vendeur/livreur) : il faut vérifier le NOUVEAU
// numéro par SMS avant que le changement soit accepté par le serveur — voir
// POST /api/profiles/:role/change-phone.
function ChangePhoneNumber({ role, info, accentColor, onChanged }) {
  const [open, setOpen] = useState(false);
  const [newPhone, setNewPhone] = useState("");
  const [step, setStep] = useState("phone"); // "phone" | "code"
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [testMode, setTestMode] = useState(false);

  async function sendCode() {
    setError("");
    setBusy(true);
    try {
      const r = await apiSend("/api/auth/send-code", "POST", { phone: newPhone });
      setTestMode(!!r.testMode);
      setStep("code");
    } catch {
      setError("Impossible d'envoyer le code. Vérifie le numéro.");
    }
    setBusy(false);
  }

  async function verifyAndChange() {
    setError("");
    setBusy(true);
    try {
      const { token: newToken } = await apiSend("/api/auth/verify-code", "POST", { phone: newPhone, code });
      const profile = await apiSend(`/api/profiles/${role}/change-phone`, "POST", { newPhone, newToken, name: info.name }, getPhoneToken(info.phone));
      savePhoneToken(newPhone, newToken);
      setOpen(false);
      setStep("phone");
      setNewPhone("");
      setCode("");
      onChanged(profile);
    } catch (e) {
      setError(e.message && e.message.includes("déjà utilisé") ? "Ce numéro est déjà utilisé par un autre compte." : "Code incorrect, ou erreur pendant le changement.");
    }
    setBusy(false);
  }

  if (!open) {
    return <button onClick={() => setOpen(true)} className="f-mono text-[10px] text-[#14213D]/35 hover:text-[#14213D] underline">changer de numéro</button>;
  }

  return (
    <div className="ticket bg-white border-2 border-[#14213D]/10 p-3 mt-2 space-y-2">
      <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60">Changer de numéro</p>
      {step === "phone" ? (
        <>
          <input placeholder="Nouveau numéro de téléphone" value={newPhone} onChange={(e) => setNewPhone(e.target.value)} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <div className="flex gap-2">
            <button disabled={!newPhone || busy} onClick={sendCode} className="flex-1 f-mono text-xs disabled:opacity-30 text-white py-2 rounded-full" style={{ backgroundColor: accentColor }}>
              {busy ? "Envoi…" : "Envoyer un code SMS"}
            </button>
            <button onClick={() => setOpen(false)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-2 rounded-full">Annuler</button>
          </div>
        </>
      ) : (
        <>
          <p className="f-body text-xs text-[#14213D]/50">
            Code envoyé au {newPhone}.{testMode ? " (Mode test : regarde les logs du serveur.)" : ""}
          </p>
          <input placeholder="Code reçu par SMS" value={code} onChange={(e) => setCode(e.target.value)} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <div className="flex gap-2">
            <button disabled={!code || busy} onClick={verifyAndChange} className="flex-1 f-mono text-xs disabled:opacity-30 text-white py-2 rounded-full" style={{ backgroundColor: accentColor }}>
              {busy ? "Vérification…" : "Vérifier et changer"}
            </button>
            <button onClick={() => { setOpen(false); setStep("phone"); setError(""); }} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-2 rounded-full">Annuler</button>
          </div>
        </>
      )}
    </div>
  );
}

function BuyerView({ products, zone, setZone, cart, setCart, buyerInfo, registerBuyer, logoutBuyer, placeOrder, cancelOrder, showCart, setShowCart, myOrders, chooseCourierForOrder, confirmDeliveryByBuyer }) {
  const [category, setCategory] = useState("");
  const [view, setView] = useState("browse"); // browse | orders

  const [deliveryZone, setDeliveryZone] = useState("");
  const [shippingMethod, setShippingMethod] = useState("livreur"); // "livreur" | "transport"
  const [paymentMethod, setPaymentMethod] = useState("cinetpay"); // "cinetpay" | "cod"
  const [payProcessing, setPayProcessing] = useState(false);
  const [payError, setPayError] = useState("");
  const [payNotice, setPayNotice] = useState("");

  useEffect(() => {
    if (zone && zone !== NATIONAL && !deliveryZone) setDeliveryZone(zone);
  }, [zone]);

  const filtered = products.filter((p) => {
    const zoneMatch = !zone || zone === NATIONAL || p.zone === zone || p.zone === NATIONAL;
    return zoneMatch && (!category || p.category === category);
  });

  if (!buyerInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace acheteur"
        subtitle="Entre tes infos pour commander et suivre tes livraisons."
        accentColor="#F2A93B"
        onSubmit={(form) => registerBuyer(form)}
      />
    );
  }

  function addToCart(p) {
    setCart((c) => {
      const existing = c.find((i) => i.id === p.id);
      if (existing) return c.map((i) => (i.id === p.id ? { ...i, qty: i.qty + 1 } : i));
      return [...c, { id: p.id, name: p.name, price: p.price, qty: 1, vendorName: p.vendorName, vendorPhone: p.vendorPhone, zone: p.zone, deliveryTime: p.deliveryTime }];
    });
  }
  function changeQty(id, delta) {
    setCart((c) => c.map((i) => (i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i)).filter((i) => i.qty > 0));
  }
  const goodsTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  // Les frais de livraison ne sont plus fixés par le vendeur : c'est le livreur qui
  // propose son prix au moment d'accepter la commande, et l'acheteur le règle
  // directement au livreur (en espèces) à la livraison — indépendamment du paiement
  // des articles en ligne ou à la commande.
  const total = goodsTotal;


  // Lance le guichet de paiement CinetPay (mobile money, carte...). À la confirmation
  // ("ACCEPTED"), on enregistre la commande comme payée. En cas de refus/annulation,
  // on laisse l'acheteur réessayer ou basculer sur le paiement à la livraison.
  async function launchCinetPayCheckout() {
    setPayError("");
    if (!window.CinetPay) {
      setPayError("Le module de paiement n'a pas pu se charger (vérifie ta connexion internet) — réessaie, ou choisis « paiement à la livraison ».");
      return;
    }
    setPayProcessing(true);
    try {
      // La commande est créée tout de suite, non payée — c'est /api/cinetpay/notify
      // (vérifié auprès de CinetPay côté serveur) qui la marquera payée. Si le
      // paiement échoue, on annule automatiquement cette commande.
      const order = await placeOrder(total, 0, deliveryZone, { paymentMethod: "cinetpay" }, shippingMethod);
      const transactionId = `ZK-${order.id}`;
      await apiSend("/api/payments/pending", "POST", { transactionId, kind: "order", orderId: order.id, amount: total }, getPhoneToken(buyerInfo.phone));

      const [firstName, ...rest] = (buyerInfo.name || "Client").trim().split(" ");
      window.CinetPay.setConfig({
        apikey: CINETPAY_CONFIG.apikey,
        site_id: CINETPAY_CONFIG.site_id,
        mode: CINETPAY_CONFIG.mode,
        notify_url: CINETPAY_CONFIG.notify_url,
      });
      window.CinetPay.getCheckout({
        transaction_id: transactionId,
        amount: total,
        currency: "XOF",
        channels: "ALL",
        description: `Commande Zonako · ${order.items.length} article${order.items.length > 1 ? "s" : ""}`,
        customer_name: firstName,
        customer_surname: rest.join(" ") || firstName,
        customer_phone_number: buyerInfo.phone,
        customer_address: deliveryZone || zone || "Côte d'Ivoire",
        customer_city: (deliveryZone || zone || "Abidjan").split(" – ")[0],
        customer_country: "CI",
        customer_state: "CI",
        customer_zip_code: "00225",
      });
      window.CinetPay.waitResponse((data) => {
        setPayProcessing(false);
        if (data.status === "ACCEPTED") {
          setPayNotice("Paiement reçu — vérification en cours, ta commande passera « payée » dans quelques instants.");
        } else {
          cancelOrder(order.id, true);
          setPayError("Paiement refusé ou annulé — la commande a été annulée. Tu peux réessayer, ou choisir « paiement à la livraison ».");
        }
      });
      window.CinetPay.onError((data) => {
        setPayProcessing(false);
        cancelOrder(order.id, true);
        setPayError("Une erreur est survenue pendant le paiement — la commande a été annulée. Réessaie dans un instant.");
        console.error("Erreur CinetPay:", data);
      });
    } catch (e) {
      setPayProcessing(false);
      setPayError("Erreur pendant la préparation de la commande. Réessaie.");
    }
  }

  function handleCheckout() {
    if (paymentMethod === "cod") {
      placeOrder(total, 0, deliveryZone, { paymentMethod: "cod" }, shippingMethod);
    } else {
      launchCinetPayCheckout();
    }
  }

  return (
    <div className="max-w-5xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-5">
        <div className="flex items-center gap-2">
          <button onClick={() => setView("browse")} className={`f-mono text-xs px-3 py-1.5 rounded-full ${view === "browse" ? "bg-[#14213D] text-white" : "bg-[#14213D]/5 text-[#14213D]/60"}`}>Parcourir</button>
          <button onClick={() => setView("orders")} className={`f-mono text-xs px-3 py-1.5 rounded-full ${view === "orders" ? "bg-[#14213D] text-white" : "bg-[#14213D]/5 text-[#14213D]/60"}`}>Mes commandes ({myOrders.length})</button>
        </div>
        <div className="flex items-center gap-2">
          <span className="f-mono text-xs text-[#14213D]/40 hidden sm:inline">{buyerInfo.name}</span>
          <button onClick={logoutBuyer} className="f-mono text-[11px] text-[#14213D]/40 hover:text-[#C1440E]">Changer de compte</button>
        </div>
      </div>

      {view === "browse" && (
        <>
          <div className="grid sm:grid-cols-2 gap-3 mb-5 bg-white ticket border-2 border-[#14213D]/10 p-4">
            <ZonePicker value={zone} onChange={setZone} allowNational />
            <div>
              <label className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 block mb-1.5">Catégorie</label>
              <select value={category} onChange={(e) => setCategory(e.target.value)} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-[#14213D] text-sm focus:outline-none focus:border-[#F2A93B]">
                <option value="">Toutes</option>
                {CATEGORIES.map((c) => <option key={c.name} value={c.name}>{c.emoji} {c.name}</option>)}
              </select>
            </div>
          </div>

          {!zone && (
            <div className="text-center py-16 text-[#14213D]/40 f-body text-sm">Choisis une zone (ou « {NATIONAL} ») pour voir les produits disponibles.</div>
          )}
          {zone && filtered.length === 0 && (
            <div className="text-center py-16 text-[#14213D]/40 f-body text-sm">Aucun produit pour l'instant {zone === NATIONAL ? "sur tout le territoire" : `dans « ${zone} »`}{category ? ` en ${category}` : ""}.</div>
          )}

          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map((p) => {
              const cat = CATEGORIES.find((c) => c.name === p.category);
              return (
                <div key={p.id} className="ticket bg-white border-2 border-[#14213D]/10 overflow-hidden flex flex-col">
                  <div className="h-28 flex items-center justify-center text-4xl bg-[#FBF7F0] overflow-hidden">
                    {p.imageUrl ? (
                      <img src={p.imageUrl} alt={p.name} className="w-full h-full object-cover" onError={(e) => { e.target.style.display = "none"; e.target.parentElement.textContent = cat?.emoji || "📦"; }} />
                    ) : (cat?.emoji || "📦")}
                  </div>
                  <div className="p-4 border-t-2 border-dashed border-[#14213D]/15 flex-1 flex flex-col">
                    <div className="flex items-start justify-between gap-2">
                      <h4 className="f-display font-semibold text-[#14213D] text-sm leading-snug">{p.name}</h4>
                    </div>
                    <p className="f-mono text-[10px] text-[#14213D]/40 mt-1">{p.vendorName} · {zoneLabel(p.zone)}</p>
                    <div className="flex items-center gap-2 mt-2">
                      <span className="f-mono text-[10px] text-[#14213D]/50 bg-[#14213D]/5 px-1.5 py-0.5 rounded">Stock: {p.stock ?? 0}</span>
                      <span className="f-mono text-[10px] text-[#2D6A4F] bg-[#2D6A4F]/10 px-1.5 py-0.5 rounded">🚚 {p.deliveryTime || "Non précisé"}</span>
                    </div>
                    <p className="f-mono text-[10px] text-[#14213D]/40 mt-1">
                      Frais de livraison fixés par le livreur à l'acceptation
                    </p>
                    <div className="flex items-center justify-between mt-3 pt-3 border-t border-[#14213D]/10">
                      <span className="f-mono font-semibold text-[#C1440E]">{p.price.toLocaleString("fr-FR")} F</span>
                      <button
                        disabled={(p.stock ?? 0) <= 0}
                        onClick={() => addToCart(p)}
                        className="f-mono text-xs bg-[#14213D] disabled:opacity-30 text-white px-3 py-1.5 rounded-full hover:bg-[#F2A93B] hover:text-[#14213D] transition-colors"
                      >
                        {(p.stock ?? 0) <= 0 ? "Épuisé" : "Ajouter"}
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}

      {view === "orders" && (
        <div className="space-y-3">
          {myOrders.length === 0 && <div className="text-center py-16 text-[#14213D]/40 f-body text-sm">Aucune commande pour l'instant.</div>}
          {myOrders.map((o) => (
            <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="f-mono text-[11px] text-[#14213D]/50">#{o.id.slice(-6)} · {o.zone}</span>
                <StatusBadge status={o.status} />
              </div>
              <ul className="f-body text-sm text-[#14213D]/70">
                {o.items.map((it) => <li key={it.id}>{it.qty}× {it.name}</li>)}
              </ul>
              <div className="flex items-center justify-between mt-2">
                <p className="f-mono text-sm font-semibold text-[#14213D]">{o.total.toLocaleString("fr-FR")} F</p>
                <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded ${o.paid ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/50"}`}>
                  {o.paid ? "✓ Payé en ligne" : "À payer à la livraison"}
                </span>
              </div>
              {o.shippingMethod === "transport" && (
                <p className="f-mono text-[10px] text-[#14213D]/50 mt-1">
                  🚌 {o.transportCompany ? `${o.transportCompany} · Suivi: ${o.trackingNumber || "en attente"}` : "En attente de prise en charge par le vendeur"}
                </p>
              )}
              {o.shippingMethod === "livreur" && o.courierName && (
                <div className="mt-1">
                  <p className="f-mono text-[10px] text-[#14213D]/50">
                    🏍️ {o.courierName} · Frais de livraison (à régler au livreur) : {(o.deliveryFee || 0).toLocaleString("fr-FR")} F
                  </p>
                  {o.status !== "livree" && !o.buyerConfirmed && (
                    <button onClick={() => confirmDeliveryByBuyer(o.id)} className="w-full f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full mt-1.5">
                      J'ai reçu ma commande
                    </button>
                  )}
                  {o.buyerConfirmed && (
                    <p className="f-mono text-[10px] text-[#2D6A4F] mt-1">
                      ✓ Toi : réception confirmée{o.courierConfirmed ? " · ✓ Livreur : livraison confirmée" : " — en attente que le livreur confirme"}
                    </p>
                  )}
                </div>
              )}
              {o.shippingMethod === "livreur" && !o.courierName && (
                <div className="mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                  {(o.courierBids || []).length === 0 ? (
                    <p className="f-mono text-[10px] text-[#14213D]/40">🏍️ En attente de propositions de prix des livreurs…</p>
                  ) : (
                    <>
                      <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1.5">Propositions des livreurs — choisis la tienne</p>
                      <div className="space-y-1.5">
                        {[...o.courierBids].sort((a, b) => a.fee - b.fee).map((b, i) => (
                          <div key={b.courierPhone} className="flex items-center justify-between bg-[#14213D]/5 rounded-lg px-2.5 py-1.5">
                            <span className="f-body text-xs text-[#14213D]">
                              {b.courierName} {i === 0 && <span className="f-mono text-[9px] bg-[#2D6A4F] text-white px-1.5 py-0.5 rounded-full ml-1">MEILLEUR PRIX</span>}
                            </span>
                            <div className="flex items-center gap-2">
                              <span className="f-mono text-xs font-semibold text-[#14213D]">{b.fee.toLocaleString("fr-FR")} F</span>
                              <button onClick={() => chooseCourierForOrder(o.id, b)} className="f-mono text-[10px] bg-[#C1440E] text-white px-2 py-1 rounded-full">Choisir</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              )}
              <OrderTimeline status={o.status} shippingMethod={o.shippingMethod} />
            </div>
          ))}
        </div>
      )}

      {showCart && (
        <div className="fixed inset-0 z-40 flex justify-end">
          <div className="absolute inset-0 bg-[#14213D]/40" onClick={() => setShowCart(false)} />
          <div className="relative bg-[#FBF7F0] w-full max-w-sm h-full p-5 overflow-y-auto">
            <div className="flex items-center justify-between mb-5">
              <h3 className="f-display font-semibold text-lg text-[#14213D]">Ton panier</h3>
              <button onClick={() => setShowCart(false)}><X size={20} className="text-[#14213D]/50" /></button>
            </div>
            {cart.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Panier vide.</p>}
            <div className="space-y-3">
              {cart.map((i) => (
                <div key={i.id} className="bg-white ticket border-2 border-[#14213D]/10 p-3 flex items-center justify-between">
                  <div>
                    <p className="f-body text-sm font-medium text-[#14213D]">{i.name}</p>
                    <p className="f-mono text-xs text-[#14213D]/40">{i.price.toLocaleString("fr-FR")} F</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => changeQty(i.id, -1)} className="w-6 h-6 rounded-full bg-[#14213D]/10 f-mono text-sm">−</button>
                    <span className="f-mono text-sm w-4 text-center">{i.qty}</span>
                    <button onClick={() => changeQty(i.id, 1)} className="w-6 h-6 rounded-full bg-[#14213D]/10 f-mono text-sm">+</button>
                  </div>
                </div>
              ))}
            </div>
            {cart.length > 0 && (
              <>
                <div className="mt-5 pt-4 border-t-2 border-dashed border-[#14213D]/15 space-y-3">
                  <p className="f-body text-xs text-[#14213D]/50">Commande au nom de <span className="font-semibold text-[#14213D]">{buyerInfo.name}</span> · {buyerInfo.phone}</p>
                  <div>
                    <label className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 block mb-1.5">Mode d'expédition</label>
                    <div className="grid grid-cols-1 gap-2">
                      <button
                        onClick={() => setShippingMethod("livreur")}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 text-left ${shippingMethod === "livreur" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        🏍️ Livraison locale par livreur — même zone/ville
                      </button>
                      <button
                        onClick={() => setShippingMethod("transport")}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 text-left ${shippingMethod === "transport" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        🚌 Expédition vers une autre ville — via compagnie de transport
                      </button>
                    </div>
                    {shippingMethod === "transport" && (
                      <p className="f-body text-[11px] text-[#14213D]/50 mt-1.5">Le vendeur confiera ton colis à une compagnie de transport et t'enverra le nom de la compagnie et le numéro de suivi. Tu récupères le colis à la gare/agence de la ville de destination.</p>
                    )}
                  </div>
                  <ZonePicker value={deliveryZone} onChange={setDeliveryZone} label={shippingMethod === "transport" ? "Ville de destination" : "Zone de livraison (précise)"} />
                  <div className="space-y-1">
                    <div className="flex items-center justify-between">
                      <span className="f-body text-xs text-[#14213D]/50">Sous-total articles</span>
                      <span className="f-mono text-xs text-[#14213D]/70">{goodsTotal.toLocaleString("fr-FR")} F</span>
                    </div>
                    <div className="flex items-center justify-between pt-1">
                      <span className="f-body text-sm text-[#14213D]/60">Total (articles)</span>
                      <span className="f-mono font-semibold text-lg text-[#14213D]">{total.toLocaleString("fr-FR")} F</span>
                    </div>
                    {shippingMethod === "livreur" && (
                      <p className="f-body text-[11px] text-[#14213D]/40 pt-1">+ frais de livraison fixés par le livreur, à régler directement à lui à la livraison.</p>
                    )}
                  </div>
                  <div>
                    <label className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 block mb-1.5">Mode de paiement</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => { setPaymentMethod("cinetpay"); setPayError(""); }}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 ${paymentMethod === "cinetpay" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        📱 Mobile Money / Carte
                      </button>
                      <button
                        onClick={() => { setPaymentMethod("cod"); setPayError(""); }}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 ${paymentMethod === "cod" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        💵 À la livraison
                      </button>
                    </div>
                  </div>
                  {payError && <p className="f-body text-xs text-[#C1440E]">{payError}</p>}
                  {payNotice && <p className="f-body text-xs text-[#2D6A4F]">{payNotice}</p>}
                  <button
                    disabled={!deliveryZone || payProcessing}
                    onClick={handleCheckout}
                    className="w-full bg-[#C1440E] disabled:opacity-30 text-white f-display font-semibold py-3 rounded-full text-sm"
                  >
                    {payProcessing ? "Paiement en cours…" : paymentMethod === "cinetpay" ? `Payer ${total.toLocaleString("fr-FR")} F` : "Commander (paiement à la livraison)"}
                  </button>
                  {!deliveryZone && <p className="f-body text-xs text-[#C1440E]">Précise une zone de livraison exacte avant de commander (même si tu as parcouru en mode national).</p>}
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function VendorView({ vendorInfo, registerVendor, logoutVendor, products, addProduct, updateProduct, deleteProduct, orders, confirmOrder, cancelOrder, shipOrder, updateStatus, setRole, trialDays, accessFee, onPhoneChanged }) {
  const [shipForm, setShipForm] = useState({}); // { [orderId]: { company, tracking } }
  const [form, setForm] = useState({ name: "", price: "", category: CATEGORIES[0].name, zone: "", stock: "", imageUrl: "", deliveryTime: "" });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [editingProfile, setEditingProfile] = useState(false);
  const [profileForm, setProfileForm] = useState({ name: vendorInfo.name, phone: vendorInfo.phone });
  const [publishing, setPublishing] = useState(false);

  const [uploadingEditImg, setUploadingEditImg] = useState(false);
  const myProducts = products.filter((p) => p.vendorPhone === vendorInfo.phone);
  const myOrders = orders.filter((o) => o.items.some((it) => myProducts.some((p) => p.id === it.id)));

  if (!vendorInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace vendeur"
        subtitle="Entre tes infos pour publier des produits."
        accentColor="#2D6A4F"
        onSubmit={(form) => registerVendor(form)}
      />
    );
  }

  function startEdit(p) {
    setEditingId(p.id);
    setEditForm({ price: p.price, stock: p.stock, deliveryTime: p.deliveryTime || "", imageUrl: p.imageUrl || "" });
  }
  function saveEdit(id) {
    updateProduct(id, { price: Number(editForm.price), stock: Number(editForm.stock), deliveryTime: editForm.deliveryTime || "Non précisé", imageUrl: editForm.imageUrl || "" });
    setEditingId(null);
  }
  async function handleImageUpload(file, target) {
    if (!file) return;
    if (target === "new") setUploadingImg(true); else setUploadingEditImg(true);
    try {
      const dataUrl = await compressImage(file);
      if (target === "new") setForm((f) => ({ ...f, imageUrl: dataUrl }));
      else setEditForm((f) => ({ ...f, imageUrl: dataUrl }));
    } catch {
      // photo illisible, on laisse le champ tel quel
    }
    if (target === "new") setUploadingImg(false); else setUploadingEditImg(false);
  }
  function saveProfile() {
    registerVendor(profileForm);
    setEditingProfile(false);
  }

  const totalRevenueNet = myOrders.reduce((s, o) => {
    const myIds = myProducts.map((p) => p.id);
    const sub = o.items.filter((it) => myIds.includes(it.id)).reduce((a, it) => a + it.price * it.qty, 0);
    return s + sub * (1 - (o.feeRate ?? 0));
  }, 0);

  return (
    <SubscriptionGate role="vendor" info={vendorInfo} trialDays={trialDays} accessFee={accessFee} color="#2D6A4F">
    <div className="max-w-5xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-1">
        {editingProfile ? (
          <div className="flex items-center gap-2 flex-1 max-w-sm" onKeyDown={(e) => { if (e.key === "Enter") saveProfile(); }}>
            <input value={profileForm.name} onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })} className="f-body flex-1 px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-sm" placeholder="Nom" />
            <button onClick={saveProfile} className="f-mono text-xs bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full">OK</button>
          </div>
        ) : (
          <h2 className="f-display font-semibold text-xl text-[#14213D] flex items-center gap-2">
            Bonjour, {vendorInfo.name}
            <button onClick={() => { setProfileForm({ name: vendorInfo.name, phone: vendorInfo.phone }); setEditingProfile(true); }} className="f-mono text-[10px] text-[#14213D]/35 hover:text-[#2D6A4F] underline font-normal">modifier le nom</button>
          </h2>
        )}
        <div className="flex items-center gap-3">
          <button onClick={() => setRole("owner")} className="f-mono text-[11px] text-[#14213D]/30 hover:text-[#14213D]/60 flex items-center gap-1">

          <button onClick={logoutVendor} className="f-mono text-[11px] text-[#14213D]/40 hover:text-[#C1440E]">Changer de compte</button>

      </div>
      <div className="mb-6 flex items-center gap-2">
        <p className="f-mono text-[11px] text-[#14213D]/40">{vendorInfo.phone}</p>

      <div className="grid grid-cols-3 gap-3 mb-6">

          <p className="f-display font-semibold text-lg text-[#14213D]">{myProducts.length}</p>
          <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Produits</p>

        <div className="ticket bg-white border-2 border-[#14213D]/10 p-3 text-center">

      <div className="grid lg:grid-cols-[320px_1fr] gap-6">

          <div className="space-y-2.5">

            <div>

                <label className="flex-1 f-mono text-xs text-center bg-[#14213D]/5 hover:bg-[#14213D]/10 text-[#14213D]/60 py-2 rounded-lg cursor-pointer">
                  {uploadingImg ? "Compression…" : form.imageUrl ? "Changer la photo" : "Choisir une photo"}
                  <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e.target.files[0], "new")} />
                </label>
                {form.imageUrl && <button onClick={() => setForm({ ...form, imageUrl: "" })}><X size={16} className="text-[#C1440E]/60" /></button>}
              </div>
              <p className="f-body text-[10px] text-[#14213D]/35 mt-1">Prise depuis ton téléphone ou ton ordinateur — compressée automatiquement.</p>
            </div>

            <input placeholder="Prix (FCFA)" type="number" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm focus:outline-none focus:border-[#2D6A4F]" />
            <input placeholder="Stock disponible" type="number" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm focus:outline-none focus:border-[#2D6A4F]" />
            <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm">
              {CATEGORIES.map((c) => <option key={c.name} value={c.name}>{c.emoji} {c.name}</option>)}
            </select>
            <select value={form.zone} onChange={(e) => setForm({ ...form, zone: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm">
              <option value="">Zone de vente…</option>
              <option value={NATIONAL}>🌍 {NATIONAL}</option>
              {ZONES.map((z) => <option key={z} value={z}>{z}</option>)}
            </select>
            <p className="f-body text-[10px] text-[#14213D]/35 -mt-1">Choisis une zone précise pour vendre localement, ou « {NATIONAL} » pour être visible partout.</p>
            <input placeholder="Délai de préparation (ex: 24h)" value={form.deliveryTime} onChange={(e) => setForm({ ...form, deliveryTime: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm focus:outline-none focus:border-[#2D6A4F]" />
            <p className="f-body text-[11px] text-[#14213D]/40">Les frais de livraison ne sont plus fixés ici : c'est le livreur qui propose son prix quand il accepte la commande.</p>
            <button
              disabled={!form.name || !form.price || !form.zone || publishing}
              onClick={async () => {
                setPublishing(true);
                await addProduct({ ...form, price: Number(form.price), stock: Number(form.stock) || 0, deliveryTime: form.deliveryTime || "Non précisé", vendorName: vendorInfo.name, vendorPhone: vendorInfo.phone });
                setForm({ name: "", price: "", category: CATEGORIES[0].name, zone: "", stock: "", imageUrl: "", deliveryTime: "" });
                setPublishing(false);

              className="w-full bg-[#2D6A4F] disabled:opacity-30 text-white f-display font-semibold py-2.5 rounded-full text-sm mt-1"

        </div>

        <div>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Mes produits ({myProducts.length})</h3>
          <div className="grid sm:grid-cols-2 gap-3 mb-6">
            {myProducts.map((p) => (
              <div key={p.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">

                  <div className="space-y-2">
                    <p className="f-body text-sm font-medium text-[#14213D]">{p.name}</p>

                        {uploadingEditImg ? "Compression…" : "Changer la photo"}
                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e.target.files[0], "edit")} />
                      </label>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" placeholder="Prix" value={editForm.price} onChange={(e) => setEditForm({ ...editForm, price: e.target.value })} className="f-mono w-full px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
                      <input type="number" placeholder="Stock" value={editForm.stock} onChange={(e) => setEditForm({ ...editForm, stock: e.target.value })} className="f-mono w-full px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
                      <input placeholder="Délai" value={editForm.deliveryTime} onChange={(e) => setEditForm({ ...editForm, deliveryTime: e.target.value })} className="f-mono w-full px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => saveEdit(p.id)} className="flex-1 f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">Enregistrer</button>
                      <button onClick={() => setEditingId(null)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-1.5 rounded-full">Annuler</button>
                    </div>

                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      {p.imageUrl && <img src={p.imageUrl} alt="" className="w-10 h-10 rounded-lg object-cover border-2 border-[#14213D]/10" />}

                        <p className="f-mono text-[10px] text-[#2D6A4F]">🚚 {p.deliveryTime || "Non précisé"} · frais fixés par le livreur</p>

                    <div className="flex items-center gap-2">

                <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">

                      <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {mySubtotal.toLocaleString("fr-FR")} F brut</p>
                      <p className="f-mono text-xs text-[#2D6A4F] font-semibold">Net à recevoir : {net.toLocaleString("fr-FR")} F <span className="text-[#14213D]/30 font-normal">(après {Math.round(rate * 100)}% de commission)</span></p>
                      <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                        <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded inline-block ${o.paid ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/50"}`}>
                          {o.paid ? "✓ Payé en ligne" : "Paiement à la livraison"}
                        </span>
                        {o.shippingMethod === "transport" && (
                          <span className="f-mono text-[10px] px-1.5 py-0.5 rounded inline-block bg-[#3B6FA0]/10 text-[#3B6FA0]">🚌 Expédition transport → {o.zone}</span>
                        )}
                        {o.shippingMethod === "livreur" && (
                          <span className="f-mono text-[10px] px-1.5 py-0.5 rounded inline-block bg-[#C1440E]/10 text-[#C1440E]">
                            🏍️ {o.courierName ? `${o.courierName} · ${(o.deliveryFee || 0).toLocaleString("fr-FR")} F` : (o.courierBids || []).length > 0 ? `${o.courierBids.length} proposition(s) en attente du choix du client` : "En attente de livreurs"}
                          </span>
                        )}
                        {o.shippingMethod === "livreur" && o.courierName && (
                          <>
                            <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded inline-block ${o.courierConfirmed ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/40"}`}>
                              {o.courierConfirmed ? "✓ Colis remis par le livreur" : "En attente de remise par le livreur"}
                            </span>
                            <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded inline-block ${o.buyerConfirmed ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/40"}`}>
                              {o.buyerConfirmed ? "✓ Réception confirmée par le client" : "En attente de confirmation du client"}
                            </span>
                          </>
                        )}
                      </div>
                    </div>
                    <StatusBadge status={o.status} />
                  </div>
                  {o.status === "nouvelle" && (
                    <div className="flex gap-2 mt-3 pt-3 border-t border-dashed border-[#14213D]/10">
                      <button onClick={() => confirmOrder(o.id)} className="flex-1 f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">Confirmer la commande</button>
                      <button onClick={() => cancelOrder(o.id)} className="flex-1 f-mono text-xs bg-[#C1440E]/10 text-[#C1440E] py-1.5 rounded-full">Annuler</button>
                    </div>
                  )}
                  {o.status === "confirmee" && o.shippingMethod === "transport" && (
                    <div className="mt-3 pt-3 border-t border-dashed border-[#14213D]/10 space-y-2">
                      <p className="f-body text-[11px] text-[#14213D]/50">Remets le colis à une compagnie de transport vers {o.zone}, puis renseigne les infos pour que {o.buyerName} puisse suivre et récupérer sa commande.</p>
                      <input
                        placeholder="Compagnie de transport (ex : UTB, Express Union...)"
                        value={shipForm[o.id]?.company || ""}
                        onChange={(e) => setShipForm({ ...shipForm, [o.id]: { ...shipForm[o.id], company: e.target.value } })}
                        className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-xs focus:outline-none focus:border-[#3B6FA0]"
                      />
                      <input
                        placeholder="Numéro de suivi / bordereau"
                        value={shipForm[o.id]?.tracking || ""}
                        onChange={(e) => setShipForm({ ...shipForm, [o.id]: { ...shipForm[o.id], tracking: e.target.value } })}
                        className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-xs focus:outline-none focus:border-[#3B6FA0]"
                      />
                      <button
                        disabled={!shipForm[o.id]?.company}
                        onClick={() => shipOrder(o.id, shipForm[o.id].company, shipForm[o.id]?.tracking || "")}
                        className="w-full f-mono text-xs bg-[#3B6FA0] disabled:opacity-30 text-white py-1.5 rounded-full"
                      >
                        Marquer expédiée (transport)
                      </button>
                    </div>
                  )}
                  {o.status === "en_transit" && o.shippingMethod === "transport" && (
                    <div className="mt-3 pt-3 border-t border-dashed border-[#14213D]/10 space-y-1.5">
                      <p className="f-mono text-[11px] text-[#3B6FA0]">🚌 {o.transportCompany} · Suivi : {o.trackingNumber || "—"}</p>
                      <button onClick={() => updateStatus(o.id, "livree")} className="w-full f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">Marquer récupérée par le client</button>
                    </div>
                  )}
                </div>
              );
            })}
            {myOrders.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune commande pour l'instant.</p>}
          </div>
        </div>
      </div>
    </div>
    </SubscriptionGate>
  );
}

function CourierView({ courierInfo, registerCourier, logoutCourier, orders, submitCourierBid, updateStatus, confirmDeliveryByCourier, trialDays, accessFee, onPhoneChanged }) {
  const [zone, setZone] = useState("");
  const [feeInputs, setFeeInputs] = useState({}); // { [orderId]: proposedFee }
  const available = orders.filter((o) => !o.courierPhone && o.status !== "annulee" && o.status !== "livree" && o.shippingMethod !== "transport" && (!zone || o.zone === zone));
  const mine = orders.filter((o) => o.courierPhone === courierInfo.phone && o.status !== "livree" && o.status !== "annulee");
  const delivered = orders.filter((o) => o.courierPhone === courierInfo.phone && o.status === "livree");

  if (!courierInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace livreur"
        subtitle="Entre tes infos pour voir les livraisons disponibles."
        accentColor="#C1440E"
        onSubmit={(form) => registerCourier(form)}
      />
    );
  }

  return (
    <SubscriptionGate role="courier" info={courierInfo} trialDays={trialDays} accessFee={accessFee} color="#C1440E">
    <div className="max-w-5xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-1">
        <h2 className="f-display font-semibold text-xl text-[#14213D]">Bonjour, {courierInfo.name}</h2>
        <button onClick={logoutCourier} className="f-mono text-[11px] text-[#14213D]/40 hover:text-[#C1440E]">Changer de compte</button>
      </div>
      <div className="mb-5 flex items-center gap-2">
        <p className="f-mono text-[11px] text-[#14213D]/40">{courierInfo.phone}</p>
        <ChangePhoneNumber role="courier" info={courierInfo} accentColor="#C1440E" onChanged={onPhoneChanged} />
      </div>

      {mine.length > 0 && (
        <>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Mes livraisons en cours</h3>
          <div className="space-y-2 mb-6">
            {mine.map((o) => (
              <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
                <div className="flex items-center justify-between">
                  <div>
                    <p className="f-body text-sm text-[#14213D]">{o.zone} · {o.total.toLocaleString("fr-FR")} F (articles)</p>
                    <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {o.items.length} article(s)</p>
                    <p className="f-mono text-xs text-[#2D6A4F] font-semibold">Tes frais de livraison : {(o.deliveryFee || 0).toLocaleString("fr-FR")} F</p>
                  </div>
                  {!o.courierConfirmed && (
                    <button onClick={() => confirmDeliveryByCourier(o.id)} className="f-mono text-xs bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full whitespace-nowrap">Marquer livrée</button>
                  )}
                </div>
                {o.courierConfirmed && (
                  <p className="f-mono text-[10px] text-[#2D6A4F] mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                    ✓ Toi : livraison confirmée{o.buyerConfirmed ? " · ✓ Client : réception confirmée" : " — en attente que le client confirme la réception"}
                  </p>
                )}
              </div>
            ))}
          </div>
        </>
      )}

      <div className="flex items-center justify-between mb-3">
        <h3 className="f-display font-semibold text-sm text-[#14213D]">Livraisons disponibles ({available.length})</h3>
        <select value={zone} onChange={(e) => setZone(e.target.value)} className="f-mono text-xs px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15">
          <option value="">🌍 Toutes les zones (national)</option>
          {ZONES.map((z) => <option key={z} value={z}>{z}</option>)}
        </select>
      </div>
      <div className="space-y-2 mb-6">
        {available.map((o) => {
          const myBid = (o.courierBids || []).find((b) => b.courierPhone === courierInfo.phone);
          const otherBidsCount = (o.courierBids || []).length - (myBid ? 1 : 0);
          const isNew = Date.now() - o.createdAt < 2 * 60 * 1000;
          return (
            <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
              <div className="flex items-center justify-between">
                <div>
                  <p className="f-body text-sm text-[#14213D] flex items-center gap-1.5">
                    {o.zone} · {o.total.toLocaleString("fr-FR")} F (articles)
                    {isNew && <span className="f-mono text-[9px] bg-[#C1440E] text-white px-1.5 py-0.5 rounded-full">NOUVEAU</span>}
                  </p>
                  <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {o.items.length} article(s)</p>
                  {otherBidsCount > 0 && <p className="f-mono text-[10px] text-[#14213D]/40">{otherBidsCount} autre{otherBidsCount > 1 ? "s" : ""} livreur{otherBidsCount > 1 ? "s ont" : " a"} déjà proposé un prix</p>}
                </div>
              </div>
              <div className="flex items-center gap-2 mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                <input
                  type="number"
                  placeholder="Tes frais (FCFA)"
                  value={feeInputs[o.id] ?? (myBid ? myBid.fee : "")}
                  onChange={(e) => setFeeInputs({ ...feeInputs, [o.id]: e.target.value })}
                  className="f-mono flex-1 px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs focus:outline-none focus:border-[#C1440E]"
                />
                <button
                  disabled={!(feeInputs[o.id] ?? myBid?.fee)}
                  onClick={() => submitCourierBid(o.id, courierInfo, feeInputs[o.id] ?? myBid.fee)}
                  className="f-mono text-xs bg-[#14213D] disabled:opacity-30 text-white px-3 py-1.5 rounded-full whitespace-nowrap"
                >
                  {myBid ? "Mettre à jour ton prix" : "Proposer ce prix"}
                </button>
              </div>
              {myBid && <p className="f-mono text-[10px] text-[#2D6A4F] mt-1">Ta proposition actuelle : {myBid.fee.toLocaleString("fr-FR")} F — en attente du choix de l'acheteur</p>}
            </div>
          );
        })}
        {available.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune livraison disponible pour l'instant.</p>}
      </div>

      {delivered.length > 0 && (
        <>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Historique ({delivered.length})</h3>
          <div className="space-y-2 opacity-60">
            {delivered.map((o) => (
              <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3 flex items-center justify-between">
                <p className="f-body text-sm text-[#14213D]">{o.zone} · {o.total.toLocaleString("fr-FR")} F</p>
                <StatusBadge status={o.status} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
    </SubscriptionGate>
  );
}

function OwnerView({ orders, feeRate, updateFeeRate, accessFee, trialDays, updateAccessSettings, ownerPayoutInfo, updateOwnerPayoutInfo, ownerToken, setOwnerToken }) {
  const [code, setCode] = useState("");
  const [rateInput, setRateInput] = useState(String(Math.round(feeRate * 100)));
  const [accessFeeInput, setAccessFeeInput] = useState(String(accessFee));
  const [trialDaysInput, setTrialDaysInput] = useState(String(trialDays));
  const [payoutInput, setPayoutInput] = useState(ownerPayoutInfo || "");
  const [error, setError] = useState("");
  const [loggingIn, setLoggingIn] = useState(false);

  async function login() {
    setError("");
    setLoggingIn(true);
    try {
      const { token } = await apiSend("/api/owner/login", "POST", { code });
      setOwnerToken(token);
    } catch (e) {
      setError("Code incorrect.");
    }
    setLoggingIn(false);
  }

  // Le code d'accès vit uniquement dans la variable d'environnement OWNER_PASSCODE
  // du serveur — jamais dans ce fichier ni dans le navigateur. C'est le serveur qui
  // vérifie le code et délivre un jeton temporaire (12h) pour les actions protégées.
  if (!ownerToken) {
    return (
      <div className="max-w-sm mx-auto px-4 py-8">
        <div className="w-11 h-11 rounded-lg bg-[#14213D] flex items-center justify-center mb-4">
          <Lock size={18} className="text-[#F2A93B]" />
        </div>
        <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">Espace propriétaire</h2>
        <p className="f-body text-sm text-[#14213D]/50 mb-5">Accès réservé — entre ton code.</p>
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter") login(); }}>
          <input
            type="password"
            placeholder="Code d'accès"
            value={code}
            onChange={(e) => { setCode(e.target.value); setError(""); }}
            onFocus={keepInView}
            className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none focus:border-[#14213D]"
          />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button
            disabled={loggingIn}
            onClick={login}
            className="w-full bg-[#14213D] disabled:opacity-40 text-white f-display font-semibold py-3 rounded-full text-sm"
          >
            {loggingIn ? "Connexion…" : "Entrer"}
          </button>
          <p className="f-body text-[11px] text-[#14213D]/35">Ce code est réglé côté serveur (variable d'environnement OWNER_PASSCODE) — vois le README pour le définir ou le changer.</p>
        </div>
      </div>
    );
  }

  const activeOrders = orders.filter((o) => o.status !== "annulee");
  const gmv = activeOrders.reduce((s, o) => s + o.total, 0);
  const totalCommission = activeOrders.reduce((s, o) => s + (o.commission ?? o.total * (o.feeRate ?? feeRate)), 0);
  const paidOrders = orders.filter((o) => o.status === "livree");
  const commissionCollected = paidOrders.reduce((s, o) => s + (o.commission ?? o.total * (o.feeRate ?? feeRate)), 0);

  return (
    <div className="max-w-3xl mx-auto px-4 py-6">
      <h2 className="f-display font-semibold text-xl text-[#14213D] mb-5 flex items-center gap-2">
        <TrendingUp size={20} className="text-[#C1440E]" /> Tableau de bord — revenus
      </h2>

      <div className="grid sm:grid-cols-3 gap-3 mb-6">
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4">
          <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1">Volume total (GMV)</p>
          <p className="f-display font-semibold text-xl text-[#14213D]">{gmv.toLocaleString("fr-FR")} F</p>
        </div>
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4">
          <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1">Commission générée</p>
          <p className="f-display font-semibold text-xl text-[#C1440E]">{Math.round(totalCommission).toLocaleString("fr-FR")} F</p>
        </div>
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4">
          <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1">Commission encaissée (livrées)</p>
          <p className="f-display font-semibold text-xl text-[#2D6A4F]">{Math.round(commissionCollected).toLocaleString("fr-FR")} F</p>
        </div>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Taux de commission (prélevé sur chaque vente vendeur)</p>
        <div className="flex items-center gap-2">
          <input
            type="number" min="0" max="50" value={rateInput}
            onChange={(e) => setRateInput(e.target.value)}
            className="f-mono w-20 px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm"
          />
          <span className="f-body text-sm text-[#14213D]/60">%</span>
          <button
            onClick={() => updateFeeRate(Number(rateInput) / 100)}
            className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full ml-2"

        <p className="f-body text-xs text-[#14213D]/40 mt-2">

        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Abonnement vendeur / livreur</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <div>
            <label className="f-body text-[10px] text-[#14213D]/40 block mb-1">Prix (FCFA / 30 jours)</label>
            <input type="number" value={accessFeeInput} onChange={(e) => setAccessFeeInput(e.target.value)} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          </div>
          <div>
            <label className="f-body text-[10px] text-[#14213D]/40 block mb-1">Essai gratuit (jours)</label>
            <input type="number" value={trialDaysInput} onChange={(e) => setTrialDaysInput(e.target.value)} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          </div>
        </div>
        <button
          onClick={() => updateAccessSettings(accessFeeInput, trialDaysInput)}
          className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full"
        >
          Mettre à jour
        </button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Actuellement : <span className="font-semibold text-[#14213D]/70">{accessFee.toLocaleString("fr-FR")} F</span> pour 30 jours, avec <span className="font-semibold text-[#14213D]/70">{trialDays} jour{trialDays > 1 ? "s" : ""}</span> d'essai gratuit. S'applique aux espaces vendeur et livreur — payé via CinetPay.
        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Coordonnées de règlement (référence)</p>
        <input
          placeholder="Ex : Mobile Money 07 69 57 48 99, ou IBAN/RIB bancaire"
          value={payoutInput}
          onChange={(e) => setPayoutInput(e.target.value)}
          className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm mb-2"
        />
        <button onClick={() => updateOwnerPayoutInfo(payoutInput)} className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full">Enregistrer</button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Champ purement informatif, pour garder une trace de ton compte de réception — il n'agit pas sur les paiements.
          Les paiements CinetPay (achats, abonnements) arrivent automatiquement sur ton compte marchand CinetPay ; c'est
          dans ton espace CinetPay (Réglages → Compte de règlement) que tu indiques vers quel numéro Mobile Money ou
          compte bancaire CinetPay doit reverser ces fonds — cela ne se configure pas depuis cette application.
        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Sécurité</p>
        <button onClick={() => setOwnerToken(null)} className="f-mono text-xs bg-[#14213D]/10 text-[#14213D] px-3 py-2 rounded-full">Se déconnecter</button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Le code d'accès propriétaire se change côté serveur (variable d'environnement <code>OWNER_PASSCODE</code> chez ton hébergeur), pas depuis cette page — voir le README.
        </p>
      </div>

      <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Détail des commandes ({orders.length})</h3>
      <div className="space-y-2">
        {[...orders].reverse().map((o) => {
          const c = o.commission ?? o.total * (o.feeRate ?? feeRate);
          return (
