                      >
                        Marquer expédiée (transport)
                      </button>
                    </div>
                  )}
                  {o.status === "en_transit" && o.shippingMethod === "transport" && (
                    <div className="mt-3 pt-3 border-t border-dashed border-[#14213D]/10 space-y-1.5">
                      <p className="f-mono text-[11px] text-[#3B6FA0]">🚌 {o.transportCompany} · Suivi : {o.trackingNumber || "—"}</p>
                      <button onClick={() => updateStatus(o.id, "livree")} className="w-full f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">Marquer récupérée par le client</button>
                    </div>
                  )}
                </div>
              );
            })}
            {myOrders.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune commande pour l'instant.</p>}
          </div>
        </div>
      </div>
      {receiptOrder && <ReceiptModal order={receiptOrder} vendorName={vendorInfo.name} vendorPhone={vendorInfo.phone} onClose={() => setReceiptOrder(null)} />}
    </div>
    </SubscriptionGate>
  );
}

function CourierView({ courierInfo, registerCourier, logoutCourier, orders, submitCourierBid, updateStatus, confirmDeliveryByCourier, trialDays, accessFee, onPhoneChanged, tip }) {
  const [zone, setZone] = useState("");
  const [feeInputs, setFeeInputs] = useState({}); // { [orderId]: proposedFee }
  const [available_, setAvailable_] = useState(courierInfo.available !== false);
  const [savingAvailability, setSavingAvailability] = useState(false);
  const [showEarnings, setShowEarnings] = useState(false);
  const [vehicleDraft, setVehicleDraft] = useState({ vehicleType: courierInfo.vehicleType || "moto", vehiclePlate: courierInfo.vehiclePlate || "" });
  const [savingVehicle, setSavingVehicle] = useState(false);
  const [sharingLocation, setSharingLocation] = useState(false);
  const [locationError, setLocationError] = useState("");
  const { daysLeft: accessDaysLeft } = getAccessState(courierInfo, trialDays);
  const nearExpiry = accessDaysLeft <= 3; // essai ou abonnement expirant dans ≤ 3 jours : plus de nouvelles livraisons
  const available = orders.filter((o) => !o.courierPhone && o.status !== "annulee" && o.status !== "livree" && o.shippingMethod !== "transport" && (!zone || o.zone === zone));
  const mine = orders.filter((o) => o.courierPhone === courierInfo.phone && o.status !== "livree" && o.status !== "annulee");
  const delivered = orders.filter((o) => o.courierPhone === courierInfo.phone && o.status === "livree");
  const activeTracked = mine.find((o) => o.status === "en_livraison" && o.shippingMethod !== "transport");

  async function saveVehicle() {
    setSavingVehicle(true);
    try {
      await apiSend(`/api/couriers/${encodeURIComponent(courierInfo.phone)}/vehicle`, "PUT", vehicleDraft, getPhoneToken(courierInfo.phone));
    } catch {
      // échec silencieux, les champs restent modifiables pour réessayer
    }
    setSavingVehicle(false);
  }

  // Partage de position : uniquement pendant une livraison active, et seulement
  // si le livreur active lui-même l'option (jamais en arrière-plan sans le vouloir).
  useEffect(() => {
    if (!sharingLocation || !activeTracked || !navigator.geolocation) return;
    const send = (lat, lng) => {
      apiSend(`/api/orders/${activeTracked.id}/location`, "PUT", { courierPhone: courierInfo.phone, lat, lng }, getPhoneToken(courierInfo.phone)).catch(() => {});
    };
    const watchId = navigator.geolocation.watchPosition(
      (pos) => { setLocationError(""); send(pos.coords.latitude, pos.coords.longitude); },
      (err) => setLocationError("Impossible d'accéder à ta position — vérifie l'autorisation de localisation."),
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [sharingLocation, activeTracked?.id]);

  async function toggleAvailability() {
    const next = !available_;
    setSavingAvailability(true);
    setAvailable_(next); // optimiste : on met à jour l'écran tout de suite
    try {
      await apiSend(`/api/couriers/${encodeURIComponent(courierInfo.phone)}/availability`, "PUT", { available: next }, getPhoneToken(courierInfo.phone));
    } catch {
      setAvailable_(!next); // échec : on annule le changement affiché
    }
    setSavingAvailability(false);
  }

  // Historique des gains : somme des frais de livraison encaissés, par période.
  const now = Date.now();
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
  const startOfMonth = new Date(startOfToday.getFullYear(), startOfToday.getMonth(), 1);
  const sumSince = (ts) => delivered.filter((o) => o.createdAt >= ts).reduce((s, o) => s + (o.deliveryFee || 0), 0);
  const earnings = {
    today: sumSince(startOfToday.getTime()),
    week: sumSince(startOfWeek.getTime()),
    month: sumSince(startOfMonth.getTime()),
    total: delivered.reduce((s, o) => s + (o.deliveryFee || 0), 0),
  };

  if (!courierInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace livreur"
        subtitle="Entre tes infos pour voir les livraisons disponibles."
        accentColor="#C1440E"
        onSubmit={(form) => registerCourier(form)}
      />
    );
  }

  return (
    <SubscriptionGate role="courier" info={courierInfo} trialDays={trialDays} accessFee={accessFee} color="#C1440E">
    <div className="max-w-5xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-1">
        <h2 className="f-display font-semibold text-xl text-[#14213D]">Bonjour, {courierInfo.name}</h2>
        <button onClick={logoutCourier} className="f-mono text-[11px] text-[#14213D]/40 hover:text-[#C1440E]">Changer de compte</button>
      </div>
      <div className="mb-5 flex items-center gap-2">
        <p className="f-mono text-[11px] text-[#14213D]/40">{courierInfo.phone}</p>
        <ChangePhoneNumber role="courier" info={courierInfo} accentColor="#C1440E" onChanged={onPhoneChanged} />
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-5">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Ton engin (vu par l'acheteur et le vendeur)</p>
        <div className="grid grid-cols-2 gap-2">
          <select value={vehicleDraft.vehicleType} onChange={(e) => setVehicleDraft({ ...vehicleDraft, vehicleType: e.target.value })} className="f-body px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm">
            <option value="moto">🏍️ Moto</option>
            <option value="velo">🚲 Vélo</option>
            <option value="voiture">🚗 Voiture</option>
            <option value="tricycle">🛺 Tricycle</option>
            <option value="pied">🚶 À pied</option>
          </select>
          <input placeholder="Plaque / repère (ex: AB 1234)" value={vehicleDraft.vehiclePlate} onChange={(e) => setVehicleDraft({ ...vehicleDraft, vehiclePlate: e.target.value })} className="f-body px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
        </div>
        <button disabled={savingVehicle} onClick={saveVehicle} className="f-mono text-[11px] bg-[#C1440E]/10 text-[#C1440E] px-3 py-2 rounded-lg mt-2">{savingVehicle ? "…" : "Enregistrer"}</button>
        <p className="f-body text-[10px] text-[#14213D]/35 mt-1.5">Aide le vendeur et l'acheteur à te reconnaître à l'enlèvement et à la livraison.</p>
      </div>

      <div className="flex gap-2 mb-5">
        <button disabled={savingAvailability} onClick={toggleAvailability} className={`flex-1 f-mono text-xs py-2 rounded-full ${available_ ? "bg-[#2D6A4F] text-white" : "bg-[#14213D]/10 text-[#14213D]/60"}`}>
          {available_ ? "🟢 Disponible" : "⚪ Indisponible"}
        </button>
        <button onClick={() => setShowEarnings((s) => !s)} className="flex-1 f-mono text-xs bg-[#14213D]/5 text-[#14213D] py-2 rounded-full">
          {showEarnings ? "Masquer mes gains" : "💰 Mes gains"}
        </button>
      </div>
      {!available_ && <p className="f-body text-[11px] text-[#C1440E]/80 -mt-3 mb-5">Tu es marqué indisponible — tu ne peux pas proposer de prix sur de nouvelles commandes. Réactive-toi quand tu es prêt à reprendre.</p>}

      {showEarnings && (
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-5 grid grid-cols-2 gap-3">
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#14213D]">{earnings.today.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Aujourd'hui</p>
          </div>
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#14213D]">{earnings.week.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Cette semaine</p>
          </div>
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#14213D]">{earnings.month.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Ce mois</p>
          </div>
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#2D6A4F]">{earnings.total.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Total</p>
          </div>
        </div>
      )}

      {tip && (
        <div className="mb-5 f-body text-sm bg-[#C1440E]/10 text-[#14213D] border-2 border-[#C1440E]/20 rounded-xl px-4 py-3">
          💡 {tip}
        </div>
      )}

      {mine.length > 0 && (
        <>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Mes livraisons en cours</h3>
          {activeTracked && (
            <div className="ticket bg-white border-2 border-[#14213D]/10 p-3 mb-3 flex items-center justify-between gap-2">
              <div>
                <p className="f-body text-xs text-[#14213D]">📍 Partager ma position en direct</p>
                <p className="f-body text-[10px] text-[#14213D]/40">L'acheteur et le vendeur verront où se trouve le colis, en temps réel.</p>
                {locationError && <p className="f-body text-[10px] text-[#C1440E]">{locationError}</p>}
              </div>
              <button onClick={() => setSharingLocation((s) => !s)} className={`f-mono text-[11px] px-3 py-1.5 rounded-full whitespace-nowrap ${sharingLocation ? "bg-[#2D6A4F] text-white" : "bg-[#14213D]/10 text-[#14213D]/60"}`}>
                {sharingLocation ? "🟢 Actif" : "Activer"}
              </button>
            </div>
          )}
          <div className="space-y-2 mb-6">
            {mine.map((o) => (
              <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
                <div className="flex items-center justify-between">
                  <div>
                    <p className="f-body text-sm text-[#14213D]">{o.zone} · {o.total.toLocaleString("fr-FR")} F (articles)</p>
                    <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {o.items.length} article(s)</p>
                    <p className="f-mono text-xs text-[#2D6A4F] font-semibold">Tes frais de livraison : {(o.deliveryFee || 0).toLocaleString("fr-FR")} F</p>
                  </div>
                  {!o.courierConfirmed && (
                    <button onClick={() => confirmDeliveryByCourier(o.id)} className="f-mono text-xs bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full whitespace-nowrap">Marquer livrée</button>
                  )}
                </div>
                {o.courierConfirmed && (
                  <p className="f-mono text-[10px] text-[#2D6A4F] mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                    ✓ Toi : livraison confirmée{o.buyerConfirmed ? " · ✓ Client : réception confirmée" : " — en attente que le client confirme la réception"}
                  </p>
                )}
              </div>
            ))}
          </div>
        </>
      )}

      <div className="flex items-center justify-between mb-3">
        <h3 className="f-display font-semibold text-sm text-[#14213D]">Livraisons disponibles ({available.length})</h3>
        <select value={zone} onChange={(e) => setZone(e.target.value)} className="f-mono text-xs px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15">
          <option value="">🌍 Toutes les zones (national)</option>
          {ZONES.map((z) => <option key={z} value={z}>{z}</option>)}
        </select>
      </div>
      {nearExpiry ? (
        <div className="ticket bg-[#C1440E]/5 p-4 mb-6 text-center">
          <p className="f-body text-sm text-[#C1440E]/80">Ton accès expire dans {accessDaysLeft} jour{accessDaysLeft > 1 ? "s" : ""} — renouvelle ton abonnement (bandeau ci-dessus) pour proposer un prix sur de nouvelles livraisons.</p>
        </div>
      ) : !available_ ? (
        <div className="ticket bg-[#14213D]/5 p-4 mb-6 text-center">
          <p className="f-body text-sm text-[#14213D]/50">Tu es marqué indisponible — passe en "🟢 Disponible" en haut pour voir et proposer des prix sur les livraisons.</p>
        </div>
      ) : (
      <div className="space-y-2 mb-6">
        {available.map((o) => {
          const myBid = (o.courierBids || []).find((b) => b.courierPhone === courierInfo.phone);
          const otherBidsCount = (o.courierBids || []).length - (myBid ? 1 : 0);
          const isNew = Date.now() - o.createdAt < 2 * 60 * 1000;
          return (
            <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
              <div className="flex items-center justify-between">
                <div>
                  <p className="f-body text-sm text-[#14213D] flex items-center gap-1.5">
                    {o.zone} · {o.total.toLocaleString("fr-FR")} F (articles)
                    {isNew && <span className="f-mono text-[9px] bg-[#C1440E] text-white px-1.5 py-0.5 rounded-full">NOUVEAU</span>}
                  </p>
                  <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {o.items.length} article(s)</p>
                  {[...new Set(o.items.map((it) => it.vendorLandmark).filter(Boolean))].map((lm, i) => (
                    <p key={i} className="f-body text-[11px] text-[#2D6A4F]/80">📍 {lm}</p>
                  ))}
                  {otherBidsCount > 0 && <p className="f-mono text-[10px] text-[#14213D]/40">{otherBidsCount} autre{otherBidsCount > 1 ? "s" : ""} livreur{otherBidsCount > 1 ? "s ont" : " a"} déjà proposé un prix</p>}
                </div>
              </div>
              <div className="flex items-center gap-2 mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                <input
                  type="number"
                  placeholder="Tes frais (FCFA)"
                  value={feeInputs[o.id] ?? (myBid ? myBid.fee : "")}
                  onChange={(e) => setFeeInputs({ ...feeInputs, [o.id]: e.target.value })}
                  className="f-mono flex-1 px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs focus:outline-none focus:border-[#C1440E]"
                />
                <button
                  disabled={!(feeInputs[o.id] ?? myBid?.fee)}
                  onClick={() => submitCourierBid(o.id, courierInfo, feeInputs[o.id] ?? myBid.fee)}
                  className="f-mono text-xs bg-[#14213D] disabled:opacity-30 text-white px-3 py-1.5 rounded-full whitespace-nowrap"
                >
                  {myBid ? "Mettre à jour ton prix" : "Proposer ce prix"}
                </button>
              </div>
              {myBid && <p className="f-mono text-[10px] text-[#2D6A4F] mt-1">Ta proposition actuelle : {myBid.fee.toLocaleString("fr-FR")} F — en attente du choix de l'acheteur</p>}
            </div>
          );
        })}
        {available.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune livraison disponible pour l'instant.</p>}
      </div>
      )}

      {delivered.length > 0 && (
        <>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Historique ({delivered.length})</h3>
          <div className="space-y-2 opacity-60">
            {delivered.map((o) => (
              <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3 flex items-center justify-between">
                <p className="f-body text-sm text-[#14213D]">{o.zone} · {o.total.toLocaleString("fr-FR")} F</p>
                <StatusBadge status={o.status} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
    </SubscriptionGate>
  );
}

function OwnerView({ orders, feeRate, updateFeeRate, accessFee, trialDays, updateAccessSettings, ownerPayoutInfo, updateOwnerPayoutInfo, ownerToken, setOwnerToken, siteContent, updateContent }) {
  const [code, setCode] = useState("");
  const [rateInput, setRateInput] = useState(String(Math.round(feeRate * 100)));
  const [accessFeeInput, setAccessFeeInput] = useState(String(accessFee));
  const [trialDaysInput, setTrialDaysInput] = useState(String(trialDays));
  const [payoutInput, setPayoutInput] = useState(ownerPayoutInfo || "");
  const [error, setError] = useState("");
  const [loggingIn, setLoggingIn] = useState(false);

  const [contentForm, setContentForm] = useState({
    homeHeadline: "", homeSubheadline: "",
    roleDescBuyer: "", roleDescVendor: "", roleDescCourier: "",
    tipBuyer: "", tipVendor: "", tipCourier: "",
    zonesText: "", categoriesText: "",
  });
  const [contentLoaded, setContentLoaded] = useState(false);
  const [contentSaving, setContentSaving] = useState(false);
  const [contentMsg, setContentMsg] = useState("");

  // On ne remplit le formulaire qu'une seule fois, dès que le contenu arrive du
  // serveur — sinon le rafraîchissement automatique (toutes les 2,5s) effacerait
  // ce que le propriétaire est en train de taper.
  useEffect(() => {
    if (!contentLoaded && siteContent && Object.keys(siteContent).length) {
      setContentForm({
        homeHeadline: siteContent.homeHeadline || "",
        homeSubheadline: siteContent.homeSubheadline || "",
        roleDescBuyer: siteContent.roleDescBuyer || "",
        roleDescVendor: siteContent.roleDescVendor || "",
        roleDescCourier: siteContent.roleDescCourier || "",
        tipBuyer: siteContent.tipBuyer || "",
        tipVendor: siteContent.tipVendor || "",
        tipCourier: siteContent.tipCourier || "",
        zonesText: (siteContent.zones && siteContent.zones.length ? siteContent.zones : ZONES).join("\n"),
        categoriesText: (siteContent.categories && siteContent.categories.length ? siteContent.categories : CATEGORIES).map((c) => `${c.emoji} ${c.name}`).join("\n"),
      });
      setContentLoaded(true);
    }
  }, [siteContent, contentLoaded]);

  async function saveContent() {
    setContentSaving(true);
    setContentMsg("");
    try {
      const zones = contentForm.zonesText.split("\n").map((s) => s.trim()).filter(Boolean);
      const categories = contentForm.categoriesText.split("\n").map((s) => s.trim()).filter(Boolean).map((line) => {
        const [emoji, ...rest] = line.split(" ");
        return { emoji, name: rest.join(" ") || emoji };
      });
      await updateContent({
        homeHeadline: contentForm.homeHeadline,
        homeSubheadline: contentForm.homeSubheadline,
        roleDescBuyer: contentForm.roleDescBuyer,
        roleDescVendor: contentForm.roleDescVendor,
        roleDescCourier: contentForm.roleDescCourier,
        tipBuyer: contentForm.tipBuyer,
        tipVendor: contentForm.tipVendor,
        tipCourier: contentForm.tipCourier,
        zones, categories,
      });
      setContentMsg("Enregistré ✓ — visible pour tout le monde d'ici quelques secondes.");
    } catch (e) {
      setContentMsg("Erreur pendant l'enregistrement. Réessaie.");
    }
    setContentSaving(false);
  }

  const [vendorRisk, setVendorRisk] = useState([]);
  const [reports, setReports] = useState([]);
  const [riskLoading, setRiskLoading] = useState(false);
  const [suspendReasonFor, setSuspendReasonFor] = useState(null);
  const [suspendReasonText, setSuspendReasonText] = useState("");

  async function loadRisk() {
    setRiskLoading(true);
    try {
      const [risk, reps] = await Promise.all([
        apiSend("/api/vendors/risk", "GET", undefined, ownerToken),
        apiSend("/api/reports", "GET", undefined, ownerToken),
      ]);
      setVendorRisk(risk);
      setReports(reps);
    } catch (e) {
      console.error("Erreur de chargement des indicateurs de sécurité:", e);
    }
    setRiskLoading(false);
  }

  async function suspendVendor(phone, reason) {
    await apiSend(`/api/vendors/${encodeURIComponent(phone)}/suspend`, "POST", { reason }, ownerToken);
    setSuspendReasonFor(null);
    setSuspendReasonText("");
    loadRisk();
  }
  async function unsuspendVendor(phone) {
    await apiSend(`/api/vendors/${encodeURIComponent(phone)}/unsuspend`, "POST", undefined, ownerToken);
    loadRisk();
  }
  async function markReviewed(reportId) {
    await apiSend(`/api/reports/${reportId}/review`, "POST", undefined, ownerToken);
    loadRisk();
  }

  const [couriers, setCouriers] = useState([]);
  const [refunds, setRefunds] = useState([]);
  const [adminActions, setAdminActions] = useState([]);
  const [showAdminLog, setShowAdminLog] = useState(false);

  async function loadCouriersAndRefunds() {
    try {
      const [c, r] = await Promise.all([
        apiSend("/api/couriers", "GET", undefined, ownerToken),
        apiSend("/api/refunds", "GET", undefined, ownerToken),
      ]);
      setCouriers(c);
      setRefunds(r);
    } catch (e) {
      console.error("Erreur de chargement livreurs/remboursements:", e);
    }
  }
  useEffect(() => { if (ownerToken) loadCouriersAndRefunds(); }, [ownerToken]);

  async function loadAdminActions() {
    try {
      setAdminActions(await apiSend("/api/admin-actions", "GET", undefined, ownerToken));
    } catch (e) {
      console.error("Erreur de chargement du journal:", e);
    }
  }

  async function toggleCourierVerified(phone, verified) {
    await apiSend(`/api/couriers/${encodeURIComponent(phone)}/${verified ? "unverify" : "verify"}`, "POST", undefined, ownerToken);
    loadCouriersAndRefunds();
  }
  async function markRefundDone(orderId) {
    await apiSend(`/api/orders/${orderId}/refund-done`, "POST", undefined, ownerToken);
    loadCouriersAndRefunds();
  }

  async function login() {
    setError("");
    setLoggingIn(true);
    try {
      const { token } = await apiSend("/api/owner/login", "POST", { code });
      setOwnerToken(token);
    } catch (e) {
      setError("Code incorrect.");
    }
    setLoggingIn(false);
  }

  // Le code d'accès vit uniquement dans la variable d'environnement OWNER_PASSCODE
  // du serveur — jamais dans ce fichier ni dans le navigateur. C'est le serveur qui
  // vérifie le code et délivre un jeton temporaire (12h) pour les actions protégées.
  if (!ownerToken) {
    return (
      <div className="max-w-sm mx-auto px-4 py-8">
        <div className="w-11 h-11 rounded-lg bg-[#14213D] flex items-center justify-center mb-4">
          <Lock size={18} className="text-[#F2A93B]" />
        </div>
        <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">Espace propriétaire</h2>
        <p className="f-body text-sm text-[#14213D]/50 mb-5">Accès réservé — entre ton code.</p>
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter") login(); }}>
          <input
            type="password"
            placeholder="Code d'accès"
            value={code}
            onChange={(e) => { setCode(e.target.value); setError(""); }}
            onFocus={keepInView}
            className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none focus:border-[#14213D]"
          />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button
            disabled={loggingIn}
            onClick={login}
            className="w-full bg-[#14213D] disabled:opacity-40 text-white f-display font-semibold py-3 rounded-full text-sm"
          >
            {loggingIn ? "Connexion…" : "Entrer"}
          </button>
          <p className="f-body text-[11px] text-[#14213D]/35">Ce code est réglé côté serveur (variable d'environnement OWNER_PASSCODE) — vois le README pour le définir ou le changer.</p>
        </div>
      </div>
    );
  }

  useEffect(() => { if (ownerToken) loadRisk(); }, [ownerToken]);

  const activeOrders = orders.filter((o) => o.status !== "annulee");
  const gmv = activeOrders.reduce((s, o) => s + o.total, 0);
  const totalCommission = activeOrders.reduce((s, o) => s + (o.commission ?? o.total * (o.feeRate ?? feeRate)), 0);
  const paidOrders = orders.filter((o) => o.status === "livree");
  const commissionCollected = paidOrders.reduce((s, o) => s + (o.commission ?? o.total * (o.feeRate ?? feeRate)), 0);

  return (
    <div className="max-w-3xl mx-auto px-4 py-6">
      <h2 className="f-display font-semibold text-xl text-[#14213D] mb-5 flex items-center gap-2">
        <TrendingUp size={20} className="text-[#C1440E]" /> Tableau de bord — revenus
      </h2>

      <div className="grid sm:grid-cols-3 gap-3 mb-6">
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4">
          <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1">Volume total (GMV)</p>
          <p className="f-display font-semibold text-xl text-[#14213D]">{gmv.toLocaleString("fr-FR")} F</p>
        </div>
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4">
          <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1">Commission générée</p>
          <p className="f-display font-semibold text-xl text-[#C1440E]">{Math.round(totalCommission).toLocaleString("fr-FR")} F</p>
        </div>
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4">
          <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1">Commission encaissée (livrées)</p>
          <p className="f-display font-semibold text-xl text-[#2D6A4F]">{Math.round(commissionCollected).toLocaleString("fr-FR")} F</p>
        </div>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Taux de commission (prélevé sur chaque vente vendeur)</p>
        <div className="flex items-center gap-2">
          <input
            type="number" min="0" max="50" value={rateInput}
            onChange={(e) => setRateInput(e.target.value)}
            className="f-mono w-20 px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm"
          />
          <span className="f-body text-sm text-[#14213D]/60">%</span>
          <button
            onClick={() => updateFeeRate(Number(rateInput) / 100)}
            className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full ml-2"
          >
            Mettre à jour
          </button>
        </div>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Taux actuel appliqué aux nouvelles commandes : <span className="font-semibold text-[#14213D]/70">{Math.round(feeRate * 100)}%</span>. Les commandes déjà passées gardent le taux au moment de l'achat.
        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Abonnement vendeur / livreur</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <div>
            <label className="f-body text-[10px] text-[#14213D]/40 block mb-1">Prix (FCFA / 30 jours)</label>
            <input type="number" value={accessFeeInput} onChange={(e) => setAccessFeeInput(e.target.value)} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          </div>
          <div>
            <label className="f-body text-[10px] text-[#14213D]/40 block mb-1">Essai gratuit (jours)</label>
            <input type="number" value={trialDaysInput} onChange={(e) => setTrialDaysInput(e.target.value)} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          </div>
        </div>
        <button
          onClick={() => updateAccessSettings(accessFeeInput, trialDaysInput)}
          className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full"
        >
          Mettre à jour
        </button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Actuellement : <span className="font-semibold text-[#14213D]/70">{accessFee.toLocaleString("fr-FR")} F</span> pour 30 jours, avec <span className="font-semibold text-[#14213D]/70">{trialDays} jour{trialDays > 1 ? "s" : ""}</span> d'essai gratuit. S'applique aux espaces vendeur et livreur — payé via CinetPay.
        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Coordonnées de règlement (référence)</p>
        <input
          placeholder="Ex : Mobile Money 07 69 57 48 99, ou IBAN/RIB bancaire"
          value={payoutInput}
          onChange={(e) => setPayoutInput(e.target.value)}
          className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm mb-2"
        />
        <button onClick={() => updateOwnerPayoutInfo(payoutInput)} className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full">Enregistrer</button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Champ purement informatif, pour garder une trace de ton compte de réception — il n'agit pas sur les paiements.
          Les paiements CinetPay (achats, abonnements) arrivent automatiquement sur ton compte marchand CinetPay ; c'est
          dans ton espace CinetPay (Réglages → Compte de règlement) que tu indiques vers quel numéro Mobile Money ou
          compte bancaire CinetPay doit reverser ces fonds — cela ne se configure pas depuis cette application.
        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Sécurité</p>
        <button onClick={() => setOwnerToken(null)} className="f-mono text-xs bg-[#14213D]/10 text-[#14213D] px-3 py-2 rounded-full">Se déconnecter</button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Le code d'accès propriétaire se change côté serveur (variable d'environnement <code>OWNER_PASSCODE</code> chez ton hébergeur), pas depuis cette page — voir le README.
        </p>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <div className="flex items-center justify-between">
          <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60">Journal des actions</p>
          <button onClick={() => { setShowAdminLog((s) => !s); if (!showAdminLog) loadAdminActions(); }} className="f-mono text-[10px] text-[#14213D]/40 hover:text-[#14213D] underline">
            {showAdminLog ? "Masquer" : "Afficher"}
          </button>
        </div>
        {showAdminLog && (
          <div className="mt-3 space-y-1.5 max-h-64 overflow-y-auto">
            {adminActions.length === 0 && <p className="f-body text-xs text-[#14213D]/40">Aucune action enregistrée pour l'instant.</p>}
            {adminActions.map((a) => (
              <div key={a.id} className="flex items-center justify-between border-b border-dashed border-[#14213D]/10 pb-1.5">
                <div>
                  <span className="f-body text-xs text-[#14213D]">{a.action}</span>
                  {a.target && <span className="f-mono text-[10px] text-[#14213D]/40"> · {a.target}</span>}
                  {a.details && <p className="f-body text-[11px] text-[#14213D]/50">{a.details}</p>}
                </div>
                <span className="f-mono text-[10px] text-[#14213D]/30 whitespace-nowrap ml-2">{new Date(a.createdAt).toLocaleString("fr-FR")}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-3">Contenu de la plateforme</p>
        <p className="f-body text-xs text-[#14213D]/50 mb-4">
          Modifie les textes, les zones et les catégories directement ici — les changements sont visibles par tout le monde en quelques secondes, sans passer par GitHub ni redéployer.
        </p>

        <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1.5 mt-4">Page d'accueil</p>
        <input placeholder="Titre principal" value={contentForm.homeHeadline} onChange={(e) => setContentForm({ ...contentForm, homeHeadline: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm mb-2" />
        <input placeholder="Sous-titre" value={contentForm.homeSubheadline} onChange={(e) => setContentForm({ ...contentForm, homeSubheadline: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />

        <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1.5 mt-4">Descriptions des rôles (affichées sur la page d'accueil)</p>
        <input placeholder="Description — Acheteur" value={contentForm.roleDescBuyer} onChange={(e) => setContentForm({ ...contentForm, roleDescBuyer: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#F2A93B]/40 text-sm mb-2" />
        <input placeholder="Description — Vendeur" value={contentForm.roleDescVendor} onChange={(e) => setContentForm({ ...contentForm, roleDescVendor: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#2D6A4F]/40 text-sm mb-2" />
        <input placeholder="Description — Livreur" value={contentForm.roleDescCourier} onChange={(e) => setContentForm({ ...contentForm, roleDescCourier: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#C1440E]/40 text-sm" />

        <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1.5 mt-4">Conseils affichés dans chaque espace (facultatif — laisse vide pour ne rien afficher)</p>
        <input placeholder="Conseil pour les acheteurs" value={contentForm.tipBuyer} onChange={(e) => setContentForm({ ...contentForm, tipBuyer: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#F2A93B]/40 text-sm mb-2" />
        <input placeholder="Conseil pour les vendeurs" value={contentForm.tipVendor} onChange={(e) => setContentForm({ ...contentForm, tipVendor: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#2D6A4F]/40 text-sm mb-2" />
        <input placeholder="Conseil pour les livreurs" value={contentForm.tipCourier} onChange={(e) => setContentForm({ ...contentForm, tipCourier: e.target.value })} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#C1440E]/40 text-sm" />

        <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1.5 mt-4">Zones (une par ligne)</p>
        <textarea rows={5} value={contentForm.zonesText} onChange={(e) => setContentForm({ ...contentForm, zonesText: e.target.value })} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-xs" />

        <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-1.5 mt-4">Catégories de produits (une par ligne, format : emoji nom — ex : 🍚 Alimentation)</p>
        <textarea rows={5} value={contentForm.categoriesText} onChange={(e) => setContentForm({ ...contentForm, categoriesText: e.target.value })} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-xs" />

        {contentMsg && <p className={`f-body text-xs mt-3 ${contentMsg.startsWith("Erreur") ? "text-[#C1440E]" : "text-[#2D6A4F]"}`}>{contentMsg}</p>}
        <button disabled={contentSaving} onClick={saveContent} className="w-full mt-4 f-mono text-xs bg-[#14213D] disabled:opacity-40 text-white py-2.5 rounded-full">
          {contentSaving ? "Enregistrement…" : "Enregistrer le contenu"}
        </button>
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <div className="flex items-center justify-between mb-3">
          <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60">Sécurité — vendeurs à surveiller</p>
          <button onClick={loadRisk} className="f-mono text-[10px] text-[#14213D]/40 hover:text-[#14213D] underline">{riskLoading ? "Chargement…" : "Actualiser"}</button>
        </div>
        <p className="f-body text-xs text-[#14213D]/50 mb-4">
          Basé sur les signalements des acheteurs et le taux d'annulation de chaque vendeur. Un vendeur suspendu voit ses produits disparaître du site pour tout le monde, immédiatement.
        </p>

        {reports.filter((r) => r.status === "open").length > 0 && (
          <>
            <p className="f-mono text-[10px] uppercase tracking-wide text-[#C1440E] mb-2">Signalements en attente ({reports.filter((r) => r.status === "open").length})</p>
            <div className="space-y-2 mb-5">
              {reports.filter((r) => r.status === "open").map((r) => (
                <div key={r.id} className="border-2 border-[#C1440E]/20 bg-[#C1440E]/5 rounded-xl p-3">
                  <div className="flex items-center justify-between">
                    <span className="f-body text-xs text-[#14213D] font-semibold">{r.reason}</span>
                    <span className="f-mono text-[10px] text-[#14213D]/40">{new Date(r.createdAt).toLocaleDateString("fr-FR")}</span>
                  </div>
                  <p className="f-mono text-[10px] text-[#14213D]/50 mt-1">Vendeur : {r.vendorPhone} · Commande #{r.orderId?.slice(-6)}</p>
                  {r.details && <p className="f-body text-xs text-[#14213D]/70 mt-1">{r.details}</p>}
                  <div className="flex gap-2 mt-2">
                    <button onClick={() => markReviewed(r.id)} className="f-mono text-[10px] bg-[#14213D]/10 text-[#14213D] px-3 py-1.5 rounded-full">Marquer traité</button>
                    <button onClick={() => setSuspendReasonFor(r.vendorPhone)} className="f-mono text-[10px] bg-[#C1440E] text-white px-3 py-1.5 rounded-full">Suspendre ce vendeur</button>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}

        <p className="f-mono text-[10px] uppercase tracking-wide text-[#14213D]/40 mb-2">Tous les vendeurs ({vendorRisk.length})</p>
        <div className="space-y-2">
          {vendorRisk.map((v) => (
            <div key={v.phone} className={`border-2 rounded-xl p-3 ${v.suspended ? "border-[#14213D]/10 bg-[#14213D]/5 opacity-60" : v.risky ? "border-[#C1440E]/30" : "border-[#14213D]/10"}`}>
              <div className="flex items-center justify-between">
                <span className="f-body text-xs font-semibold text-[#14213D]">{v.name || "Sans nom"} <span className="f-mono text-[10px] text-[#14213D]/40">· {v.phone}</span></span>
                {v.suspended && <span className="f-mono text-[9px] bg-[#14213D] text-white px-2 py-0.5 rounded-full">SUSPENDU</span>}
                {!v.suspended && v.risky && <span className="f-mono text-[9px] bg-[#C1440E] text-white px-2 py-0.5 rounded-full">À RISQUE</span>}
              </div>
              <p className="f-mono text-[10px] text-[#14213D]/50 mt-1">
                {v.totalOrders} commande(s) · {v.cancelRate}% annulées · {v.openReports} signalement(s) ouvert(s)
              </p>
              {v.suspended ? (
                <>
                  {v.suspendedReason && <p className="f-body text-[11px] text-[#14213D]/60 mt-1">Motif : {v.suspendedReason}</p>}
                  <button onClick={() => unsuspendVendor(v.phone)} className="f-mono text-[10px] bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full mt-2">Lever la suspension</button>
                </>
              ) : suspendReasonFor === v.phone ? (
                <div className="mt-2 space-y-2">
                  <input placeholder="Motif de la suspension (visible par le vendeur)" value={suspendReasonText} onChange={(e) => setSuspendReasonText(e.target.value)} className="f-body w-full px-3 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
                  <div className="flex gap-2">
                    <button onClick={() => suspendVendor(v.phone, suspendReasonText)} className="flex-1 f-mono text-[10px] bg-[#C1440E] text-white py-1.5 rounded-full">Confirmer la suspension</button>
                    <button onClick={() => { setSuspendReasonFor(null); setSuspendReasonText(""); }} className="flex-1 f-mono text-[10px] bg-[#14213D]/10 text-[#14213D] py-1.5 rounded-full">Annuler</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setSuspendReasonFor(v.phone)} className="f-mono text-[10px] bg-[#14213D]/10 text-[#14213D] px-3 py-1.5 rounded-full mt-2">Suspendre</button>
              )}
            </div>
          ))}
          {vendorRisk.length === 0 && !riskLoading && <p className="f-body text-xs text-[#14213D]/40">Aucun vendeur inscrit pour l'instant.</p>}
        </div>
      </div>

      {refunds.length > 0 && (
        <div className="ticket bg-white border-2 border-[#C1440E]/20 p-4 mb-6">
          <p className="f-mono text-[11px] uppercase tracking-wide text-[#C1440E] mb-2">Remboursements à traiter ({refunds.filter((r) => r.refundStatus === "pending").length})</p>
          <p className="f-body text-xs text-[#14213D]/50 mb-3">
            CinetPay n'a pas d'API de remboursement automatique — traite ces demandes depuis ton espace CinetPay (Transactions → rembourser), puis marque-les "fait" ici.
          </p>
          <div className="space-y-2">
            {refunds.map((r) => (
              <div key={r.id} className={`flex items-center justify-between rounded-xl px-3 py-2 ${r.refundStatus === "pending" ? "bg-[#C1440E]/5" : "bg-[#14213D]/5 opacity-50"}`}>
                <div>
                  <p className="f-body text-xs text-[#14213D]">#{r.id.slice(-6)} · {r.total.toLocaleString("fr-FR")} F · {r.buyerPhone}</p>
                  <p className="f-mono text-[10px] text-[#14213D]/40">Transaction : {r.cinetpayTransactionId || "—"}</p>
                </div>
                {r.refundStatus === "pending" ? (
                  <button onClick={() => markRefundDone(r.id)} className="f-mono text-[10px] bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full">Marquer remboursé</button>
                ) : (
                  <span className="f-mono text-[10px] text-[#2D6A4F]">✓ Fait</span>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Vérification des livreurs ({couriers.length})</p>
        <p className="f-body text-xs text-[#14213D]/50 mb-3">
          Vérifie l'identité d'un livreur (ex : pièce d'identité envoyée par WhatsApp), puis coche-le ici — un badge de confiance apparaît alors pour les acheteurs quand ils comparent les propositions de prix.
        </p>
        <div className="space-y-2">
          {couriers.map((c) => (
            <div key={c.phone} className="flex items-center justify-between rounded-xl px-3 py-2 bg-[#14213D]/5">
              <div>
                <p className="f-body text-xs text-[#14213D] font-semibold">{c.name || "Sans nom"} <span className="f-mono text-[10px] text-[#14213D]/40">· {c.phone}</span></p>
                <RatingBadge phone={c.phone} />
              </div>
              <button onClick={() => toggleCourierVerified(c.phone, c.verified)} className={`f-mono text-[10px] px-3 py-1.5 rounded-full ${c.verified ? "bg-[#2D6A4F] text-white" : "bg-[#14213D]/10 text-[#14213D]"}`}>
                {c.verified ? "✓ Vérifié" : "Marquer vérifié"}
              </button>
            </div>
          ))}
          {couriers.length === 0 && <p className="f-body text-xs text-[#14213D]/40">Aucun livreur inscrit pour l'instant.</p>}
        </div>
      </div>

      <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Détail des commandes ({orders.length})</h3>
      <div className="space-y-2">
        {[...orders].reverse().map((o) => {
          const c = o.commission ?? o.total * (o.feeRate ?? feeRate);
          return (
            <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3 flex items-center justify-between">
              <div>
                <p className="f-body text-sm text-[#14213D]">#{o.id.slice(-6)} · {o.zone}</p>
                <p className="f-mono text-xs text-[#14213D]/40">{o.total.toLocaleString("fr-FR")} F · commission {Math.round(c).toLocaleString("fr-FR")} F</p>
              </div>
              <StatusBadge status={o.status} />
            </div>
          );
        })}
        {orders.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune commande pour l'instant.</p>}
      </div>
    </div>
  );
}

function App() {
  const [role, setRole] = useState("home");
  const checkoutKeyRef = useRef(uid()); // anti-doublon : même clé tant qu'on n'a pas commandé avec succès
  const [showLegal, setShowLegal] = useState(false);
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [zone, setZone] = useState("");
  const [cart, setCart] = useState([]);
  const [showCart, setShowCart] = useState(false);
  const [buyerInfo, setBuyerInfo] = useState({ name: "", phone: "", registered: false });
  const [vendorInfo, setVendorInfo] = useState({ name: "", phone: "", registered: false });
  const [courierInfo, setCourierInfo] = useState({ name: "", phone: "", registered: false });
  const [feeRate, setFeeRate] = useState(DEFAULT_FEE_RATE);
  const [accessFee, setAccessFee] = useState(DEFAULT_ACCESS_FEE);
  const [trialDays, setTrialDays] = useState(DEFAULT_TRIAL_DAYS);
  const [ownerPayoutInfo, setOwnerPayoutInfo] = useState("");
  const [siteContent, setSiteContent] = useState({});

  const [ownerToken, setOwnerToken] = useState(null);

  const refresh = useCallback(async () => {
    try {
      const [p, o, s, c] = await Promise.all([apiGet("/api/products"), apiGet("/api/orders"), apiGet("/api/settings"), apiGet("/api/content")]);
      setProducts(p);
      setOrders(o);
      setFeeRate(s.feeRate ?? DEFAULT_FEE_RATE);
      setAccessFee(s.accessFee ?? DEFAULT_ACCESS_FEE);
      setTrialDays(s.trialDays ?? DEFAULT_TRIAL_DAYS);
      setOwnerPayoutInfo(s.ownerPayoutInfo ?? "");
      setSiteContent(c || {});
      // Zones et catégories : si le propriétaire les a personnalisées, elles
      // remplacent les listes par défaut partout dans l'appli (menus déroulants,
      // filtres...) sans qu'il soit besoin de modifier le code.
      if (Array.isArray(c?.zones) && c.zones.length) {
        ZONES.length = 0;
        ZONES.push(...c.zones);
      }
      if (Array.isArray(c?.categories) && c.categories.length) {
        CATEGORIES.length = 0;
        CATEGORIES.push(...c.categories);
      }
    } catch (e) {
      console.error("Erreur de rafraîchissement depuis le serveur:", e);
    }
    setLoading(false);
  }, []);

  // Au premier chargement, on retrouve le "je suis connecté en tant que..." mémorisé
  // sur cet appareil, puis on va chercher chez le serveur le vrai statut d'abonnement
  // (partagé entre tous les appareils du même vendeur/livreur).
  useEffect(() => {
    (async () => {
      const b = loadProfile("buyer");
      const v = loadProfile("vendor");
      const c = loadProfile("courier");
      if (b) setBuyerInfo(b);
      if (v) {
        setVendorInfo(v);
        try {
          const p = await apiGet(`/api/profiles/vendor/${encodeURIComponent(v.phone)}`);
          setVendorInfo((cur) => ({ ...cur, ...p, registered: true }));
        } catch { /* profil pas encore côté serveur, ignoré */ }
      }
      if (c) {
        setCourierInfo(c);
        try {
          const p = await apiGet(`/api/profiles/courier/${encodeURIComponent(c.phone)}`);
          setCourierInfo((cur) => ({ ...cur, ...p, registered: true }));
        } catch { /* idem */ }
      }
    })();
  }, []);

  function registerBuyer(info) {
    const next = { ...info, registered: true };
    setBuyerInfo(next);
    saveProfile("buyer", next);
  }
  async function registerVendor(info) {
    const merged = { ...vendorInfo, ...info, registered: true };
    setVendorInfo(merged);
    saveProfile("vendor", merged);
    try {
      const profile = await apiSend(`/api/profiles/vendor/${encodeURIComponent(info.phone)}`, "PUT", { name: info.name }, getPhoneToken(info.phone));
      setVendorInfo((cur) => ({ ...cur, ...profile, registered: true }));
    } catch (e) {
      console.error("Erreur d'inscription vendeur:", e);
    }
  }
  async function registerCourier(info) {
    const merged = { ...courierInfo, ...info, registered: true };
    setCourierInfo(merged);
    saveProfile("courier", merged);
    try {
      const profile = await apiSend(`/api/profiles/courier/${encodeURIComponent(info.phone)}`, "PUT", { name: info.name }, getPhoneToken(info.phone));
      setCourierInfo((cur) => ({ ...cur, ...profile, registered: true }));
    } catch (e) {
      console.error("Erreur d'inscription livreur:", e);
    }
  }
  // Appelé une fois qu'un changement de numéro (vendeur/livreur) a réussi côté
  // serveur — met à jour l'état local (nom + nouveau numéro) et le stockage "je suis connecté".
  function applyChangedPhone(which, profile) {
    if (which === "vendor") {
      const next = { ...vendorInfo, ...profile, registered: true };
      setVendorInfo(next);
      saveProfile("vendor", next);
    } else {
      const next = { ...courierInfo, ...profile, registered: true };
      setCourierInfo(next);
      saveProfile("courier", next);
    }
  }
  function logoutBuyer() { setBuyerInfo({ name: "", phone: "", registered: false }); clearProfile("buyer"); }
  function logoutVendor() { setVendorInfo({ name: "", phone: "", registered: false }); clearProfile("vendor"); }
  function logoutCourier() { setCourierInfo({ name: "", phone: "", registered: false }); clearProfile("courier"); }

  // NB : il n'y a plus de fonction "activer l'abonnement" appelable côté client —
  // ça permettrait de s'abonner sans payer. L'activation se fait uniquement dans
  // le webhook serveur /api/cinetpay/notify, une fois le paiement vérifié auprès
  // de CinetPay. Après paiement, le prochain refresh() récupère le nouveau statut.

  // Réglages (commission, abonnement, coordonnées de règlement) : réservés au
  // propriétaire connecté (jeton reçu après /api/owner/login).
  async function updateFeeRate(rate) {
    const clamped = Math.min(0.5, Math.max(0, rate || 0));
    const s = await apiSend("/api/settings", "PUT", { feeRate: clamped }, ownerToken);
    setFeeRate(s.feeRate);
  }
  async function updateAccessSettings(fee, days) {
    const clampedFee = Math.max(0, Number(fee) || 0);
    const clampedDays = Math.max(0, Number(days) || 0);
    const s = await apiSend("/api/settings", "PUT", { accessFee: clampedFee, trialDays: clampedDays }, ownerToken);
    setAccessFee(s.accessFee);
    setTrialDays(s.trialDays);
  }
  async function updateOwnerPayoutInfo(info) {
    const s = await apiSend("/api/settings", "PUT", { ownerPayoutInfo: info }, ownerToken);
    setOwnerPayoutInfo(s.ownerPayoutInfo);
  }
  // Met à jour les textes/zones/catégories de la plateforme — se répercute
  // immédiatement (au prochain rafraîchissement) pour tous les utilisateurs,
  // sans redéploiement.
  async function updateContent(partial) {
    const c = await apiSend("/api/content", "PUT", partial, ownerToken);
    setSiteContent(c);
    if (Array.isArray(c.zones) && c.zones.length) { ZONES.length = 0; ZONES.push(...c.zones); }
    if (Array.isArray(c.categories) && c.categories.length) { CATEGORIES.length = 0; CATEGORIES.push(...c.categories); }
  }

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    if (role === "home") return;
    const interval = setInterval(refresh, 2500); // rafraîchissement rapide pour que livreurs et acheteurs voient vite les nouvelles commandes/propositions
    return () => clearInterval(interval);
  }, [role, refresh]);


  async function addProduct(p) {
    const created = await apiSend("/api/products", "POST", p, getPhoneToken(p.vendorPhone));
    setProducts((prev) => [created, ...prev]);
  }
  async function updateProduct(id, patch) {
    const updated = await apiSend(`/api/products/${id}`, "PATCH", patch, getPhoneToken(vendorInfo.phone));
    setProducts((prev) => prev.map((p) => (p.id === id ? updated : p)));
  }
  async function deleteProduct(id) {
    await apiSend(`/api/products/${id}`, "DELETE", undefined, getPhoneToken(vendorInfo.phone));
    setProducts((prev) => prev.filter((p) => p.id !== id));
  }
  // Retourne la commande créée (utile pour le paiement CinetPay, qui doit relier un
  // transaction_id à une commande déjà existante AVANT de lancer le guichet).
  async function placeOrder(total, deliveryFee = 0, orderZone = zone, payInfo = {}, shippingMethod = "livreur") {
    const created = await apiSend("/api/orders", "POST", {
      buyerName: buyerInfo.name,
      buyerPhone: buyerInfo.phone,
      zone: orderZone,
      items: cart,
      total,
      deliveryFee,
      paymentMethod: payInfo.paymentMethod || "cod",
      cinetpayTransactionId: payInfo.transactionId || null,
      shippingMethod,
      clientKey: checkoutKeyRef.current,
    }, getPhoneToken(buyerInfo.phone));
    checkoutKeyRef.current = uid(); // commande réussie : nouvelle clé pour la prochaine
    setOrders((prev) => [created, ...prev]);
    setCart([]);
    setShowCart(false);
    // Le stock a été décrémenté côté serveur dans la même transaction — on
    // rafraîchit les produits pour refléter les nouvelles quantités partout.
    try {
      setProducts(await apiGet("/api/products"));
    } catch { /* la prochaine boucle de rafraîchissement s'en chargera */ }
    return created;
  }
  async function confirmOrder(id) {
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status: "confirmee" }, getPhoneToken(vendorInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Le vendeur confie le colis à une compagnie de transport (envoi inter-villes).
  async function shipOrder(id, transportCompany, trackingNumber) {
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status: "en_transit", transportCompany, trackingNumber }, getPhoneToken(vendorInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Utilisée par le vendeur (annuler une commande) ET par l'acheteur (annuler sa
  // propre commande si le paiement CinetPay échoue avant d'être confirmé).
  async function cancelOrder(id, asBuyer = false) {
    const token = asBuyer ? getPhoneToken(buyerInfo.phone) : getPhoneToken(vendorInfo.phone);
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status: "annulee" }, token);
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Un livreur propose (ou met à jour) son prix pour une commande — n'assigne rien
  // encore, ça reste une simple proposition tant que l'acheteur n'a pas choisi.
  async function submitCourierBid(id, courier, fee) {
    const updated = await apiSend(`/api/orders/${id}/bids`, "POST", { courierName: courier.name, courierPhone: courier.phone, fee }, getPhoneToken(courier.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // L'acheteur choisit une des propositions reçues : la commande est alors assignée
  // à ce livreur et passe en livraison.
  async function chooseCourierForOrder(id, bid) {
    const updated = await apiSend(`/api/orders/${id}/choose-courier`, "POST", { courierName: bid.courierName, courierPhone: bid.courierPhone, fee: bid.fee }, getPhoneToken(buyerInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  async function updateStatus(id, status) {
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status }, getPhoneToken(vendorInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Double confirmation de réception (mode livreur) : le livreur confirme avoir
  // livré, l'acheteur confirme avoir reçu — indépendamment. La commande ne passe
  // "livrée" que quand les deux ont confirmé, et le vendeur voit les deux statuts.
  async function confirmDeliveryByCourier(id) {
    const updated = await apiSend(`/api/orders/${id}/confirm-courier`, "POST", undefined, getPhoneToken(courierInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  async function confirmDeliveryByBuyer(id) {
    const updated = await apiSend(`/api/orders/${id}/confirm-buyer`, "POST", undefined, getPhoneToken(buyerInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }

  const myOrders = orders.filter((o) => o.buyerPhone === buyerInfo.phone && buyerInfo.phone);

  return (
    <div className="min-h-screen bg-[#FBF7F0]" style={{ fontFamily: "Inter, sans-serif" }}>
      <style>{FONT_STYLE}</style>
      {showLegal && <LegalPage onClose={() => setShowLegal(false)} />}
      <TopBar role={role} setRole={setRole} cartCount={cart.reduce((s, i) => s + i.qty, 0)} onCartClick={() => setShowCart(true)} />
      {loading ? (
        <div className="text-center py-24 f-body text-sm text-[#14213D]/40">Chargement…</div>
      ) : (
        <>
          {role === "home" && <Home setRole={setRole} content={siteContent} />}
          {role === "buyer" && (
            <BuyerView
              products={products} zone={zone} setZone={setZone}
              cart={cart} setCart={setCart}
              buyerInfo={buyerInfo} registerBuyer={registerBuyer} logoutBuyer={logoutBuyer}
              placeOrder={placeOrder} cancelOrder={cancelOrder} showCart={showCart} setShowCart={setShowCart}
              myOrders={myOrders} chooseCourierForOrder={chooseCourierForOrder} confirmDeliveryByBuyer={confirmDeliveryByBuyer}
              tip={siteContent.tipBuyer}
            />
          )}
          {role === "vendor" && (
            <VendorView
              vendorInfo={vendorInfo} registerVendor={registerVendor} logoutVendor={logoutVendor}
              products={products} addProduct={addProduct} updateProduct={updateProduct} deleteProduct={deleteProduct}
              orders={orders} confirmOrder={confirmOrder} cancelOrder={cancelOrder} shipOrder={shipOrder} updateStatus={updateStatus} setRole={setRole}
              trialDays={trialDays} accessFee={accessFee} onPhoneChanged={(profile) => applyChangedPhone("vendor", profile)}
              tip={siteContent.tipVendor}
            />
          )}
          {role === "courier" && (
            <CourierView
              courierInfo={courierInfo} registerCourier={registerCourier} logoutCourier={logoutCourier} orders={orders} submitCourierBid={submitCourierBid} updateStatus={updateStatus} confirmDeliveryByCourier={confirmDeliveryByCourier}
              trialDays={trialDays} accessFee={accessFee} onPhoneChanged={(profile) => applyChangedPhone("courier", profile)}
              tip={siteContent.tipCourier}
            />
          )}
          {role === "owner" && (
            <OwnerView orders={orders} feeRate={feeRate} updateFeeRate={updateFeeRate} accessFee={accessFee} trialDays={trialDays} updateAccessSettings={updateAccessSettings} ownerPayoutInfo={ownerPayoutInfo} updateOwnerPayoutInfo={updateOwnerPayoutInfo} ownerToken={ownerToken} setOwnerToken={setOwnerToken} siteContent={siteContent} updateContent={updateContent} />
          )}
        </>
      )}
      <footer className="max-w-5xl mx-auto px-4 py-8 text-center">
        <button onClick={() => setShowLegal(true)} className="f-mono text-[11px] text-[#14213D]/35 hover:text-[#14213D] underline">
          Mentions légales · CGU · Confidentialité
        </button>
      </footer>
    </div>
  );
}


    const rootEl = document.getElementById("root");
    ReactDOM.createRoot(rootEl).render(React.createElement(App));
</script>

<!--
  NOTE IMPORTANTE — Zonako, version connectée au backend partagé
  -----------------------------------------------------------------
  Ce fichier n'est PAS autonome : il appelle une API (/api/...) qui doit être
  servie par le serveur Express du même projet (voir server.js). Il ne
  fonctionne pas si tu l'ouvres seul en double-cliquant dessus, ni si tu le
  déposes sur un hébergeur de fichiers statiques sans le serveur qui va avec
  (Netlify/Vercel "statique" ne suffira pas ici). Voir le README.md du
  projet pour le déploiement complet (serveur + base de données).

  Contrairement à la version précédente (localStorage), les données
  (produits, commandes, profils, réglages) sont maintenant stockées dans une
  vraie base PostgreSQL partagée : un vendeur qui publie un produit sur son
  téléphone est vu immédiatement par un acheteur sur un autre téléphone.

  PAIEMENT CINETPAY (achats clients + abonnements vendeur/livreur)
  -------------------------------------------------------------------
  Avant d'aller en production, remplace apikey/site_id dans CINETPAY_CONFIG
  (en haut de ce fichier) par tes vrais identifiants marchand CinetPay, mets
  notify_url sur ton vrai domaine + /api/cinetpay/notify, et passe mode à
  "PRODUCTION". La confirmation de paiement N'EST PLUS basée sur la seule
  réponse reçue dans le navigateur (CinetPay.waitResponse) : chaque commande
  démarre non payée, et c'est le webhook serveur /api/cinetpay/notify qui
  interroge directement l'API CinetPay pour connaître le vrai statut avant
  de marquer une commande "payée" — voir server.js. Ajoute aussi
  CINETPAY_APIKEY/CINETPAY_SITE_ID comme variables d'environnement côté
  serveur (nécessaires pour cette vérification).

  VÉRIFICATION SMS DES COMPTES
  --------------------------------
  Acheteur, vendeur et livreur confirment maintenant leur numéro par un code
  reçu par SMS avant de pouvoir agir (publier un produit, commander,
  proposer un prix, confirmer une livraison...). Configure Twilio Verify
  côté serveur (TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN /
  TWILIO_VERIFY_SERVICE_SID) pour de vrais SMS — sans ça, les codes
  s'affichent dans les logs du serveur (mode test).

  ENCHÈRE DE LIVRAISON ET DOUBLE CONFIRMATION
  ------------------------------------------------
  Dès qu'une commande "livreur" est créée, elle est visible par tous les
  livreurs (table orders côté serveur) sans attendre la confirmation du
  vendeur. Les livreurs proposent un prix (POST /api/orders/:id/bids),
  l'acheteur compare et choisit (POST /api/orders/:id/choose-courier). La
  commande ne passe "livrée" que lorsque livreur ET acheteur ont chacun
  confirmé indépendamment (POST /api/orders/:id/confirm-courier et
  /confirm-buyer) — le vendeur voit les deux statuts séparément.

  ACCÈS PROPRIÉTAIRE
  -----------------------
  Le code d'accès propriétaire est réglé côté serveur, dans la variable
  d'environnement OWNER_PASSCODE (jamais dans ce fichier ni visible du
  navigateur). Le serveur vérifie le code et délivre un jeton temporaire
  (12h) utilisé pour les actions protégées (modifier la commission,
  l'abonnement, les coordonnées de règlement). Voir le README.md pour
  définir ou changer ce code chez ton hébergeur.

  ABONNEMENT VENDEUR / LIVREUR (paywall + essai gratuit)
  -----------------------------------------------------------
  Le statut d'abonnement (essai/actif/expiré) est maintenant stocké dans la
  table "profiles" côté serveur, par numéro de téléphone — donc valable sur
  tous les appareils, plus seulement sur celui où le vendeur/livreur s'est
  inscrit. Le prix et la durée d'essai se règlent depuis l'espace
  propriétaire (table settings, protégée par le jeton propriétaire).
-->
