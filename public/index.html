                  <p className="f-body text-xs text-[#14213D]/50">Commande au nom de <span className="font-semibold text-[#14213D]">{buyerInfo.name}</span> · {buyerInfo.phone}</p>
                  <div className="bg-[#F2A93B]/10 border-2 border-[#F2A93B]/30 rounded-lg px-3 py-2">
                    <p className="f-body text-[11px] text-[#14213D]">⚠️ Les frais de livraison/expédition sont <span className="font-semibold">à ta charge</span>, en plus du prix des articles ci-dessous — ils seront précisés une fois le livreur ou la compagnie de transport connu(e).</p>
                  </div>
                  <div>
                    <label className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 block mb-1.5">Mode d'expédition</label>
                    <div className="grid grid-cols-1 gap-2">
                      <button
                        onClick={() => setShippingMethod("livreur")}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 text-left ${shippingMethod === "livreur" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        🏍️ Livraison locale par livreur — même zone/ville
                      </button>
                      <button
                        onClick={() => { setShippingMethod("transport"); setPaymentMethod("cinetpay"); }}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 text-left ${shippingMethod === "transport" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        🚌 Expédition vers une autre ville — via compagnie de transport
                      </button>
                    </div>
                    {shippingMethod === "transport" && (
                      <>
                        <p className="f-body text-[11px] text-[#14213D]/50 mt-1.5">Le vendeur confiera ton colis à une compagnie de transport et t'enverra le nom de la compagnie et le numéro de suivi. Tu récupères le colis à la gare/agence de la ville de destination.</p>
                        <input
                          placeholder="Compagnie de transport souhaitée (ex: UTB, STC...)"
                          value={preferredTransportCompany}
                          onChange={(e) => setPreferredTransportCompany(e.target.value)}
                          className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm mt-2 focus:outline-none focus:border-[#F2A93B]"
                        />
                        <p className="f-body text-[10px] text-[#14213D]/35 mt-1">Le vendeur confirmera avec les frais, ou te proposera une autre compagnie si celle-ci ne le dessert pas.</p>
                      </>
                    )}
                  </div>
                  <ZonePicker value={deliveryZone} onChange={setDeliveryZone} label={shippingMethod === "transport" ? "Ville de destination" : "Zone de livraison (précise)"} />
                  <input
                    placeholder="Adresse / point de repère précis pour te trouver (optionnel)"
                    value={buyerAddress}
                    onChange={(e) => setBuyerAddress(e.target.value)}
                    className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm focus:outline-none focus:border-[#F2A93B]"
                  />
                  <div className="space-y-1">
                    <div className="flex items-center justify-between">
                      <span className="f-body text-xs text-[#14213D]/50">Sous-total articles</span>
                      <span className="f-mono text-xs text-[#14213D]/70">{goodsTotal.toLocaleString("fr-FR")} F</span>
                    </div>
                    <div className="flex items-center justify-between pt-1">
                      <span className="f-body text-sm text-[#14213D]/60">Total (articles)</span>
                      <span className="f-mono font-semibold text-lg text-[#14213D]">{total.toLocaleString("fr-FR")} F</span>
                    </div>
                    {shippingMethod === "livreur" && (
                      <p className="f-body text-[11px] text-[#14213D]/40 pt-1">+ frais de livraison fixés par le livreur, à régler directement à lui à la livraison.</p>
                    )}
                  </div>
                  <div>
                    <label className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 block mb-1.5">Mode de paiement</label>
                    {shippingMethod === "transport" ? (
                      <div className="bg-[#14213D]/5 rounded-lg px-3 py-2.5">
                        <p className="f-mono text-xs text-[#14213D]">📱 Mobile Money / Carte — obligatoire pour ce mode d'expédition</p>
                        <p className="f-body text-[10px] text-[#14213D]/40 mt-1">Le paiement à la livraison n'est pas possible avec une compagnie de transport : personne ne peut encaisser à l'agence. Ton paiement reste bloqué chez Zonako jusqu'à confirmation de ta réception.</p>
                      </div>
                    ) : (
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => { setPaymentMethod("cinetpay"); setPayError(""); }}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 ${paymentMethod === "cinetpay" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        📱 Mobile Money / Carte
                      </button>
                      <button
                        onClick={() => { setPaymentMethod("cod"); setPayError(""); }}
                        className={`f-mono text-xs px-3 py-2.5 rounded-lg border-2 ${paymentMethod === "cod" ? "border-[#F2A93B] bg-[#F2A93B]/10 text-[#14213D]" : "border-[#14213D]/15 text-[#14213D]/50"}`}
                      >
                        💵 À la livraison
                      </button>
                    </div>
                    )}
                    {paymentMethod === "cinetpay" && (
                      <div className="mt-2">
                        <PaymentBadges />
                      </div>
                    )}
                  </div>
                  {payError && <p className="f-body text-xs text-[#C1440E]">{payError}</p>}
                  {payNotice && <p className="f-body text-xs text-[#2D6A4F]">{payNotice}</p>}
                  <button
                    disabled={!deliveryZone || payProcessing}
                    onClick={() => setShowOrderReview(true)}
                    className="w-full bg-[#C1440E] disabled:opacity-30 text-white f-display font-semibold py-3 rounded-full text-sm"
                  >
                    {payProcessing ? "Paiement en cours…" : "Vérifier ma commande"}
                  </button>
                  {!deliveryZone && <p className="f-body text-xs text-[#C1440E]">Précise une zone de livraison exacte avant de commander (même si tu as parcouru en mode national).</p>}
                </div>
              </>
            )}
          </div>
        </div>
      )}
      {showOrderReview && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-4" onClick={() => setShowOrderReview(false)}>
          <div className="ticket bg-white border-2 border-[#14213D]/10 p-5 max-w-md w-full max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-1">Vérifie ta commande</p>
            <p className="f-body text-xs text-[#14213D]/50 mb-3">Prends un instant avant de continuer — une fois confirmée, tu auras encore 10 minutes pour changer d'avis librement.</p>
            <ul className="f-body text-sm text-[#14213D] divide-y divide-[#14213D]/10 mb-3">
              {cart.map((i) => (
                <li key={i.id} className="py-1.5 flex justify-between">
                  <span>{i.qty}× {i.name}</span>
                  <span className="f-mono text-xs">{(i.price * i.qty).toLocaleString("fr-FR")} F</span>
                </li>
              ))}
            </ul>
            <div className="f-body text-xs text-[#14213D]/70 space-y-1 mb-3">
              <p>📍 Zone : {deliveryZone || "—"}</p>
              {buyerAddress && <p>🏠 Adresse : {buyerAddress}</p>}
              <p>🚚 Livraison : {shippingMethod === "transport" ? `Compagnie de transport${preferredTransportCompany ? ` (${preferredTransportCompany})` : ""}` : "Livreur local"}</p>
              <p>💳 Paiement : {paymentMethod === "cinetpay" ? "Mobile Money / Carte" : "À la livraison"}</p>
            </div>
            <p className="f-display text-lg font-semibold text-[#14213D] mb-3">Total : {total.toLocaleString("fr-FR")} F</p>
            {payError && <p className="f-body text-xs text-[#C1440E] mb-2">{payError}</p>}
            <div className="flex gap-2">
              <button onClick={() => setShowOrderReview(false)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-2.5 rounded-full">Modifier</button>
              <button
                disabled={payProcessing}
                onClick={() => { setShowOrderReview(false); handleCheckout(); }}
                className="flex-1 f-mono text-xs bg-[#C1440E] disabled:opacity-40 text-white py-2.5 rounded-full"
              >
                {payProcessing ? "…" : paymentMethod === "cinetpay" ? `Je confirme, payer ${total.toLocaleString("fr-FR")} F` : "Je confirme la commande"}
              </button>
            </div>
          </div>
        </div>
      )}
      {galleryProduct && <ProductGalleryModal product={galleryProduct} onClose={() => setGalleryProduct(null)} buyerPhone={buyerInfo.phone} />}
      {receiptOrder && <ReceiptModal order={receiptOrder} onClose={() => setReceiptOrder(null)} />}
    </div>
  );
}

function VendorView({ vendorInfo, registerVendor, logoutVendor, products, addProduct, updateProduct, deleteProduct, orders, confirmOrder, cancelOrder, shipOrder, updateStatus, setRole, trialDays, accessFee, onPhoneChanged, proposeTransport, confirmTransport, tip }) {
  const [shipForm, setShipForm] = useState({}); // { [orderId]: { company, tracking } }
  const [form, setForm] = useState({ name: "", price: "", category: CATEGORIES[0].name, zone: "", stock: "", imageUrls: [], videoUrls: [], deliveryTime: "", description: "", tagline: "", vendorLandmark: vendorInfo.landmark || "" });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [editingProfile, setEditingProfile] = useState(false);
  const [profileForm, setProfileForm] = useState({ name: vendorInfo.name, phone: vendorInfo.phone });
  const [publishing, setPublishing] = useState(false);
  const [publishError, setPublishError] = useState("");
  const [generatingDesc, setGeneratingDesc] = useState(false);
  const [descKeywords, setDescKeywords] = useState("");
  const [generatingMannequin, setGeneratingMannequin] = useState(false);
  const [displayType, setDisplayType] = useState("Vêtement femme");
  const [mannequinError, setMannequinError] = useState("");
  const [certifiedAccurate, setCertifiedAccurate] = useState(false);
  const [uploadingImg, setUploadingImg] = useState(false);
  const [uploadingEditImg, setUploadingEditImg] = useState(false);
  const [uploadingVideo, setUploadingVideo] = useState(false);
  const [liveVideoUrl, setLiveVideoUrl] = useState("");
  const [liveVideoCaption, setLiveVideoCaption] = useState("");
  const [uploadingLiveVideo, setUploadingLiveVideo] = useState(false);
  const [publishingLive, setPublishingLive] = useState(false);
  const [liveMsg, setLiveMsg] = useState("");
  const [uploadingEditVideo, setUploadingEditVideo] = useState(false);
  const [videoError, setVideoError] = useState("");
  const [landmarkDraft, setLandmarkDraft] = useState(vendorInfo.landmark || "");
  const [savingLandmark, setSavingLandmark] = useState(false);
  const [showStats, setShowStats] = useState(false);
  const [receiptOrder, setReceiptOrder] = useState(null);
  const [revenue, setRevenue] = useState(null);
  const [vWithdrawals, setVWithdrawals] = useState([]);
  const [showVWithdrawals, setShowVWithdrawals] = useState(false);
  const [vwAmount, setVwAmount] = useState("");
  const [vwMethod, setVwMethod] = useState("mobile_money");
  const [vwAccountInfo, setVwAccountInfo] = useState("");
  const [vwBusy, setVwBusy] = useState(false);
  const [vwError, setVwError] = useState("");
  const myProducts = products.filter((p) => p.vendorPhone === vendorInfo.phone);
  const myOrders = orders.filter((o) => o.items.some((it) => myProducts.some((p) => p.id === it.id)));

  async function loadVendorRevenue() {
    try {
      const token = getPhoneToken(vendorInfo.phone);
      const [r, w] = await Promise.all([
        apiSend(`/api/vendors/${encodeURIComponent(vendorInfo.phone)}/revenue`, "GET", undefined, token),
        apiSend(`/api/vendors/${encodeURIComponent(vendorInfo.phone)}/withdrawals`, "GET", undefined, token),
      ]);
      setRevenue(r);
      setVWithdrawals(w);
    } catch (e) {
      console.error("Erreur de chargement du solde vendeur:", e);
    }
  }
  useEffect(() => { if (vendorInfo.phone) loadVendorRevenue(); }, [vendorInfo.phone]);

  async function requestVendorWithdrawal() {
    setVwError("");
    const amount = Number(vwAmount);
    if (!amount || amount <= 0) { setVwError("Indique un montant valide."); return; }
    if (!vwAccountInfo.trim()) { setVwError("Indique les coordonnées du compte de réception."); return; }
    setVwBusy(true);
    try {
      const token = getPhoneToken(vendorInfo.phone);
      await apiSend(`/api/vendors/${encodeURIComponent(vendorInfo.phone)}/withdrawals`, "POST", { amount, method: vwMethod, accountInfo: vwAccountInfo.trim() }, token);
      setVwAmount("");
      setVwAccountInfo("");
      loadVendorRevenue();
    } catch (e) {
      setVwError(e.message || "Erreur pendant la demande de retrait.");
    }
    setVwBusy(false);
  }

  async function saveLandmark() {
    setSavingLandmark(true);
    try {
      await apiSend(`/api/vendors/${encodeURIComponent(vendorInfo.phone)}/landmark`, "PUT", { landmark: landmarkDraft }, getPhoneToken(vendorInfo.phone));
    } catch {
      // échec silencieux, le champ reste modifiable pour réessayer
    }
    setSavingLandmark(false);
  }

  if (!vendorInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace vendeur"
        subtitle="Entre tes infos pour publier des produits."
        accentColor="#2D6A4F"
        role="vendor"
        onSubmit={(form) => registerVendor(form)}
      />
    );
  }

  function startEdit(p) {
    setEditingId(p.id);
    setEditForm({ price: p.price, stock: p.stock, deliveryTime: p.deliveryTime || "", imageUrls: p.imageUrls || (p.imageUrl ? [p.imageUrl] : []), videoUrls: p.videoUrls || (p.videoUrl ? [p.videoUrl] : []), description: p.description || "", vendorLandmark: p.vendorLandmark || "" });
  }
  function saveEdit(id) {
    updateProduct(id, { price: Number(editForm.price), stock: Number(editForm.stock), deliveryTime: editForm.deliveryTime || "Non précisé", imageUrls: editForm.imageUrls || [], videoUrls: editForm.videoUrls || [], description: editForm.description || "", vendorLandmark: editForm.vendorLandmark || "" });
    setEditingId(null);
  }
  async function handleImageUpload(file, target) {
    if (!file) return;
    if (target === "new" && form.imageUrls.length >= 5) return;
    if (target === "edit" && (editForm.imageUrls || []).length >= 5) return;
    if (target === "new") setUploadingImg(true); else setUploadingEditImg(true);
    try {
      // Si Cloudinary est configuré, on préfère un vrai lien hébergé (plus léger
      // pour la base de données et plus rapide à charger qu'une image encodée en base64).
      let url;
      try {
        url = await uploadImageToCloudinary(file);
      } catch {
        url = await compressImage(file); // repli : image compressée et encodée directement
      }
      if (target === "new") setForm((f) => ({ ...f, imageUrls: [...f.imageUrls, url] }));
      else setEditForm((f) => ({ ...f, imageUrls: [...(f.imageUrls || []), url] }));
    } catch {
      // photo illisible, on laisse le champ tel quel
    }
    if (target === "new") setUploadingImg(false); else setUploadingEditImg(false);
  }
  function removeImage(target, index) {
    if (target === "new") setForm((f) => ({ ...f, imageUrls: f.imageUrls.filter((_, i) => i !== index) }));
    else setEditForm((f) => ({ ...f, imageUrls: (f.imageUrls || []).filter((_, i) => i !== index) }));
  }
  async function generateDescription() {
    if (!form.name.trim()) { setPublishError("Donne d'abord un nom au produit."); return; }
    setGeneratingDesc(true);
    setPublishError("");
    try {
      const { description, tagline } = await apiSend("/api/products/generate-description", "POST", { vendorPhone: vendorInfo.phone, name: form.name, category: form.category, keywords: descKeywords }, getPhoneToken(vendorInfo.phone));
      setForm((f) => ({ ...f, description, tagline: tagline || f.tagline }));
    } catch (e) {
      setPublishError(e.message || "Impossible de générer une description pour l'instant.");
    }
    setGeneratingDesc(false);
  }
  async function generateMannequinPhoto() {
    if (!form.imageUrls[0]) { setMannequinError("Ajoute d'abord au moins une photo de l'article."); return; }
    setGeneratingMannequin(true);
    setMannequinError("");
    try {
      const { imageUrl } = await apiSend("/api/products/generate-mannequin-photo", "POST", { vendorPhone: vendorInfo.phone, imageUrl: form.imageUrls[0], displayType }, getPhoneToken(vendorInfo.phone));
      // La photo générée passe en premier (couverture) — c'est elle que
      // l'acheteur voit en premier, avant les photos brutes du vendeur.
      if (form.imageUrls.length < 5) setForm((f) => ({ ...f, imageUrls: [imageUrl, ...f.imageUrls] }));
    } catch (e) {
      setMannequinError(e.message || "Impossible de générer la photo mannequin pour l'instant.");
    }
    setGeneratingMannequin(false);
  }
  async function handleVideoUpload(file, target) {
    if (!file) return;
    if (target === "new" && form.videoUrls.length >= 5) return;
    if (target === "edit" && (editForm.videoUrls || []).length >= 5) return;
    setVideoError("");
    if (target === "new") setUploadingVideo(true); else setUploadingEditVideo(true);
    try {
      const url = await uploadVideoToCloudinary(file);
      if (target === "new") setForm((f) => ({ ...f, videoUrls: [...f.videoUrls, url] }));
      else setEditForm((f) => ({ ...f, videoUrls: [...(f.videoUrls || []), url] }));
    } catch (e) {
      setVideoError(e.message || "Impossible d'envoyer la vidéo.");
    }
    if (target === "new") setUploadingVideo(false); else setUploadingEditVideo(false);
  }
  function removeVideo(target, index) {
    if (target === "new") setForm((f) => ({ ...f, videoUrls: f.videoUrls.filter((_, i) => i !== index) }));
    else setEditForm((f) => ({ ...f, videoUrls: (f.videoUrls || []).filter((_, i) => i !== index) }));
  }
  async function handleLiveVideoUpload(file) {
    if (!file) return;
    setLiveMsg("");
    setUploadingLiveVideo(true);
    try {
      const url = await uploadVideoToCloudinary(file);
      setLiveVideoUrl(url);
    } catch (e) {
      setLiveMsg(e.message || "Impossible d'envoyer la vidéo.");
    }
    setUploadingLiveVideo(false);
  }
  async function publishLiveVideo() {
    setPublishingLive(true);
    setLiveMsg("");
    try {
      await apiSend(`/api/vendors/${encodeURIComponent(vendorInfo.phone)}/live-announcement`, "POST", { message: liveVideoCaption, videoUrl: liveVideoUrl }, getPhoneToken(vendorInfo.phone));
      setLiveMsg("✓ Publié ! Visible par tous les acheteurs dès maintenant.");
      setLiveVideoUrl("");
      setLiveVideoCaption("");
    } catch (e) {
      setLiveMsg(e.message || "Erreur pendant la publication.");
    }
    setPublishingLive(false);
  }
  function saveProfile() {
    registerVendor(profileForm);
    setEditingProfile(false);
  }

  const totalRevenueNet = myOrders.reduce((s, o) => {
    const myIds = myProducts.map((p) => p.id);
    const sub = o.items.filter((it) => myIds.includes(it.id)).reduce((a, it) => a + it.price * it.qty, 0);
    return s + sub * (1 - (o.feeRate ?? 0));
  }, 0);

  // Statistiques : produits les plus vendus (hors commandes annulées) et stock bas.
  const salesByProduct = {};
  myOrders.forEach((o) => {
    if (o.status === "annulee") return;
    o.items.forEach((it) => {
      if (myProducts.some((p) => p.id === it.id)) salesByProduct[it.id] = (salesByProduct[it.id] || 0) + it.qty;
    });
  });
  const bestSellers = [...myProducts].map((p) => ({ ...p, sold: salesByProduct[p.id] || 0 })).sort((a, b) => b.sold - a.sold).slice(0, 5);
  const lowStock = myProducts.filter((p) => p.stock <= 5).sort((a, b) => a.stock - b.stock);

  function exportOrdersCSV() {
    const headers = ["ID", "Date", "Zone", "Statut", "Total (F)", "Livreur", "Téléphone acheteur"];
    const rows = myOrders.map((o) => [o.id, new Date(o.createdAt).toLocaleDateString("fr-FR"), o.zone, o.status, o.total, o.courierName || "", o.buyerPhone]);
    const csv = [headers, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `commandes-zonako-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  if (vendorInfo.suspended) {
    return (
      <div className="max-w-sm mx-auto px-4 py-10 text-center">
        <div className="w-11 h-11 rounded-lg bg-[#C1440E] flex items-center justify-center mb-4 mx-auto">
          <X size={18} className="text-white" strokeWidth={2.5} />
        </div>
        <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">Compte suspendu</h2>
        <p className="f-body text-sm text-[#14213D]/60 mb-2">
          Ton espace vendeur a été suspendu par le propriétaire de la plateforme{vendorInfo.suspendedReason ? " pour ce motif :" : "."}
        </p>
        {vendorInfo.suspendedReason && <p className="f-body text-sm text-[#14213D] bg-[#C1440E]/10 rounded-xl px-4 py-3 mb-4">{vendorInfo.suspendedReason}</p>}
        <p className="f-body text-xs text-[#14213D]/50">Tes produits ne sont plus visibles par les acheteurs. Contacte le propriétaire de la plateforme si tu penses qu'il s'agit d'une erreur.</p>
        <button onClick={logoutVendor} className="mt-6 f-mono text-xs text-[#14213D]/40 underline">Changer de compte</button>
      </div>
    );
  }

  return (
    <SubscriptionGate role="vendor" info={vendorInfo} trialDays={trialDays} accessFee={accessFee} color="#2D6A4F">
    <div className="max-w-5xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-1">
        {editingProfile ? (
          <div className="flex items-center gap-2 flex-1 max-w-sm" onKeyDown={(e) => { if (e.key === "Enter") saveProfile(); }}>
            <input value={profileForm.name} onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })} className="f-body flex-1 px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-sm" placeholder="Nom" />
            <button onClick={saveProfile} className="f-mono text-xs bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full">OK</button>
          </div>
        ) : (
          <h2 className="f-display font-semibold text-xl text-[#14213D] flex items-center gap-2">
            Bonjour, {vendorInfo.name}
            <button onClick={() => { setProfileForm({ name: vendorInfo.name, phone: vendorInfo.phone }); setEditingProfile(true); }} className="f-mono text-[10px] text-[#14213D]/35 hover:text-[#2D6A4F] underline font-normal">modifier le nom</button>
          </h2>
        )}
        <div className="flex items-center gap-3">
          <button onClick={logoutVendor} className="f-mono text-[11px] text-[#14213D]/40 hover:text-[#C1440E]">Changer de compte</button>

                            <button onClick={() => removeImage("edit", i)} className="absolute -top-1.5 -right-1.5 bg-white rounded-full border border-[#14213D]/10"><X size={10} className="text-[#C1440E]" /></button>
                          </div>
                        ))}
                      </div>
                      {(editForm.imageUrls || []).length < 5 && (
                        <label className="f-mono text-[10px] text-center bg-[#14213D]/5 text-[#14213D]/60 py-1.5 rounded-lg cursor-pointer block">
                          {uploadingEditImg ? "Compression…" : `+ Ajouter une photo (${(editForm.imageUrls || []).length}/5)`}
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e.target.files[0], "edit")} />
                        </label>
                      )}
                    </div>
                    <div>
                      <div className="flex gap-1.5 mb-1.5 flex-wrap">
                        {(editForm.videoUrls || []).map((url, i) => (
                          <div key={i} className="relative">
                            <video src={url} className="w-20 h-16 rounded-lg object-cover border-2 border-[#14213D]/10" />
                            <button onClick={() => removeVideo("edit", i)} className="absolute -top-1.5 -right-1.5 bg-white rounded-full border border-[#14213D]/10"><X size={10} className="text-[#C1440E]" /></button>
                          </div>
                        ))}
                      </div>
                      {(editForm.videoUrls || []).length < 5 && (
                        <label className="f-mono text-[10px] text-center bg-[#14213D]/5 text-[#14213D]/60 py-1.5 rounded-lg cursor-pointer block">
                          {uploadingEditVideo ? "Envoi…" : `+ Ajouter une vidéo (${(editForm.videoUrls || []).length}/5)`}
                          <input type="file" accept="video/*" className="hidden" onChange={(e) => handleVideoUpload(e.target.files[0], "edit")} />
                        </label>
                      )}
                      {videoError && <p className="f-body text-[10px] text-[#C1440E] mt-1">{videoError}</p>}
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => saveEdit(p.id)} className="flex-1 f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">Enregistrer</button>
                      <button onClick={() => setEditingId(null)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-1.5 rounded-full">Annuler</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      {p.imageUrl && <img src={p.imageUrl} alt="" className="w-10 h-10 rounded-lg object-cover border-2 border-[#14213D]/10" />}
                      <div>
                        <p className="f-body text-sm font-medium text-[#14213D]">{p.name}</p>
                        <p className="f-mono text-xs text-[#14213D]/40">{p.price.toLocaleString("fr-FR")} F · stock {p.stock} · {zoneLabel(p.zone)}</p>
                        <p className="f-mono text-[10px] text-[#2D6A4F]">🚚 {p.deliveryTime || "Non précisé"} · frais fixés par le livreur</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => startEdit(p)} className="f-mono text-[10px] text-[#14213D]/50 hover:text-[#2D6A4F] underline">Modifier</button>
                      <button onClick={() => deleteProduct(p.id)}><Trash2 size={15} className="text-[#C1440E]/60 hover:text-[#C1440E]" /></button>
                    </div>
                  </div>
                )}
              </div>
            ))}
            {myProducts.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucun produit publié.</p>}
          </div>

          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Commandes reçues ({myOrders.length})</h3>
          <div className="space-y-2">
            {myOrders.map((o) => {
              const myProductIds = myProducts.map((p) => p.id);
              const mySubtotal = o.items.filter((it) => myProductIds.includes(it.id)).reduce((s, it) => s + it.price * it.qty, 0);
              const rate = o.feeRate ?? 0;
              const net = Math.round(mySubtotal * (1 - rate));
              return (
                <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="f-body text-sm text-[#14213D]">{o.buyerName} · {o.zone}</p>
                      <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {mySubtotal.toLocaleString("fr-FR")} F brut</p>
                      <p className="f-mono text-xs text-[#2D6A4F] font-semibold">Net à recevoir : {net.toLocaleString("fr-FR")} F <span className="text-[#14213D]/30 font-normal">(après {Math.round(rate * 100)}% de commission)</span></p>
                      <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                        <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded inline-block ${o.paid ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/50"}`}>
                          {o.paid ? "✓ Payé en ligne" : "Paiement à la livraison"}
                        </span>
                        {o.shippingMethod === "transport" && (
                          <span className="f-mono text-[10px] px-1.5 py-0.5 rounded inline-block bg-[#3B6FA0]/10 text-[#3B6FA0]">🚌 Expédition transport → {o.zone}</span>
                        )}
                        {o.shippingMethod === "livreur" && (
                          <span className="f-mono text-[10px] px-1.5 py-0.5 rounded inline-block bg-[#C1440E]/10 text-[#C1440E]">
                            🏍️ {o.courierName ? `${o.courierName} · ${(o.deliveryFee || 0).toLocaleString("fr-FR")} F` : (o.courierBids || []).length > 0 ? `${o.courierBids.length} proposition(s) en attente du choix du client` : "En attente de livreurs"}
                          </span>
                        )}
                        {o.shippingMethod === "livreur" && o.courierName && (
                          <>
                            <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded inline-block ${o.courierConfirmed ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/40"}`}>
                              {o.courierConfirmed ? "✓ Colis remis par le livreur" : "En attente de remise par le livreur"}
                            </span>
                            <span className={`f-mono text-[10px] px-1.5 py-0.5 rounded inline-block ${o.buyerConfirmed ? "bg-[#2D6A4F]/10 text-[#2D6A4F]" : "bg-[#14213D]/5 text-[#14213D]/40"}`}>
                              {o.buyerConfirmed ? "✓ Réception confirmée par le client" : "En attente de confirmation du client"}
                            </span>
                          </>
                        )}
                      </div>
                    </div>
                    <StatusBadge status={o.status} />
                  </div>
                  {o.shippingMethod === "livreur" && o.courierName && <CourierTrackingCard order={o} />}
                  <button onClick={() => setReceiptOrder(o)} className="f-mono text-[10px] text-[#14213D]/40 hover:text-[#14213D] underline mt-1.5">🧾 Voir / imprimer le reçu</button>
                  {o.status === "nouvelle" && (
                    <div className="mt-3 pt-3 border-t border-dashed border-[#14213D]/10">
                      {o.shippingMethod === "transport" && o.transportCompany && (
                        <p className="f-body text-[11px] text-[#14213D]/50 mb-2">🚌 L'acheteur propose "{o.transportCompany}" pour l'expédition — confirme d'abord la commande pour pouvoir répondre à ce sujet.</p>
                      )}
                      <VendorConfirmButton order={o} onConfirm={confirmOrder} onCancel={cancelOrder} />
                    </div>
                  )}
                  {o.shippingMethod === "transport" && o.status !== "livree" && o.status !== "annulee" && (
                    <div className="mt-3 pt-3 border-t border-dashed border-[#14213D]/10 space-y-2">
                      <TransportNegotiationCard order={o} viewerRole="vendor" viewerPhone={vendorInfo.phone} onPropose={proposeTransport} onConfirm={confirmTransport} />
                      {o.status === "confirmee" && o.transportConfirmedByBuyer && o.transportConfirmedByVendor && (
                        <VendorShipButton order={o} shipForm={shipForm} setShipForm={setShipForm} shipOrder={shipOrder} />
                      )}
                    </div>
                  )}
                  {o.status === "en_transit" && o.shippingMethod === "transport" && (
                    <div className="mt-3 pt-3 border-t border-dashed border-[#14213D]/10 space-y-1.5">
                      <p className="f-mono text-[11px] text-[#3B6FA0]">🚌 {o.transportCompany} · Suivi : {o.trackingNumber || "—"}</p>
                      <p className="f-body text-[11px] text-[#14213D]/40">En attente que {o.buyerName} confirme avoir récupéré le colis à l'agence.</p>
                    </div>
                  )}
                </div>
              );
            })}
            {myOrders.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune commande pour l'instant.</p>}
          </div>
        </div>
      </div>
      {receiptOrder && <ReceiptModal order={receiptOrder} vendorName={vendorInfo.name} vendorPhone={vendorInfo.phone} onClose={() => setReceiptOrder(null)} />}
    </div>
    </SubscriptionGate>
  );
}

function CourierView({ courierInfo, registerCourier, logoutCourier, orders, submitCourierBid, updateStatus, confirmDeliveryByCourier, trialDays, accessFee, onPhoneChanged, tip }) {
  const [zone, setZone] = useState("");
  const [feeInputs, setFeeInputs] = useState({}); // { [orderId]: proposedFee }
  const [available_, setAvailable_] = useState(courierInfo.available !== false);
  const [savingAvailability, setSavingAvailability] = useState(false);
  const [showEarnings, setShowEarnings] = useState(false);
  const [vehicleDraft, setVehicleDraft] = useState({ vehicleType: courierInfo.vehicleType || "moto", vehiclePlate: courierInfo.vehiclePlate || "" });
  const [savingVehicle, setSavingVehicle] = useState(false);
  const [sharingLocation, setSharingLocation] = useState(false);
  const [locationError, setLocationError] = useState("");
  const { daysLeft: accessDaysLeft } = getAccessState(courierInfo, trialDays);
  const nearExpiry = accessDaysLeft <= 3; // essai ou abonnement expirant dans ≤ 3 jours : plus de nouvelles livraisons
  const available = orders.filter((o) => !o.courierPhone && o.status !== "annulee" && o.status !== "livree" && o.shippingMethod !== "transport" && (!zone || o.zone === zone));
  const mine = orders.filter((o) => o.courierPhone === courierInfo.phone && o.status !== "livree" && o.status !== "annulee");
  const delivered = orders.filter((o) => o.courierPhone === courierInfo.phone && o.status === "livree");
  const activeTracked = mine.find((o) => o.status === "en_livraison" && o.shippingMethod !== "transport");

  async function saveVehicle() {
    setSavingVehicle(true);
    try {
      await apiSend(`/api/couriers/${encodeURIComponent(courierInfo.phone)}/vehicle`, "PUT", vehicleDraft, getPhoneToken(courierInfo.phone));
    } catch {
      // échec silencieux, les champs restent modifiables pour réessayer
    }
    setSavingVehicle(false);
  }

  // Partage de position : uniquement pendant une livraison active, et seulement
  // si le livreur active lui-même l'option (jamais en arrière-plan sans le vouloir).
  useEffect(() => {
    if (!sharingLocation || !activeTracked || !navigator.geolocation) return;
    const send = (lat, lng) => {
      apiSend(`/api/orders/${activeTracked.id}/location`, "PUT", { courierPhone: courierInfo.phone, lat, lng }, getPhoneToken(courierInfo.phone)).catch(() => {});
    };
    const watchId = navigator.geolocation.watchPosition(
      (pos) => { setLocationError(""); send(pos.coords.latitude, pos.coords.longitude); },
      (err) => setLocationError("Impossible d'accéder à ta position — vérifie l'autorisation de localisation."),
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [sharingLocation, activeTracked?.id]);

  async function toggleAvailability() {
    const next = !available_;
    setSavingAvailability(true);
    setAvailable_(next); // optimiste : on met à jour l'écran tout de suite
    try {
      await apiSend(`/api/couriers/${encodeURIComponent(courierInfo.phone)}/availability`, "PUT", { available: next }, getPhoneToken(courierInfo.phone));
    } catch {
      setAvailable_(!next); // échec : on annule le changement affiché
    }
    setSavingAvailability(false);
  }

  // Historique des gains : somme des frais de livraison encaissés, par période.
  const now = Date.now();
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
  const startOfMonth = new Date(startOfToday.getFullYear(), startOfToday.getMonth(), 1);
  const sumSince = (ts) => delivered.filter((o) => o.createdAt >= ts).reduce((s, o) => s + (o.deliveryFee || 0), 0);
  const earnings = {
    today: sumSince(startOfToday.getTime()),
    week: sumSince(startOfWeek.getTime()),
    month: sumSince(startOfMonth.getTime()),
    total: delivered.reduce((s, o) => s + (o.deliveryFee || 0), 0),
  };

  if (!courierInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace livreur"
        subtitle="Entre tes infos pour voir les livraisons disponibles."
        accentColor="#C1440E"
        role="courier"
        onSubmit={(form) => registerCourier(form)}
      />
    );
  }

  return (
    <SubscriptionGate role="courier" info={courierInfo} trialDays={trialDays} accessFee={accessFee} color="#C1440E">
    <div className="max-w-5xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-1">
        <h2 className="f-display font-semibold text-xl text-[#14213D]">Bonjour, {courierInfo.name}</h2>
        <button onClick={logoutCourier} className="f-mono text-[11px] text-[#14213D]/40 hover:text-[#C1440E]">Changer de compte</button>
      </div>
      <div className="mb-5 flex items-center gap-2">
        <p className="f-mono text-[11px] text-[#14213D]/40">{courierInfo.phone}</p>
        <ChangePhoneNumber role="courier" info={courierInfo} accentColor="#C1440E" onChanged={onPhoneChanged} />
      </div>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-5">
        <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-2">Ton engin (vu par l'acheteur et le vendeur)</p>
        <div className="grid grid-cols-2 gap-2">
          <select value={vehicleDraft.vehicleType} onChange={(e) => setVehicleDraft({ ...vehicleDraft, vehicleType: e.target.value })} className="f-body px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm">
            <option value="moto">🏍️ Moto</option>
            <option value="velo">🚲 Vélo</option>
            <option value="voiture">🚗 Voiture</option>
            <option value="tricycle">🛺 Tricycle</option>
            <option value="pied">🚶 À pied</option>
          </select>
          <input placeholder="Plaque / repère (ex: AB 1234)" value={vehicleDraft.vehiclePlate} onChange={(e) => setVehicleDraft({ ...vehicleDraft, vehiclePlate: e.target.value })} className="f-body px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
        </div>
        <button disabled={savingVehicle} onClick={saveVehicle} className="f-mono text-[11px] bg-[#C1440E]/10 text-[#C1440E] px-3 py-2 rounded-lg mt-2">{savingVehicle ? "…" : "Enregistrer"}</button>
        <p className="f-body text-[10px] text-[#14213D]/35 mt-1.5">Aide le vendeur et l'acheteur à te reconnaître à l'enlèvement et à la livraison.</p>
      </div>

      <div className="flex gap-2 mb-5">
        <button disabled={savingAvailability} onClick={toggleAvailability} className={`flex-1 f-mono text-xs py-2 rounded-full ${available_ ? "bg-[#2D6A4F] text-white" : "bg-[#14213D]/10 text-[#14213D]/60"}`}>
          {available_ ? "🟢 Disponible" : "⚪ Indisponible"}
        </button>
        <button onClick={() => setShowEarnings((s) => !s)} className="flex-1 f-mono text-xs bg-[#14213D]/5 text-[#14213D] py-2 rounded-full">
          {showEarnings ? "Masquer mes gains" : "💰 Mes gains"}
        </button>
      </div>
      {!available_ && <p className="f-body text-[11px] text-[#C1440E]/80 -mt-3 mb-5">Tu es marqué indisponible — tu ne peux pas proposer de prix sur de nouvelles commandes. Réactive-toi quand tu es prêt à reprendre.</p>}

      {showEarnings && (
        <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-5 grid grid-cols-2 gap-3">
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#14213D]">{earnings.today.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Aujourd'hui</p>
          </div>
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#14213D]">{earnings.week.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Cette semaine</p>
          </div>
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#14213D]">{earnings.month.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Ce mois</p>
          </div>
          <div className="text-center">
            <p className="f-display font-semibold text-lg text-[#2D6A4F]">{earnings.total.toLocaleString("fr-FR")} F</p>
            <p className="f-mono text-[10px] uppercase text-[#14213D]/40">Total</p>
          </div>
        </div>
      )}

      {tip && (
        <div className="mb-5 f-body text-sm bg-[#C1440E]/10 text-[#14213D] border-2 border-[#C1440E]/20 rounded-xl px-4 py-3">
          💡 {tip}
        </div>
      )}

      {mine.length > 0 && (
        <>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Mes livraisons en cours</h3>
          {activeTracked && (
            <div className="ticket bg-white border-2 border-[#14213D]/10 p-3 mb-3 flex items-center justify-between gap-2">
              <div>
                <p className="f-body text-xs text-[#14213D]">📍 Partager ma position en direct</p>
                <p className="f-body text-[10px] text-[#14213D]/40">L'acheteur et le vendeur verront où se trouve le colis, en temps réel.</p>
                {locationError && <p className="f-body text-[10px] text-[#C1440E]">{locationError}</p>}
              </div>
              <button onClick={() => setSharingLocation((s) => !s)} className={`f-mono text-[11px] px-3 py-1.5 rounded-full whitespace-nowrap ${sharingLocation ? "bg-[#2D6A4F] text-white" : "bg-[#14213D]/10 text-[#14213D]/60"}`}>
                {sharingLocation ? "🟢 Actif" : "Activer"}
              </button>
            </div>
          )}
          <div className="space-y-2 mb-6">
            {mine.map((o) => (
              <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
                <div className="flex items-center justify-between">
                  <div>
                    <p className="f-body text-sm text-[#14213D]">{o.zone} · {o.total.toLocaleString("fr-FR")} F (articles)</p>
                    <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {o.items.length} article(s)</p>
                    <p className="f-mono text-xs text-[#2D6A4F] font-semibold">Tes frais de livraison : {(o.deliveryFee || 0).toLocaleString("fr-FR")} F</p>
                  </div>
                  {!o.courierConfirmed && (
                    <button onClick={() => confirmDeliveryByCourier(o.id)} className="f-mono text-xs bg-[#2D6A4F] text-white px-3 py-1.5 rounded-full whitespace-nowrap">Marquer livrée</button>
                  )}
                </div>
                {o.courierConfirmed && (
                  <p className="f-mono text-[10px] text-[#2D6A4F] mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                    ✓ Toi : livraison confirmée{o.buyerConfirmed ? " · ✓ Client : réception confirmée" : " — en attente que le client confirme la réception"}
                  </p>
                )}
              </div>
            ))}
          </div>
        </>
      )}

      <div className="flex items-center justify-between mb-3">
        <h3 className="f-display font-semibold text-sm text-[#14213D]">Livraisons disponibles ({available.length})</h3>
        <select value={zone} onChange={(e) => setZone(e.target.value)} className="f-mono text-xs px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15">
          <option value="">🌍 Toutes les zones (national)</option>
          {ZONES.map((z) => <option key={z} value={z}>{z}</option>)}
        </select>
      </div>
      {nearExpiry ? (
        <div className="ticket bg-[#C1440E]/5 p-4 mb-6 text-center">
          <p className="f-body text-sm text-[#C1440E]/80">Ton accès expire dans {accessDaysLeft} jour{accessDaysLeft > 1 ? "s" : ""} — renouvelle ton abonnement (bandeau ci-dessus) pour proposer un prix sur de nouvelles livraisons.</p>
        </div>
      ) : !available_ ? (
        <div className="ticket bg-[#14213D]/5 p-4 mb-6 text-center">
          <p className="f-body text-sm text-[#14213D]/50">Tu es marqué indisponible — passe en "🟢 Disponible" en haut pour voir et proposer des prix sur les livraisons.</p>
        </div>
      ) : (
      <div className="space-y-2 mb-6">
        {available.map((o) => {
          const myBid = (o.courierBids || []).find((b) => b.courierPhone === courierInfo.phone);
          const otherBidsCount = (o.courierBids || []).length - (myBid ? 1 : 0);
          const isNew = Date.now() - o.createdAt < 2 * 60 * 1000;
          return (
            <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3">
              <div className="flex items-center justify-between">
                <div>
                  <p className="f-body text-sm text-[#14213D] flex items-center gap-1.5">
                    {o.zone} · {o.total.toLocaleString("fr-FR")} F (articles)
                    {isNew && <span className="f-mono text-[9px] bg-[#C1440E] text-white px-1.5 py-0.5 rounded-full">NOUVEAU</span>}
                  </p>
                  <p className="f-mono text-xs text-[#14213D]/40">#{o.id.slice(-6)} · {o.items.length} article(s)</p>
                  {[...new Set(o.items.map((it) => it.vendorLandmark).filter(Boolean))].map((lm, i) => (
                    <p key={i} className="f-body text-[11px] text-[#2D6A4F]/80">📍 {lm}</p>
                  ))}
                  {otherBidsCount > 0 && <p className="f-mono text-[10px] text-[#14213D]/40">{otherBidsCount} autre{otherBidsCount > 1 ? "s" : ""} livreur{otherBidsCount > 1 ? "s ont" : " a"} déjà proposé un prix</p>}
                </div>
              </div>
              <div className="flex items-center gap-2 mt-2 pt-2 border-t border-dashed border-[#14213D]/10">
                <input
                  type="number"
                  placeholder="Tes frais (FCFA)"
                  value={feeInputs[o.id] ?? (myBid ? myBid.fee : "")}
                  onChange={(e) => setFeeInputs({ ...feeInputs, [o.id]: e.target.value })}
                  className="f-mono flex-1 px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs focus:outline-none focus:border-[#C1440E]"
                />
                <button
                  disabled={!(feeInputs[o.id] ?? myBid?.fee)}
                  onClick={() => submitCourierBid(o.id, courierInfo, feeInputs[o.id] ?? myBid.fee)}
                  className="f-mono text-xs bg-[#14213D] disabled:opacity-30 text-white px-3 py-1.5 rounded-full whitespace-nowrap"
                >
                  {myBid ? "Mettre à jour ton prix" : "Proposer ce prix"}
                </button>
              </div>
              {myBid && <p className="f-mono text-[10px] text-[#2D6A4F] mt-1">Ta proposition actuelle : {myBid.fee.toLocaleString("fr-FR")} F — en attente du choix de l'acheteur</p>}
            </div>
          );
        })}
        {available.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune livraison disponible pour l'instant.</p>}
      </div>
      )}

      {delivered.length > 0 && (
        <>
          <h3 className="f-display font-semibold text-sm text-[#14213D] mb-3">Historique ({delivered.length})</h3>
          <div className="space-y-2 opacity-60">
            {delivered.map((o) => (
              <div key={o.id} className="ticket bg-white border-2 border-[#14213D]/10 p-3 flex items-center justify-between">
                <p className="f-body text-sm text-[#14213D]">{o.zone} · {o.total.toLocaleString("fr-FR")} F</p>
                <StatusBadge status={o.status} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
    </SubscriptionGate>
  );
}

function OwnerView({ orders, feeRate, updateFeeRate, accessFee, trialDays, updateAccessSettings, ownerPayoutInfo, updateOwnerPayoutInfo, ownerToken, setOwnerToken, siteContent, updateContent, publishAnnouncement, products }) {
  const [code, setCode] = useState("");
  const [rateInput, setRateInput] = useState(String(Math.round(feeRate * 100)));
  const [accessFeeInput, setAccessFeeInput] = useState(String(accessFee));
  const [trialDaysInput, setTrialDaysInput] = useState(String(trialDays));
  const [payoutInput, setPayoutInput] = useState(ownerPayoutInfo || "");
  const [error, setError] = useState("");
  const [loggingIn, setLoggingIn] = useState(false);

  const [contentForm, setContentForm] = useState({
    homeHeadline: "", homeSubheadline: "",
    roleDescBuyer: "", roleDescVendor: "", roleDescCourier: "",
    tipBuyer: "", tipVendor: "", tipCourier: "",
    zonesText: "", categoriesText: "",
  });
  const [contentLoaded, setContentLoaded] = useState(false);
  const [contentSaving, setContentSaving] = useState(false);
  const [contentMsg, setContentMsg] = useState("");

  // On ne remplit le formulaire qu'une seule fois, dès que le contenu arrive du
  // serveur — sinon le rafraîchissement automatique (toutes les 2,5s) effacerait
  // ce que le propriétaire est en train de taper.
  useEffect(() => {
    if (!contentLoaded && siteContent && Object.keys(siteContent).length) {
      setContentForm({
        homeHeadline: siteContent.homeHeadline || "",
        homeSubheadline: siteContent.homeSubheadline || "",
        roleDescBuyer: siteContent.roleDescBuyer || "",
        roleDescVendor: siteContent.roleDescVendor || "",
        roleDescCourier: siteContent.roleDescCourier || "",
        tipBuyer: siteContent.tipBuyer || "",
        tipVendor: siteContent.tipVendor || "",
        tipCourier: siteContent.tipCourier || "",
        zonesText: (siteContent.zones && siteContent.zones.length ? siteContent.zones : ZONES).join("\n"),
        categoriesText: (siteContent.categories && siteContent.categories.length ? siteContent.categories : CATEGORIES).map((c) => c.name).join("\n"),
      });
      setContentLoaded(true);
    }
  }, [siteContent, contentLoaded]);

  async function saveContent() {
    setContentSaving(true);
    setContentMsg("");
    try {
      const zones = contentForm.zonesText.split("\n").map((s) => s.trim()).filter(Boolean);
      const categories = contentForm.categoriesText.split("\n").map((s) => s.trim()).filter(Boolean).map((name) => ({
        name,
        emoji: guessCategoryEmoji(name),
      }));
      await updateContent({
        homeHeadline: contentForm.homeHeadline,
        homeSubheadline: contentForm.homeSubheadline,
        roleDescBuyer: contentForm.roleDescBuyer,
        roleDescVendor: contentForm.roleDescVendor,
        roleDescCourier: contentForm.roleDescCourier,
        tipBuyer: contentForm.tipBuyer,
        tipVendor: contentForm.tipVendor,
        tipCourier: contentForm.tipCourier,
        zones, categories,
      });
      setContentMsg("Enregistré ✓ — visible pour tout le monde d'ici quelques secondes.");
    } catch (e) {
      setContentMsg("Erreur pendant l'enregistrement. Réessaie.");
    }
    setContentSaving(false);
  }

  const [vendorRisk, setVendorRisk] = useState([]);
  const [reports, setReports] = useState([]);
  const [riskLoading, setRiskLoading] = useState(false);
  const [suspendReasonFor, setSuspendReasonFor] = useState(null);
  const [suspendReasonText, setSuspendReasonText] = useState("");

  async function loadRisk() {
    setRiskLoading(true);
    try {
      const [risk, reps] = await Promise.all([
        apiSend("/api/vendors/risk", "GET", undefined, ownerToken),
        apiSend("/api/reports", "GET", undefined, ownerToken),
      ]);
      setVendorRisk(risk);
      setReports(reps);
    } catch (e) {
      console.error("Erreur de chargement des indicateurs de sécurité:", e);
    }
    setRiskLoading(false);
  }

  async function suspendVendor(phone, reason) {
    await apiSend(`/api/vendors/${encodeURIComponent(phone)}/suspend`, "POST", { reason }, ownerToken);
    setSuspendReasonFor(null);
    setSuspendReasonText("");
    loadRisk();
  }
  async function unsuspendVendor(phone) {
    await apiSend(`/api/vendors/${encodeURIComponent(phone)}/unsuspend`, "POST", undefined, ownerToken);
    loadRisk();
  }
  async function grantAccess(role, phone) {
    const input = prompt("Combien de jours d'accès gratuit accorder ?", "30");
    if (!input) return;
    const days = Number(input);
    if (!days || days <= 0) return;
    try {
      await apiSend(`/api/access/${role}/${encodeURIComponent(phone)}/grant`, "POST", { days }, ownerToken);
      if (role === "vendor") loadRisk();
      else loadCouriersAndRefunds();
    } catch (e) {
      alert(e.message || "Impossible d'accorder l'accès. Réessaie.");
    }
  }
  async function markReviewed(reportId) {
    await apiSend(`/api/reports/${reportId}/review`, "POST", undefined, ownerToken);
    loadRisk();
  }

  const [couriers, setCouriers] = useState([]);
  const [refunds, setRefunds] = useState([]);
  const [adminActions, setAdminActions] = useState([]);
  const [showAdminLog, setShowAdminLog] = useState(false);
  const [notes, setNotes] = useState([]);
  const [showNotes, setShowNotes] = useState(false);
  const [disputes, setDisputes] = useState([]);
  const [announcementDraft, setAnnouncementDraft] = useState("");
  const [announcementProductId, setAnnouncementProductId] = useState("");
  const [announcementBusy, setAnnouncementBusy] = useState(false);
  useEffect(() => { setAnnouncementDraft(siteContent.announcementMessage || ""); setAnnouncementProductId(siteContent.announcementProductId || ""); }, [siteContent.announcementMessage]);
  const [buyerRisk, setBuyerRisk] = useState([]);

  async function loadBuyerRisk() {
    try {
      setBuyerRisk(await apiSend("/api/buyers/risk", "GET", undefined, ownerToken));
    } catch (e) {
      console.error("Erreur de chargement de la fiabilité acheteurs:", e);
    }
  }
  useEffect(() => { if (ownerToken) loadBuyerRisk(); }, [ownerToken]);

  const [disputesBusy, setDisputesBusy] = useState(null);

  async function loadDisputes() {
    try {
      setDisputes(await apiSend("/api/admin/disputes", "GET", undefined, ownerToken));
    } catch (e) {
      console.error("Erreur de chargement des litiges:", e);
    }
  }
  useEffect(() => { if (ownerToken) loadDisputes(); }, [ownerToken]);

  async function resolveDispute(id, resolution) {
    setDisputesBusy(id);
    try {
      await apiSend(`/api/admin/disputes/${id}/resolve`, "POST", { resolution }, ownerToken);
      loadDisputes();

      alert(e.message || "Erreur pendant la résolution du litige.");
    }
    setDisputesBusy(null);
  }
  const [noteDraft, setNoteDraft] = useState("");
  const [notesBusy, setNotesBusy] = useState(false);
  const [resetConfirmText, setResetConfirmText] = useState("");
  const [resetBusy, setResetBusy] = useState(false);
  const [resetError, setResetError] = useState("");
  const [resetDone, setResetDone] = useState(false);
  const [revenue, setRevenue] = useState(null);
  const [withdrawals, setWithdrawals] = useState([]);
  const [showWithdrawals, setShowWithdrawals] = useState(false);
  const [wAmount, setWAmount] = useState("");
  const [wMethod, setWMethod] = useState("mobile_money");
  const [wAccountInfo, setWAccountInfo] = useState("");
  const [wBusy, setWBusy] = useState(false);
  const [wError, setWError] = useState("");

  async function loadRevenueAndWithdrawals() {
    try {
      const [r, w] = await Promise.all([
        apiSend("/api/admin/revenue", "GET", undefined, ownerToken),
        apiSend("/api/admin/withdrawals", "GET", undefined, ownerToken),
      ]);
      setRevenue(r);
      setWithdrawals(w);
    } catch (e) {
      console.error("Erreur de chargement des revenus:", e);
    }
  }
  useEffect(() => { if (ownerToken) loadRevenueAndWithdrawals(); }, [ownerToken]);

  async function requestWithdrawal() {
    setWError("");
    const amount = Number(wAmount);
    if (!amount || amount <= 0) { setWError("Indique un montant valide."); return; }
    if (!wAccountInfo.trim()) { setWError("Indique les coordonnées du compte de réception."); return; }
    setWBusy(true);
    try {
      await apiSend("/api/admin/withdrawals", "POST", { amount, method: wMethod, accountInfo: wAccountInfo.trim() }, ownerToken);
      setWAmount("");
      setWAccountInfo("");
      loadRevenueAndWithdrawals();
    } catch (e) {
      setWError(e.message || "Erreur pendant la demande de retrait.");
    }
    setWBusy(false);
  }
  async function markWithdrawalDone(id) {
    await apiSend(`/api/admin/withdrawals/${id}/done`, "POST", undefined, ownerToken);
    loadRevenueAndWithdrawals();
  }

  async function resetTestData() {
    if (resetConfirmText !== "SUPPRIMER TOUT") return;
    if (!window.confirm("Dernière confirmation : ceci va supprimer DÉFINITIVEMENT tous les produits, commandes, comptes acheteur/vendeur/livreur. Continuer ?")) return;
    setResetBusy(true);
    setResetError("");
    try {
      await apiSend("/api/admin/reset-test-data", "POST", { confirm: resetConfirmText }, ownerToken);
      setResetDone(true);
      setResetConfirmText("");
    } catch (e) {
      setResetError(e.message || "Erreur pendant la réinitialisation.");
    }
    setResetBusy(false);
  }

  async function loadNotes() {
    try {
      setNotes(await apiSend("/api/owner-notes", "GET", undefined, ownerToken));
    } catch (e) {
      console.error("Erreur de chargement des notes:", e);
    }
  }
  async function addNote() {
    if (!noteDraft.trim()) return;
    setNotesBusy(true);
    try {
      await apiSend("/api/owner-notes", "POST", { text: noteDraft.trim() }, ownerToken);

    setNotesBusy(false);

  async function toggleNote(id, done) {
    setNotes((prev) => prev.map((n) => (n.id === id ? { ...n, done } : n))); // optimiste

      await apiSend(`/api/owner-notes/${id}`, "PATCH", { done }, ownerToken);
    } catch {
      loadNotes(); // échec : on resynchronise avec le serveur

    setNotes((prev) => prev.filter((n) => n.id !== id));

      await apiSend(`/api/owner-notes/${id}`, "DELETE", undefined, ownerToken);

      loadNotes();

    try {

      setCouriers(c);
      setRefunds(r);

  useEffect(() => { if (ownerToken) loadRisk(); }, [ownerToken]);

    loadCouriersAndRefunds();
  }
  async function toggleVendorVerified(phone, verified) {

    loadRisk();
  }
  async function creditVendorWallet(phone) {
    const input = prompt("Combien créditer au portefeuille de ce vendeur (FCFA) ?", "5000");
    if (!input) return;
    const amount = Number(input);
    if (!amount || amount <= 0) return;
    try {
      await apiSend(`/api/vendors/${encodeURIComponent(phone)}/credit-wallet`, "POST", { amount }, ownerToken);
      loadRisk();
    } catch (e) {
      alert(e.message || "Impossible de créditer le portefeuille.");

  async function markRefundDone(orderId) {
    await apiSend(`/api/orders/${orderId}/refund-done`, "POST", undefined, ownerToken);
    loadCouriersAndRefunds();
  }

  async function login() {
    setError("");
    setLoggingIn(true);
    try {
      const { token } = await apiSend("/api/owner/login", "POST", { code });
      setOwnerToken(token);

      setError("Code incorrect.");

    setLoggingIn(false);

  // du serveur — jamais dans ce fichier ni dans le navigateur. C'est le serveur qui

    return (

            className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none focus:border-[#14213D]"

        </div>

  const gmv = activeOrders.reduce((s, o) => s + o.total, 0);
  const totalCommission = activeOrders.reduce((s, o) => s + (o.commission ?? o.total * (o.feeRate ?? feeRate)), 0);

            <input type="number" value={trialDaysInput} onChange={(e) => setTrialDaysInput(e.target.value)} className="f-mono w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          </div>
        </div>
        <button
          onClick={() => updateAccessSettings(accessFeeInput, trialDaysInput)}
          className="f-mono text-xs bg-[#14213D] text-white px-3 py-2 rounded-full"
        >
          Mettre à jour
        </button>
        <p className="f-body text-xs text-[#14213D]/40 mt-2">
          Actuellement : <span className="font-semibold text-[#14213D]/70">{accessFee.toLocaleString("fr-FR")} F</span> pour 30 jours, avec <span className="font-semibold text-[#14213D]/70">{trialDays} jour{trialDays > 1 ? "s" : ""}</span> d'essai gratuit. S'applique aux espaces vendeur et livreur — payé via CinetPay.
        </p>

      <div className="ticket bg-white border-2 border-[#14213D]/10 p-4 mb-6">

          dans ton espace CinetPay (Réglages → Compte de règlement) que tu indiques vers quel numéro Mobile Money ou

          Le code d'accès propriétaire se change côté serveur (variable d'environnement <code>OWNER_PASSCODE</code> chez ton hébergeur), pas depuis cette page — voir le README.
        </p>

              <p className="f-display font-semibold text-lg text-[#14213D]">{Math.round(revenue.commissionGenerated).toLocaleString("fr-FR")} F</p>

              <p className="f-body text-sm text-[#14213D] font-semibold">{Math.round(revenue.availableToWithdraw).toLocaleString("fr-FR")} F</p>
