          );
        })}
        {orders.length === 0 && <p className="f-body text-sm text-[#14213D]/40">Aucune commande pour l'instant.</p>}
      </div>
    </div>
  );
}

function App() {
  const [role, setRole] = useState("home");
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [zone, setZone] = useState("");
  const [cart, setCart] = useState([]);
  const [showCart, setShowCart] = useState(false);
  const [buyerInfo, setBuyerInfo] = useState({ name: "", phone: "", registered: false });
  const [vendorInfo, setVendorInfo] = useState({ name: "", phone: "", registered: false });
  const [courierInfo, setCourierInfo] = useState({ name: "", phone: "", registered: false });
  const [feeRate, setFeeRate] = useState(DEFAULT_FEE_RATE);
  const [accessFee, setAccessFee] = useState(DEFAULT_ACCESS_FEE);
  const [trialDays, setTrialDays] = useState(DEFAULT_TRIAL_DAYS);
  const [ownerPayoutInfo, setOwnerPayoutInfo] = useState("");

  const [ownerToken, setOwnerToken] = useState(null);

  const refresh = useCallback(async () => {
    try {
      const [p, o, s] = await Promise.all([apiGet("/api/products"), apiGet("/api/orders"), apiGet("/api/settings")]);
      setProducts(p);
      setOrders(o);
      setFeeRate(s.feeRate ?? DEFAULT_FEE_RATE);
      setAccessFee(s.accessFee ?? DEFAULT_ACCESS_FEE);
      setTrialDays(s.trialDays ?? DEFAULT_TRIAL_DAYS);
      setOwnerPayoutInfo(s.ownerPayoutInfo ?? "");
    } catch (e) {
      console.error("Erreur de rafraîchissement depuis le serveur:", e);
    }
    setLoading(false);
  }, []);

  // Au premier chargement, on retrouve le "je suis connecté en tant que..." mémorisé
  // sur cet appareil, puis on va chercher chez le serveur le vrai statut d'abonnement
  // (partagé entre tous les appareils du même vendeur/livreur).
  useEffect(() => {
    (async () => {
      const b = loadProfile("buyer");
      const v = loadProfile("vendor");
      const c = loadProfile("courier");
      if (b) setBuyerInfo(b);
      if (v) {
        setVendorInfo(v);
        try {
          const p = await apiGet(`/api/profiles/vendor/${encodeURIComponent(v.phone)}`);
          setVendorInfo((cur) => ({ ...cur, ...p, registered: true }));
        } catch { /* profil pas encore côté serveur, ignoré */ }
      }
      if (c) {
        setCourierInfo(c);
        try {
          const p = await apiGet(`/api/profiles/courier/${encodeURIComponent(c.phone)}`);
          setCourierInfo((cur) => ({ ...cur, ...p, registered: true }));
        } catch { /* idem */ }
      }
    })();
  }, []);

  function registerBuyer(info) {
    const next = { ...info, registered: true };
    setBuyerInfo(next);
    saveProfile("buyer", next);
  }
  async function registerVendor(info) {
    const merged = { ...vendorInfo, ...info, registered: true };
    setVendorInfo(merged);
    saveProfile("vendor", merged);
    try {
      const profile = await apiSend(`/api/profiles/vendor/${encodeURIComponent(info.phone)}`, "PUT", { name: info.name }, getPhoneToken(info.phone));
      setVendorInfo((cur) => ({ ...cur, ...profile, registered: true }));
    } catch (e) {
      console.error("Erreur d'inscription vendeur:", e);
    }
  }
  async function registerCourier(info) {
    const merged = { ...courierInfo, ...info, registered: true };
    setCourierInfo(merged);
    saveProfile("courier", merged);
    try {
      const profile = await apiSend(`/api/profiles/courier/${encodeURIComponent(info.phone)}`, "PUT", { name: info.name }, getPhoneToken(info.phone));
      setCourierInfo((cur) => ({ ...cur, ...profile, registered: true }));
    } catch (e) {
      console.error("Erreur d'inscription livreur:", e);
    }
  }
  // Appelé une fois qu'un changement de numéro (vendeur/livreur) a réussi côté
  // serveur — met à jour l'état local (nom + nouveau numéro) et le stockage "je suis connecté".
  function applyChangedPhone(which, profile) {
    if (which === "vendor") {
      const next = { ...vendorInfo, ...profile, registered: true };
      setVendorInfo(next);
      saveProfile("vendor", next);
    } else {
      const next = { ...courierInfo, ...profile, registered: true };
      setCourierInfo(next);
      saveProfile("courier", next);
    }
  }
  function logoutBuyer() { setBuyerInfo({ name: "", phone: "", registered: false }); clearProfile("buyer"); }
  function logoutVendor() { setVendorInfo({ name: "", phone: "", registered: false }); clearProfile("vendor"); }
  function logoutCourier() { setCourierInfo({ name: "", phone: "", registered: false }); clearProfile("courier"); }

  // NB : il n'y a plus de fonction "activer l'abonnement" appelable côté client —
  // ça permettrait de s'abonner sans payer. L'activation se fait uniquement dans
  // le webhook serveur /api/cinetpay/notify, une fois le paiement vérifié auprès
  // de CinetPay. Après paiement, le prochain refresh() récupère le nouveau statut.

  // Réglages (commission, abonnement, coordonnées de règlement) : réservés au
  // propriétaire connecté (jeton reçu après /api/owner/login).
  async function updateFeeRate(rate) {
    const clamped = Math.min(0.5, Math.max(0, rate || 0));
    const s = await apiSend("/api/settings", "PUT", { feeRate: clamped }, ownerToken);
    setFeeRate(s.feeRate);
  }
  async function updateAccessSettings(fee, days) {
    const clampedFee = Math.max(0, Number(fee) || 0);
    const clampedDays = Math.max(0, Number(days) || 0);
    const s = await apiSend("/api/settings", "PUT", { accessFee: clampedFee, trialDays: clampedDays }, ownerToken);
    setAccessFee(s.accessFee);
    setTrialDays(s.trialDays);
  }
  async function updateOwnerPayoutInfo(info) {
    const s = await apiSend("/api/settings", "PUT", { ownerPayoutInfo: info }, ownerToken);
    setOwnerPayoutInfo(s.ownerPayoutInfo);
  }

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    if (role === "home") return;
    const interval = setInterval(refresh, 2500); // rafraîchissement rapide pour que livreurs et acheteurs voient vite les nouvelles commandes/propositions
    return () => clearInterval(interval);
  }, [role, refresh]);


  async function addProduct(p) {
    const created = await apiSend("/api/products", "POST", p, getPhoneToken(p.vendorPhone));
    setProducts((prev) => [created, ...prev]);
  }
  async function updateProduct(id, patch) {
    const updated = await apiSend(`/api/products/${id}`, "PATCH", patch, getPhoneToken(vendorInfo.phone));
    setProducts((prev) => prev.map((p) => (p.id === id ? updated : p)));
  }
  async function deleteProduct(id) {
    await apiSend(`/api/products/${id}`, "DELETE", undefined, getPhoneToken(vendorInfo.phone));
    setProducts((prev) => prev.filter((p) => p.id !== id));
  }
  // Retourne la commande créée (utile pour le paiement CinetPay, qui doit relier un
  // transaction_id à une commande déjà existante AVANT de lancer le guichet).
  async function placeOrder(total, deliveryFee = 0, orderZone = zone, payInfo = {}, shippingMethod = "livreur") {
    const created = await apiSend("/api/orders", "POST", {
      buyerName: buyerInfo.name,
      buyerPhone: buyerInfo.phone,
      zone: orderZone,
      items: cart,
      total,
      deliveryFee,
      paymentMethod: payInfo.paymentMethod || "cod",
      cinetpayTransactionId: payInfo.transactionId || null,
      shippingMethod,
    }, getPhoneToken(buyerInfo.phone));
    setOrders((prev) => [created, ...prev]);
    setCart([]);
    setShowCart(false);
    // Le stock a été décrémenté côté serveur dans la même transaction — on
    // rafraîchit les produits pour refléter les nouvelles quantités partout.
    try {
      setProducts(await apiGet("/api/products"));
    } catch { /* la prochaine boucle de rafraîchissement s'en chargera */ }
    return created;
  }
  async function confirmOrder(id) {
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status: "confirmee" }, getPhoneToken(vendorInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Le vendeur confie le colis à une compagnie de transport (envoi inter-villes).
  async function shipOrder(id, transportCompany, trackingNumber) {
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status: "en_transit", transportCompany, trackingNumber }, getPhoneToken(vendorInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Utilisée par le vendeur (annuler une commande) ET par l'acheteur (annuler sa
  // propre commande si le paiement CinetPay échoue avant d'être confirmé).
  async function cancelOrder(id, asBuyer = false) {
    const token = asBuyer ? getPhoneToken(buyerInfo.phone) : getPhoneToken(vendorInfo.phone);
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status: "annulee" }, token);
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Un livreur propose (ou met à jour) son prix pour une commande — n'assigne rien
  // encore, ça reste une simple proposition tant que l'acheteur n'a pas choisi.
  async function submitCourierBid(id, courier, fee) {
    const updated = await apiSend(`/api/orders/${id}/bids`, "POST", { courierName: courier.name, courierPhone: courier.phone, fee }, getPhoneToken(courier.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // L'acheteur choisit une des propositions reçues : la commande est alors assignée
  // à ce livreur et passe en livraison.
  async function chooseCourierForOrder(id, bid) {
    const updated = await apiSend(`/api/orders/${id}/choose-courier`, "POST", { courierName: bid.courierName, courierPhone: bid.courierPhone, fee: bid.fee }, getPhoneToken(buyerInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  async function updateStatus(id, status) {
    const updated = await apiSend(`/api/orders/${id}`, "PATCH", { status }, getPhoneToken(vendorInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  // Double confirmation de réception (mode livreur) : le livreur confirme avoir
  // livré, l'acheteur confirme avoir reçu — indépendamment. La commande ne passe
  // "livrée" que quand les deux ont confirmé, et le vendeur voit les deux statuts.
  async function confirmDeliveryByCourier(id) {
    const updated = await apiSend(`/api/orders/${id}/confirm-courier`, "POST", undefined, getPhoneToken(courierInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }
  async function confirmDeliveryByBuyer(id) {
    const updated = await apiSend(`/api/orders/${id}/confirm-buyer`, "POST", undefined, getPhoneToken(buyerInfo.phone));
    setOrders((prev) => prev.map((o) => (o.id === id ? updated : o)));
  }

  const myOrders = orders.filter((o) => o.buyerPhone === buyerInfo.phone && buyerInfo.phone);

  return (
    <div className="min-h-screen bg-[#FBF7F0]" style={{ fontFamily: "Inter, sans-serif" }}>
      <style>{FONT_STYLE}</style>
      <TopBar role={role} setRole={setRole} cartCount={cart.reduce((s, i) => s + i.qty, 0)} onCartClick={() => setShowCart(true)} />
      {loading ? (
        <div className="text-center py-24 f-body text-sm text-[#14213D]/40">Chargement…</div>
      ) : (
        <>
          {role === "home" && <Home setRole={setRole} />}
          {role === "buyer" && (
            <BuyerView
              products={products} zone={zone} setZone={setZone}
              cart={cart} setCart={setCart}
              buyerInfo={buyerInfo} registerBuyer={registerBuyer} logoutBuyer={logoutBuyer}
              placeOrder={placeOrder} cancelOrder={cancelOrder} showCart={showCart} setShowCart={setShowCart}
              myOrders={myOrders} chooseCourierForOrder={chooseCourierForOrder} confirmDeliveryByBuyer={confirmDeliveryByBuyer}
            />
          )}
          {role === "vendor" && (
            <VendorView
              vendorInfo={vendorInfo} registerVendor={registerVendor} logoutVendor={logoutVendor}
              products={products} addProduct={addProduct} updateProduct={updateProduct} deleteProduct={deleteProduct}
              orders={orders} confirmOrder={confirmOrder} cancelOrder={cancelOrder} shipOrder={shipOrder} updateStatus={updateStatus} setRole={setRole}
              trialDays={trialDays} accessFee={accessFee} onPhoneChanged={(profile) => applyChangedPhone("vendor", profile)}
            />
          )}
          {role === "courier" && (
            <CourierView
              courierInfo={courierInfo} registerCourier={registerCourier} logoutCourier={logoutCourier} orders={orders} submitCourierBid={submitCourierBid} updateStatus={updateStatus} confirmDeliveryByCourier={confirmDeliveryByCourier}
              trialDays={trialDays} accessFee={accessFee} onPhoneChanged={(profile) => applyChangedPhone("courier", profile)}
            />
          )}
          {role === "owner" && (
            <OwnerView orders={orders} feeRate={feeRate} updateFeeRate={updateFeeRate} accessFee={accessFee} trialDays={trialDays} updateAccessSettings={updateAccessSettings} ownerPayoutInfo={ownerPayoutInfo} updateOwnerPayoutInfo={updateOwnerPayoutInfo} ownerToken={ownerToken} setOwnerToken={setOwnerToken} />
          )}
        </>
      )}
    </div>
  );
}


    const rootEl = document.getElementById("root");
    ReactDOM.createRoot(rootEl).render(React.createElement(App));
</script>

<!--
  NOTE IMPORTANTE — Zonako, version connectée au backend partagé
  -----------------------------------------------------------------
  Ce fichier n'est PAS autonome : il appelle une API (/api/...) qui doit être
  servie par le serveur Express du même projet (voir server.js). Il ne
  fonctionne pas si tu l'ouvres seul en double-cliquant dessus, ni si tu le
  déposes sur un hébergeur de fichiers statiques sans le serveur qui va avec
  (Netlify/Vercel "statique" ne suffira pas ici). Voir le README.md du
  projet pour le déploiement complet (serveur + base de données).

  Contrairement à la version précédente (localStorage), les données
  (produits, commandes, profils, réglages) sont maintenant stockées dans une
  vraie base PostgreSQL partagée : un vendeur qui publie un produit sur son
  téléphone est vu immédiatement par un acheteur sur un autre téléphone.

  PAIEMENT CINETPAY (achats clients + abonnements vendeur/livreur)
  -------------------------------------------------------------------
  Avant d'aller en production, remplace apikey/site_id dans CINETPAY_CONFIG
  (en haut de ce fichier) par tes vrais identifiants marchand CinetPay, mets
  notify_url sur ton vrai domaine + /api/cinetpay/notify, et passe mode à
  "PRODUCTION". La confirmation de paiement N'EST PLUS basée sur la seule
  réponse reçue dans le navigateur (CinetPay.waitResponse) : chaque commande
  démarre non payée, et c'est le webhook serveur /api/cinetpay/notify qui
  interroge directement l'API CinetPay pour connaître le vrai statut avant
  de marquer une commande "payée" — voir server.js. Ajoute aussi
  CINETPAY_APIKEY/CINETPAY_SITE_ID comme variables d'environnement côté
  serveur (nécessaires pour cette vérification).

  VÉRIFICATION SMS DES COMPTES
  --------------------------------
  Acheteur, vendeur et livreur confirment maintenant leur numéro par un code
  reçu par SMS avant de pouvoir agir (publier un produit, commander,
  proposer un prix, confirmer une livraison...). Configure Twilio Verify
  côté serveur (TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN /
  TWILIO_VERIFY_SERVICE_SID) pour de vrais SMS — sans ça, les codes
  s'affichent dans les logs du serveur (mode test).

  ENCHÈRE DE LIVRAISON ET DOUBLE CONFIRMATION
  ------------------------------------------------
  Dès qu'une commande "livreur" est créée, elle est visible par tous les
  livreurs (table orders côté serveur) sans attendre la confirmation du
  vendeur. Les livreurs proposent un prix (POST /api/orders/:id/bids),
  l'acheteur compare et choisit (POST /api/orders/:id/choose-courier). La
  commande ne passe "livrée" que lorsque livreur ET acheteur ont chacun
  confirmé indépendamment (POST /api/orders/:id/confirm-courier et
  /confirm-buyer) — le vendeur voit les deux statuts séparément.

  ACCÈS PROPRIÉTAIRE
  -----------------------
  Le code d'accès propriétaire est réglé côté serveur, dans la variable
  d'environnement OWNER_PASSCODE (jamais dans ce fichier ni visible du
  navigateur). Le serveur vérifie le code et délivre un jeton temporaire
  (12h) utilisé pour les actions protégées (modifier la commission,
  l'abonnement, les coordonnées de règlement). Voir le README.md pour
  définir ou changer ce code chez ton hébergeur.

  ABONNEMENT VENDEUR / LIVREUR (paywall + essai gratuit)
  -----------------------------------------------------------
  Le statut d'abonnement (essai/actif/expiré) est maintenant stocké dans la
  table "profiles" côté serveur, par numéro de téléphone — donc valable sur
  tous les appareils, plus seulement sur celui où le vendeur/livreur s'est
  inscrit. Le prix et la durée d'essai se règlent depuis l'espace
  propriétaire (table settings, protégée par le jeton propriétaire).
-->
</body>
