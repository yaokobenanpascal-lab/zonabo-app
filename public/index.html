// Upload de photos produit : Cloudinary permet un envoi direct depuis le
// navigateur (sans passer par le serveur), avec un plan gratuit généreux.
// 1. Crée un compte sur cloudinary.com (gratuit)
// 2. Récupère ton "Cloud name" (tableau de bord, en haut)
// 3. Crée un "Upload preset" non signé : Settings → Upload → Add upload preset
//    → Signing mode: "Unsigned" → note son nom
// 4. Remplace les deux valeurs ci-dessous
const CLOUDINARY_CONFIG = {
  cloudName: "kylr0amb",
  uploadPreset: "zonako_uploads",
};
// Améliore automatiquement une photo (luminosité, contraste, netteté) via les
// transformations Cloudinary — gratuit, déjà inclus, aucun service en plus.
// Insère les paramètres juste après "/upload/" dans l'URL Cloudinary. Si ce
// n'est pas une URL Cloudinary (ex: ancien fallback base64), renvoie tel quel.
function enhancedImageUrl(url) {
  if (!url || !url.includes("/upload/")) return url;
  return url.replace("/upload/", "/upload/e_improve,e_auto_contrast,e_sharpen:60/");
}
async function uploadImageToCloudinary(file) {
  if (CLOUDINARY_CONFIG.cloudName.startsWith("REMPLACE")) {
    throw new Error("Cloudinary n'est pas encore configuré (voir CLOUDINARY_CONFIG en haut du fichier).");
  }
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", CLOUDINARY_CONFIG.uploadPreset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`, { method: "POST", body: form });
  if (!r.ok) throw new Error("Échec de l'envoi de l'image.");
  const data = await r.json();
  return data.secure_url;
}
// Les vidéos ne peuvent pas être stockées en base64 comme les photos (bien
// trop volumineuses pour la base de données) — Cloudinary est obligatoire ici,
// pas de repli possible.
async function uploadVideoToCloudinary(file) {
  if (CLOUDINARY_CONFIG.cloudName.startsWith("REMPLACE")) {
    throw new Error("L'ajout de vidéo nécessite Cloudinary configuré par le propriétaire de la plateforme (voir CLOUDINARY_CONFIG).");
  }
  if (file.size > 50 * 1024 * 1024) {
    throw new Error("Vidéo trop lourde (50 Mo maximum). Essaie une vidéo plus courte.");
  }
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", CLOUDINARY_CONFIG.uploadPreset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/video/upload`, { method: "POST", body: form });
  if (!r.ok) throw new Error("Échec de l'envoi de la vidéo.");
  const data = await r.json();
  return data.secure_url;
}

// ---------- Appels vers le backend partagé (API + base de données) ----------
// Comme le frontend est servi par le même serveur Express, on utilise des chemins
// relatifs — pas besoin de CORS ni de configurer une URL séparée.
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text().catch(() => "Erreur serveur"));
  return r.json();
}
async function apiSend(path, method, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  const r = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    const raw = await r.text().catch(() => "");
    let msg = raw || "Erreur serveur";
    try { msg = JSON.parse(raw).error || msg; } catch { /* réponse pas en JSON, on garde le texte brut */ }
    throw new Error(msg);
  }
  return r.json();
}

// Petit pointeur local pour se souvenir "je suis connecté en tant que vendeur/livreur/
// acheteur avec ce nom/téléphone" d'une visite à l'autre sur CET appareil — les
// vraies données (produits, commandes, abonnement) vivent côté serveur, partagées
// entre tous les appareils.
function loadProfile(key) {
  try {
    const raw = localStorage.getItem(`profile_${key}`);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveProfile(key, data) {
  try {
    localStorage.setItem(`profile_${key}`, JSON.stringify(data));
  } catch {
    // échec silencieux
  }
}
function clearProfile(key) {
  try {
    localStorage.removeItem(`profile_${key}`);
  } catch {
    // rien à supprimer
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Lance un paiement CinetPay générique (utilisé pour les abonnements vendeur/livreur).
// L'argent est collecté directement sur le compte marchand CinetPay du propriétaire
// (celui associé à CINETPAY_CONFIG.site_id) — voir la note en fin de fichier pour
// savoir où configurer le compte de règlement (bancaire/mobile money) côté CinetPay.
function launchCinetPaySubscription({ transactionId, amount, description, customer, onSuccess, onError }) {
  if (!window.CinetPay) {
    onError && onError("Le module de paiement n'a pas pu se charger (vérifie ta connexion internet).");
    return;
  }
  const [firstName, ...rest] = (customer.name || "Zonako").trim().split(" ");
  window.CinetPay.setConfig({
    apikey: CINETPAY_CONFIG.apikey,
    site_id: CINETPAY_CONFIG.site_id,
    mode: CINETPAY_CONFIG.mode,
    notify_url: CINETPAY_CONFIG.notify_url,
  });
  window.CinetPay.getCheckout({
    transaction_id: transactionId,
    amount,
    currency: "XOF",
    channels: "ALL",
    description,
    customer_name: firstName,
    customer_surname: rest.join(" ") || firstName,
    customer_phone_number: customer.phone,
    customer_address: "Côte d'Ivoire",
    customer_city: "Abidjan",
    customer_country: "CI",
    customer_state: "CI",
    customer_zip_code: "00225",
  });
  window.CinetPay.waitResponse((data) => {
    if (data.status === "ACCEPTED") {
      onSuccess && onSuccess(transactionId);
    } else {
      onError && onError("Paiement refusé ou annulé.");
    }
  });
  window.CinetPay.onError((data) => {
    onError && onError("Une erreur est survenue pendant le paiement. Réessaie dans un instant.");
    console.error("Erreur CinetPay (abonnement):", data);
  });
}

// Filet de sécurité "essai + abonnement" : calcule si un vendeur/livreur a encore
// accès (essai en cours OU abonnement actif et non expiré).
function getAccessState(info, trialDays) {
  const trialStartedAt = info.trialStartedAt || Date.now();
  const daysUsed = Math.floor((Date.now() - trialStartedAt) / 86400000);
  const trialDaysLeft = Math.max(0, trialDays - daysUsed);
  const subscriptionActive = info.subscriptionStatus === "active" && info.subscriptionExpiresAt && info.subscriptionExpiresAt > Date.now();
  const trialActive = !subscriptionActive && trialDaysLeft > 0;
  // daysLeft reflète toujours la période qui compte réellement (essai OU abonnement payant actif).
  const subDaysLeft = subscriptionActive ? Math.ceil((info.subscriptionExpiresAt - Date.now()) / 86400000) : 0;
  const daysLeft = subscriptionActive ? subDaysLeft : trialDaysLeft;
  return { subscriptionActive, trialActive, daysLeft, granted: subscriptionActive || trialActive };
}

// Écran de paywall + bandeau d'essai, partagé entre l'espace vendeur et l'espace livreur.
function SubscriptionGate({ role, info, trialDays, accessFee, color, children }) {
  const [paying, setPaying] = useState(false);
  const [payError, setPayError] = useState("");
  const [payNotice, setPayNotice] = useState("");
  const [topupAmount, setTopupAmount] = useState("2000");
  const [topupBusy, setTopupBusy] = useState(false);
  const [topupNotice, setTopupNotice] = useState("");
  const [topupError, setTopupError] = useState("");
  const { subscriptionActive, trialActive, daysLeft, granted } = getAccessState(info, trialDays);
  const roleLabel = role === "vendor" ? "vendeur" : "livreur";

  async function payWalletTopup() {
    const amount = Number(topupAmount);
    if (!amount || amount < 500) { setTopupError("Le montant minimum est de 500 F."); return; }
    setTopupError("");
    setTopupNotice("");
    setTopupBusy(true);
    try {
      const transactionId = `ZK-WALLET-${info.phone}-${Date.now()}`;
      await apiSend("/api/payments/pending", "POST", { transactionId, kind: "wallet_topup", phone: info.phone, amount });
      launchCinetPaySubscription({
        transactionId,
        amount,
        description: `Recharge portefeuille Zonako Vendeur`,
        customer: { name: info.name, phone: info.phone },
        onSuccess: () => {
          setTopupBusy(false);
          setTopupNotice("Paiement reçu — vérification en cours, ton portefeuille sera crédité dans quelques instants.");
        },
        onError: (msg) => { setTopupBusy(false); setTopupError(msg); },
      });
    } catch (e) {
      setTopupBusy(false);
      setTopupError("Erreur pendant la préparation du paiement. Réessaie.");
    }
  }

  async function pay() {
    setPayError("");
    setPayNotice("");
    setPaying(true);
    try {
      // On relie d'abord un transaction_id à cet abonnement, AVANT de lancer le
      // paiement — c'est ce qui permettra au webhook /api/cinetpay/notify de
      // savoir quoi activer une fois CinetPay confirmé le paiement.
      const transactionId = `ZK-SUB-${role}-${info.phone}-${Date.now()}`;
      await apiSend("/api/payments/pending", "POST", { transactionId, kind: "subscription", role, phone: info.phone, amount: accessFee });
      launchCinetPaySubscription({
        transactionId,
        amount: accessFee,
        description: `Abonnement Zonako ${roleLabel === "vendeur" ? "Vendeur" : "Livreur"} (30 jours)`,
        customer: { name: info.name, phone: info.phone },
        onSuccess: () => {
          setPaying(false);
          setPayNotice("Paiement reçu — vérification en cours, ton abonnement s'activera dans quelques instants.");
        },
        onError: (msg) => { setPaying(false); setPayError(msg); },
      });
    } catch (e) {
      setPaying(false);
      setPayError("Erreur pendant la préparation du paiement. Réessaie.");
    }
  }

  if (!granted) {
    return (
      <div className="max-w-sm mx-auto px-4 py-10 text-center">
        <div className="w-11 h-11 rounded-lg flex items-center justify-center mb-4 mx-auto" style={{ backgroundColor: color }}>
          <Lock size={18} className="text-white" />
        </div>
        <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">
          {info.subscriptionStatus === "active" ? "Abonnement expiré" : "Ton essai gratuit est terminé"}
        </h2>
        <p className="f-body text-sm text-[#14213D]/50 mb-5">
          Pour continuer à utiliser l'espace {roleLabel}, active ton abonnement Zonako : {accessFee.toLocaleString("fr-FR")} F pour 30 jours.
        </p>
        {payError && <p className="f-body text-xs text-[#C1440E] mb-3">{payError}</p>}
        {payNotice && <p className="f-body text-xs text-[#2D6A4F] mb-3">{payNotice}</p>}
        <button
          disabled={paying}
          onClick={pay}
          className="w-full text-white f-display font-semibold py-3 rounded-full text-sm disabled:opacity-40"
          style={{ backgroundColor: color }}
        >
          {paying ? "Paiement en cours…" : `Payer ${accessFee.toLocaleString("fr-FR")} F et activer`}
        </button>
        <div className="flex justify-center mt-3">
          <PaymentBadges />
        </div>
      </div>
    );
  }

  return (
    <>
      {trialActive && (
        <div className="max-w-5xl mx-auto px-4 pt-4">
          <div className={`f-mono text-xs px-3 py-2 rounded-lg flex items-center justify-between gap-2 ${daysLeft <= 3 ? "bg-[#C1440E]/15 text-[#C1440E]" : "bg-[#F2A93B]/15 text-[#14213D]"}`}>
            <span>{daysLeft <= 3 ? "⚠️" : "🎁"} Essai gratuit : encore {daysLeft} jour{daysLeft > 1 ? "s" : ""}{daysLeft <= 3 && role === "courier" ? " — tu ne peux plus accepter de nouvelles livraisons jusqu'au renouvellement" : ""}</span>
            <button onClick={pay} disabled={paying} className="f-mono underline whitespace-nowrap">{paying ? "…" : "Payer maintenant"}</button>
          </div>
          {payError && <p className="f-body text-xs text-[#C1440E] px-1 mt-1">{payError}</p>}
          {payNotice && <p className="f-body text-xs text-[#2D6A4F] px-1 mt-1">{payNotice}</p>}
        </div>
      )}
      {subscriptionActive && daysLeft <= 3 && (
        <div className="max-w-5xl mx-auto px-4 pt-4">
          <div className="f-mono text-xs bg-[#C1440E]/15 text-[#C1440E] px-3 py-2 rounded-lg flex items-center justify-between gap-2">
            <span>⚠️ Ton abonnement expire dans {daysLeft} jour{daysLeft > 1 ? "s" : ""}{role === "courier" ? " — tu ne peux plus accepter de nouvelles livraisons jusqu'au renouvellement" : ""}</span>
            <button onClick={pay} disabled={paying} className="f-mono underline whitespace-nowrap">{paying ? "…" : "Renouveler maintenant"}</button>
          </div>
          {payError && <p className="f-body text-xs text-[#C1440E] px-1 mt-1">{payError}</p>}
          {payNotice && <p className="f-body text-xs text-[#2D6A4F] px-1 mt-1">{payNotice}</p>}
        </div>
      )}
      {subscriptionActive && daysLeft > 3 && (
        <div className="max-w-5xl mx-auto px-4 pt-4">
          <p className="f-mono text-[10px] text-[#2D6A4F]">✓ Abonnement actif jusqu'au {new Date(info.subscriptionExpiresAt).toLocaleDateString("fr-FR")}</p>
        </div>
      )}
      {role === "vendor" && (
        <div className="max-w-5xl mx-auto px-4 pt-2">
          <p className={`f-mono text-[10px] ${info.walletBalance < 0 ? "text-[#C1440E]" : "text-[#14213D]/40"}`}>
            💰 Portefeuille commission : {Math.round(info.walletBalance || 0).toLocaleString("fr-FR")} F
            {info.walletBalance < 0 && " — recharge ci-dessous ou contacte le propriétaire"}
          </p>
          <div className="flex items-center gap-2 mt-1.5">
            <input
              type="number"
              value={topupAmount}
              onChange={(e) => setTopupAmount(e.target.value)}
              className="f-body w-28 px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs"
              placeholder="Montant"
            />
            <button disabled={topupBusy} onClick={payWalletTopup} className="f-mono text-[10px] bg-[#F2A93B] text-[#14213D] px-3 py-1.5 rounded-full disabled:opacity-40">
              {topupBusy ? "…" : "Recharger (Mobile Money / Carte)"}
            </button>
          </div>
          {topupNotice && <p className="f-body text-[10px] text-[#2D6A4F] mt-1">{topupNotice}</p>}
          {topupError && <p className="f-body text-[10px] text-[#C1440E] mt-1">{topupError}</p>}
        </div>
      )}
      {children}
    </>
  );
}

// Sur mobile, le clavier virtuel peut recouvrir le bas de l'écran (et donc le bouton
// "Entrer") pendant la saisie. On fait remonter le champ actif pour qu'il reste visible.
function keepInView(e) {

}

// Compresse une photo choisie par le vendeur (fichier local) en une image légère
// encodée en base64, pour qu'elle puisse être stockée et rechargée instantanément.
function compressImage(file, maxWidth = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Petit cache mémoire pour éviter de refaire un appel réseau à chaque re-rendu
// quand la même personne (vendeur/livreur) apparaît plusieurs fois à l'écran.
const ratingsCache = new Map();
function RatingBadge({ phone, compact = false }) {
  const [rating, setRating] = useState(ratingsCache.get(phone) || null);
  useEffect(() => {
    let cancelled = false;
    if (ratingsCache.has(phone)) { setRating(ratingsCache.get(phone)); return; }
    apiGet(`/api/ratings/${encodeURIComponent(phone)}`).then((r) => {
      ratingsCache.set(phone, r);
      if (!cancelled) setRating(r);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [phone]);
  if (!rating || rating.count === 0) return compact ? null : <span className="f-mono text-[10px] text-[#14213D]/30">Pas encore noté</span>;
  return <span className="f-mono text-[10px] text-[#14213D]/60">★ {rating.average} ({rating.count})</span>;
}

// Badge de confiance vendeur — vérifié + taux de livraisons réussies, visible
// par l'acheteur avant même de commander.
const vendorTrustCache = new Map();
function VendorTrustBadge({ phone }) {
  const [trust, setTrust] = useState(vendorTrustCache.get(phone) || null);
  useEffect(() => {
    let cancelled = false;
    if (vendorTrustCache.has(phone)) { setTrust(vendorTrustCache.get(phone)); return; }
    apiGet(`/api/vendors/${encodeURIComponent(phone)}/trust`).then((t) => {
      vendorTrustCache.set(phone, t);
      if (!cancelled) setTrust(t);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [phone]);
  if (!trust) return null;
  return (
    <span className="f-mono text-[10px] flex items-center gap-1.5 flex-wrap">
      {trust.verified && <span className="text-[#2D6A4F]">✓ Vendeur vérifié</span>}
      {trust.successRate !== null && trust.totalOrders >= 3 && (
        <span className="text-[#14213D]/40">{trust.successRate}% de livraisons réussies</span>
      )}

}

// Reçu imprimable pour une commande — s'ouvre en superposition, le contenu de
// la classe "receipt-print" est le seul élément visible à l'impression (voir
// les règles @media print dans FONT_STYLE).
// Carte de suivi + infos du livreur — utilisée à la fois côté acheteur et côté
// vendeur. La carte (OpenStreetMap, sans clé requise) ne s'affiche que si le
// livreur a lui-même activé le partage de position.
const VEHICLE_LABELS = { moto: "🏍️ Moto", velo: "🚲 Vélo", voiture: "🚗 Voiture", tricycle: "🛺 Tricycle", pied: "🚶 À pied" };
// Galerie photo d'un produit — s'ouvre en plein écran, navigation par flèches
// ou par points, pour montrer plusieurs angles d'un même article.
function ProductGalleryModal({ product, onClose, buyerPhone }) {
  const [index, setIndex] = useState(0);
  const [buyerPhotos, setBuyerPhotos] = useState([]);
  const photos = product.imageUrls && product.imageUrls.length ? product.imageUrls : (product.imageUrl ? [product.imageUrl] : []);
  const videos = product.videoUrls && product.videoUrls.length ? product.videoUrls : (product.videoUrl ? [product.videoUrl] : []);
  useEffect(() => {
    if (!product.vendorPhone) return;
    apiGet(`/api/ratings/${encodeURIComponent(product.vendorPhone)}/photos`).then(setBuyerPhotos).catch(() => {});
  }, [product.vendorPhone]);
  useEffect(() => {
    if (!buyerPhone) return;
    apiSend(`/api/products/${product.id}/view`, "POST", undefined, getPhoneToken(buyerPhone)).catch(() => {});
  }, [product.id, buyerPhone]);
  // Les vidéos passent en premier (plus convaincantes), suivies des photos du
  // vendeur, puis des vraies photos envoyées par d'anciens acheteurs (preuve
  // de conformité — ce que les gens reçoivent vraiment).
  const slides = [
    ...videos.map((url) => ({ type: "video", url })),
    ...photos.map((url) => ({ type: "image", url })),
    ...buyerPhotos.map((p) => ({ type: "buyer_image", url: p.photoUrl })),
  ];
  if (slides.length === 0) return null;
  const current = slides[index];
  return (
    <div className="fixed inset-0 bg-black/85 z-50 flex flex-col items-center justify-center p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 text-white f-mono text-xs bg-white/10 px-3 py-1.5 rounded-full">Fermer ✕</button>
      <div className="relative max-w-lg w-full" onClick={(e) => e.stopPropagation()}>
        {current.type === "video" ? (
          <video src={current.url} controls autoPlay className="w-full max-h-[70vh] rounded-xl bg-black" />
        ) : (
          <img src={current.type === "image" ? enhancedImageUrl(current.url) : current.url} alt={product.name} className="w-full max-h-[70vh] object-contain rounded-xl" />
        )}
        {current.type === "buyer_image" && (
          <span className="absolute top-2 left-2 f-mono text-[10px] bg-[#2D6A4F] text-white px-2 py-1 rounded-full">✓ Photo d'un acheteur réel</span>
        )}
        {slides.length > 1 && (
          <>
            <button onClick={() => setIndex((i) => (i - 1 + slides.length) % slides.length)} className="absolute left-2 top-1/2 -translate-y-1/2 bg-white/20 text-white w-9 h-9 rounded-full">‹</button>
            <button onClick={() => setIndex((i) => (i + 1) % slides.length)} className="absolute right-2 top-1/2 -translate-y-1/2 bg-white/20 text-white w-9 h-9 rounded-full">›</button>
          </>
        )}
      </div>
      {slides.length > 1 && (
        <div className="flex gap-1.5 mt-3">
          {slides.map((s, i) => (
            <button key={i} onClick={(e) => { e.stopPropagation(); setIndex(i); }} className={`w-2 h-2 rounded-full ${i === index ? "bg-white" : "bg-white/30"}`} />
          ))}
        </div>
      )}
      <p className="f-body text-xs text-white/70 mt-2">{product.name}</p>
    </div>
  );
}

// Négociation de la compagnie de transport entre acheteur et vendeur —
// utilisée des deux côtés (viewerRole indique qui regarde l'écran).
function TransportNegotiationCard({ order, viewerRole, viewerPhone, onPropose, onConfirm }) {
  const [editing, setEditing] = useState(false);
  const [companyDraft, setCompanyDraft] = useState(order.transportCompany || "");
  const [feeDraft, setFeeDraft] = useState(order.transportFee !== null ? String(order.transportFee) : "");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 15000);
    return () => clearInterval(t);
  }, []);

  const settled = order.transportConfirmedByBuyer && order.transportConfirmedByVendor;
  const settledRemainingMs = order.transportSettledAt ? ORDER_GRACE_PERIOD_MS_CLIENT - (now - order.transportSettledAt) : 0;
  const theirTurn = order.transportProposedBy && order.transportProposedBy !== viewerRole; // c'est à viewerRole de répondre
  const waitingOnOther = order.transportProposedBy === viewerRole && !settled;
  // Seul le vendeur fixe les frais — si personne n'en a encore mis, c'est forcément
  // à lui de le faire avant que quoi que ce soit puisse être confirmé.
  const needsFee = theirTurn && order.transportFee === null;

  function startEditing() {
    setCompanyDraft(order.transportCompany || "");
    setFeeDraft(order.transportFee !== null ? String(order.transportFee) : "");
    setError("");
    setEditing(true);
  }
  async function handleConfirm() {
    setBusy(true);
    setError("");
    try {
      await onConfirm(order.id, viewerPhone, viewerRole);
    } catch (e) {
      setError(e.message || "Erreur pendant la confirmation.");
    }
    setBusy(false);
  }
  async function handlePropose() {
    if (!companyDraft.trim()) return;
    if (viewerRole === "vendor" && (!feeDraft || Number(feeDraft) < 0)) { setError("Indique des frais d'expédition."); return; }
    setBusy(true);
    setError("");
    try {
      await onPropose(order.id, viewerPhone, companyDraft.trim(), viewerRole === "vendor" ? Number(feeDraft) : undefined, viewerRole);
      setEditing(false);
    } catch (e) {
      setError(e.message || "Erreur pendant la proposition.");
    }
    setBusy(false);
  }

  if (!order.transportCompany) return null;

  return (
    <div className="ticket bg-white border-2 border-[#14213D]/10 p-3 mt-2">
      <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60 mb-1">🚌 Compagnie de transport</p>
      {settled ? (
        <>
          <p className="f-body text-sm text-[#2D6A4F]">✅ {order.transportCompany} confirmée — Frais : {order.transportFee?.toLocaleString("fr-FR")} F</p>
          {settledRemainingMs > 0 && (
            <p className="f-body text-[11px] text-[#14213D]/50 bg-[#14213D]/5 rounded-lg px-2 py-1 mt-1.5">
              🕐 {viewerRole === "buyer" ? "Tu peux" : "L'acheteur peut"} encore changer d'avis sur cet accord pendant {Math.ceil(settledRemainingMs / 60000)} minute{Math.ceil(settledRemainingMs / 60000) > 1 ? "s" : ""} — {viewerRole === "vendor" ? "l'expédition sera possible ensuite." : "le vendeur n'expédiera qu'après ce délai."}
            </p>
          )}
        </>
      ) : (
        <>
          <p className="f-body text-sm text-[#14213D]">
            {order.transportCompany}{order.transportFee !== null ? ` — ${order.transportFee.toLocaleString("fr-FR")} F` : " — frais non fixés"}
            <span className="f-mono text-[10px] text-[#14213D]/40"> · proposé par {order.transportProposedBy === viewerRole ? "toi" : (viewerRole === "buyer" ? "le vendeur" : "l'acheteur")}</span>
          </p>
          {waitingOnOther && <p className="f-body text-xs text-[#14213D]/40 mt-1">En attente de la réponse de {viewerRole === "buyer" ? "le vendeur" : "l'acheteur"}…</p>}
          {theirTurn && !editing && (
            <div className="flex gap-2 mt-2">
              {!needsFee && (
                <button disabled={busy} onClick={handleConfirm} className="flex-1 f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">{busy ? "…" : "✅ Accepter"}</button>
              )}
              <button onClick={startEditing} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-1.5 rounded-full">
                {needsFee ? "Fixer les frais d'expédition" : "Proposer une autre compagnie"}
              </button>
            </div>
          )}
          {theirTurn && editing && (
            <div className="mt-2 space-y-1.5">
              <input placeholder="Nom de la compagnie" value={companyDraft} onChange={(e) => setCompanyDraft(e.target.value)} className="f-body w-full px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
              {viewerRole === "vendor" && (
                <input type="number" placeholder="Frais d'expédition (FCFA)" value={feeDraft} onChange={(e) => setFeeDraft(e.target.value)} className="f-body w-full px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
              )}
              <div className="flex gap-2">
                <button disabled={busy || !companyDraft.trim()} onClick={handlePropose} className="flex-1 f-mono text-xs bg-[#F2A93B] text-[#14213D] py-1.5 rounded-full disabled:opacity-40">{busy ? "…" : needsFee ? "Valider" : "Envoyer la proposition"}</button>
                <button onClick={() => setEditing(false)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-1.5 rounded-full">Annuler</button>
              </div>
            </div>
          )}
          {error && <p className="f-body text-xs text-[#C1440E] mt-1">{error}</p>}
        </>
      )}
    </div>
  );
}

// Confirmation de réception, avec option de contester si l'article ne
// correspond pas à ce qui était annoncé (photo à l'appui) — bloque le
// déblocage des fonds du vendeur jusqu'à tranchage par le propriétaire.
function DisputeOrConfirm({ orderId, buyerPhone, confirmLabel, onConfirm, onDispute }) {
  const [showForm, setShowForm] = useState(false);
  const [description, setDescription] = useState("");
  const [photoUrl, setPhotoUrl] = useState("");
  const [uploading, setUploading] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  async function handlePhotoUpload(file) {
    if (!file) return;
    setUploading(true);
    setError("");
    try {
      const url = await uploadImageToCloudinary(file);
      setPhotoUrl(url);
    } catch (e) {
      setError(e.message || "Impossible d'envoyer la photo — le signalement peut aussi être envoyé sans photo.");
    }
    setUploading(false);
  }
  async function submitDispute() {
    setBusy(true);
    setError("");
    try {
      await onDispute(orderId, buyerPhone, description, photoUrl);
    } catch (e) {
      setError(e.message || "Erreur pendant le signalement.");
    }
    setBusy(false);
  }
  async function handleConfirm() {
    setBusy(true);
    setError("");
    try {
      await onConfirm(orderId);
    } catch (e) {
      setError(e.message || "Erreur pendant la confirmation.");
    }
    setBusy(false);
  }

  if (showForm) {
    return (
      <div className="mt-1.5 space-y-1.5">
        <textarea placeholder="Décris le problème (taille, couleur, modèle différent de l'annonce...)" value={description} onChange={(e) => setDescription(e.target.value)} rows={2} className="f-body w-full px-2 py-1.5 rounded-lg border-2 border-[#14213D]/15 text-xs" />
        {photoUrl ? (
          <img src={photoUrl} alt="" className="w-20 h-20 rounded-lg object-cover border-2 border-[#14213D]/10" />
        ) : (
          <label className="f-mono text-[10px] text-center bg-[#14213D]/5 text-[#14213D]/60 py-1.5 rounded-lg cursor-pointer block">
            {uploading ? "Envoi…" : "📷 Ajouter une photo de l'article reçu (recommandé)"}
            <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(e.target.files[0])} />
          </label>
        )}
        {error && <p className="f-body text-[10px] text-[#C1440E]">{error}</p>}
        <div className="flex gap-2">
          <button disabled={busy || !description.trim()} onClick={submitDispute} className="flex-1 f-mono text-xs bg-[#C1440E] disabled:opacity-40 text-white py-1.5 rounded-full">{busy ? "…" : "Envoyer le signalement"}</button>
          <button onClick={() => setShowForm(false)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-1.5 rounded-full">Annuler</button>
        </div>
      </div>
    );
  }

  return (
    <div className="mt-1.5 space-y-1.5">
      <button disabled={busy} onClick={handleConfirm} className="w-full f-mono text-xs bg-[#2D6A4F] disabled:opacity-40 text-white py-1.5 rounded-full">{busy ? "…" : confirmLabel}</button>
      <button onClick={() => setShowForm(true)} className="w-full f-mono text-[10px] text-[#C1440E]/70 hover:text-[#C1440E] underline">⚠️ Ce n'est pas conforme à ce qui était annoncé</button>
      {error && <p className="f-body text-[10px] text-[#C1440E]">{error}</p>}
    </div>
  );
}

// Génère un repère court à partir d'un nom (ex: "Kobenan" → "KOB") pour préfixer
// les numéros de reçu/bon de commande — plus lisible qu'un identifiant technique.
function nameSyllable(name) {
  const letters = (name || "").replace(/[^a-zA-ZÀ-ÿ]/g, "");
  return (letters.slice(0, 3) || "ZKO").toUpperCase();
}
function ReceiptModal({ order, vendorName, vendorPhone, onClose }) {
  // Sans vendorPhone : vue acheteur (tous les articles, tous vendeurs confondus,
  // total payé). Avec vendorPhone : vue vendeur (ses articles, part nette après commission).
  const isVendorView = !!vendorPhone;
  const myItems = isVendorView ? order.items.filter((it) => it.vendorPhone === vendorPhone) : order.items;
  const subtotal = myItems.reduce((s, it) => s + it.price * it.qty, 0);
  const commission = subtotal * (order.feeRate ?? 0);
  const net = subtotal - commission;
  // Numérotation : côté acheteur, le numéro commence par une syllabe du nom du
  // vendeur ; côté vendeur (bon de commande), par une syllabe du nom de l'acheteur.
  // Les chiffres viennent d'un compteur automatique (1, 2, 3...), pas de l'heure.
  const seqPart = order.orderSeq ? String(order.orderSeq).padStart(6, "0") : order.id.slice(-6);
  const displayNumber = isVendorView
    ? `${nameSyllable(order.buyerName)}-${seqPart}`
    : `${nameSyllable(vendorName || order.items[0]?.vendorName)}-${seqPart}`;
  const vendorAddress = order.items[0]?.vendorLandmark || "";
  return (
    <div className="fixed inset-0 bg-[#14213D]/60 z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl max-w-sm w-full max-h-[90vh] overflow-y-auto">
        <div className="receipt-print p-6">
          <div className="text-center mb-4">
            <p className="f-display font-bold text-lg text-[#14213D]">Zonako</p>
            <p className="f-mono text-[10px] text-[#14213D]/50">{isVendorView ? "Bon de commande" : "Reçu de commande"}</p>
          </div>
          <div className="border-t border-b border-dashed border-[#14213D]/20 py-3 mb-3 space-y-1">
            <p className="f-mono text-[11px] text-[#14213D]/60">N° : {displayNumber}</p>
            <p className="f-mono text-[11px] text-[#14213D]/60">Date : {new Date(order.createdAt).toLocaleString("fr-FR")}</p>
            {isVendorView ? (
              <>
                <p className="f-mono text-[11px] text-[#14213D]/60">Acheteur : {order.buyerName} · {order.buyerPhone}</p>
                <p className="f-mono text-[11px] text-[#14213D]/60">Zone de livraison : {order.zone}</p>
                {order.buyerAddress && <p className="f-mono text-[11px] text-[#14213D]/60">Adresse / repère : {order.buyerAddress}</p>}
              </>
            ) : (
              <>
                <p className="f-mono text-[11px] text-[#14213D]/60">Vendeur : {vendorName || order.items[0]?.vendorName}</p>
                {vendorAddress && <p className="f-mono text-[11px] text-[#14213D]/60">Adresse / repère vendeur : {vendorAddress}</p>}

// Fenêtre de réflexion gratuite (10 min) après une commande — l'acheteur
// peut annuler librement pendant ce temps, le vendeur n'a pas encore le
// droit de confirmer. Affiche un compte à rebours en direct.
const ORDER_GRACE_PERIOD_MS_CLIENT = 10 * 60 * 1000;
// Vidéo de la bannière d'annonce — se lance en boucle, coupée par défaut
// (obligatoire pour l'autoplay dans tous les navigateurs), avec un bouton
// 🔊 pour activer le son en un seul geste, comme sur Instagram/TikTok.
function AnnouncementVideoThumb({ src, large }) {
  const videoRef = useRef(null);
  const [muted, setMuted] = useState(true);
  function toggleSound() {
    setMuted((m) => {
      const next = !m;
      if (videoRef.current) videoRef.current.muted = next;
      return next;
    });
  }
  if (large) {
    return (
      <div className="relative w-full">
        <video ref={videoRef} src={src} autoPlay muted loop playsInline className="w-full h-56 sm:h-72 object-cover bg-black" />
        <button onClick={toggleSound} className="absolute bottom-2 right-2 bg-black/60 text-white rounded-full w-9 h-9 flex items-center justify-center text-base">
          {muted ? "🔇" : "🔊"}
        </button>
      </div>
    );
  }
  return (
    <div className="relative w-16 h-16 flex-shrink-0">
      <video ref={videoRef} src={src} autoPlay muted loop playsInline className="w-16 h-16 rounded-lg object-cover" />
      <button onClick={toggleSound} className="absolute bottom-0.5 right-0.5 bg-black/60 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
        {muted ? "🔇" : "🔊"}
      </button>
    </div>
  );
}

function GracePeriodNotice({ createdAt }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 15000);
    return () => clearInterval(t);
  }, []);
  const remainingMs = ORDER_GRACE_PERIOD_MS_CLIENT - (now - createdAt);
  if (remainingMs <= 0) return null;
  const minutes = Math.ceil(remainingMs / 60000);
  return (
    <p className="f-body text-[11px] text-[#2D6A4F] bg-[#2D6A4F]/10 border border-[#2D6A4F]/20 rounded-lg px-2 py-1 mt-1.5">
      🕐 Tu peux encore annuler librement pendant {minutes} minute{minutes > 1 ? "s" : ""} — le vendeur n'a pas encore commencé à préparer ta commande.
    </p>
  );
}

// Informe l'acheteur que la commande sera automatiquement considérée comme
// reçue après 3 jours d'inactivité — pour qu'il ne soit jamais surpris.
const AUTO_CONFIRM_DELAY_MS_CLIENT = 3 * 24 * 60 * 60 * 1000;
function AutoConfirmNotice({ inTransitAt }) {
  if (!inTransitAt) return null;
  const deadline = new Date(inTransitAt + AUTO_CONFIRM_DELAY_MS_CLIENT);
  return (
    <p className="f-body text-[10px] text-[#14213D]/40 mt-1">
      ⏳ Si tu ne confirmes ni ne signales de problème, ta commande sera automatiquement validée le {deadline.toLocaleDateString("fr-FR")} à {deadline.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}.
    </p>
  );
}

// Bouton "Confirmer la commande" côté vendeur — désactivé tant que la
// fenêtre de réflexion de l'acheteur n'est pas passée.
function VendorConfirmButton({ order, onConfirm, onCancel }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 15000);
    return () => clearInterval(t);
  }, []);
  const remainingMs = ORDER_GRACE_PERIOD_MS_CLIENT - (now - order.createdAt);
  if (remainingMs > 0) {
    const minutes = Math.ceil(remainingMs / 60000);
    return (
      <p className="f-body text-[11px] text-[#14213D]/50">🕐 L'acheteur a encore {minutes} minute{minutes > 1 ? "s" : ""} pour changer d'avis librement — tu pourras confirmer ensuite.</p>
    );
  }
  return (
    <div className="flex gap-2">
      <button onClick={() => onConfirm(order.id)} className="flex-1 f-mono text-xs bg-[#2D6A4F] text-white py-1.5 rounded-full">Confirmer la commande</button>

  );
}

// Bouton "Marquer expédiée" côté vendeur (expédition transport) — respecte la

function VendorShipButton({ order, shipForm, setShipForm, shipOrder }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {

  }, []);
  const remainingMs = order.transportSettledAt ? ORDER_GRACE_PERIOD_MS_CLIENT - (now - order.transportSettledAt) : 0;
  if (remainingMs > 0) {
    const minutes = Math.ceil(remainingMs / 60000);
    return (
      <p className="f-body text-[11px] text-[#14213D]/50">🕐 Encore {minutes} minute{minutes > 1 ? "s" : ""} avant de pouvoir expédier — laisse à l'acheteur le temps de revenir sur cet accord si besoin.</p>

  return (

function OrderTimeline({ status, shippingMethod = "livreur" }) {
  const steps = shippingMethod === "transport"
    ? [
        { key: "nouvelle", label: "Confirmation" },
        { key: "confirmee", label: "Prête" },
        { key: "en_transit", label: "En transit" },
        { key: "livree", label: "Récupérée" },
      ]
    : [
        { key: "nouvelle", label: "Confirmation" },
        { key: "confirmee", label: "Prête" },
        { key: "en_livraison", label: "En route" },
        { key: "livree", label: "Livrée" },
      ];
  if (status === "annulee") {
    return <p className="f-mono text-xs text-[#C1440E] mt-2">Commande annulée par le vendeur.</p>;
  }
  const idx = steps.findIndex((s) => s.key === status);
  return (
    <div className="flex items-center mt-3">
      {steps.map((s, i) => (
        <div key={s.key} className="flex items-center flex-1 last:flex-none">
          <div className="flex flex-col items-center">
            <div className={`w-5 h-5 rounded-full flex items-center justify-center ${i <= idx ? "bg-[#2D6A4F]" : "bg-[#14213D]/10"}`}>
              {i <= idx && <Check size={11} className="text-white" strokeWidth={3} />}
            </div>
            <span className="f-mono text-[9px] text-[#14213D]/40 mt-1 whitespace-nowrap">{s.label}</span>
          </div>
          {i < steps.length - 1 && <div className={`h-0.5 flex-1 mx-1 mb-4 ${i < idx ? "bg-[#2D6A4F]" : "bg-[#14213D]/10"}`} />}
        </div>
      ))}
    </div>
  );
}

function savePhoneToken(phone, token) {
  try { localStorage.setItem(`phone_token_${phone}`, token); } catch { /* échec silencieux */ }
}
function getPhoneToken(phone) {
  try { return localStorage.getItem(`phone_token_${phone}`) || null; } catch { return null; }
}

// Inscription avec vérification du numéro par SMS (code à usage unique). Une fois
// vérifié, le jeton reçu sert à prouver "j'agis bien en tant que ce numéro" pour
// toutes les actions sensibles (publier un produit, commander, confirmer une
// livraison...).
function RegisterWithPhoneVerification({ title, subtitle, accentColor, onSubmit, role }) {
  const [authMode, setAuthMode] = useState("login"); // "login" (mot de passe) | "register" (code + création)
  const [mode, setMode] = useState("phone"); // "phone" | "email"
  const [form, setForm] = useState({ name: "", phone: "", password: "" });
  const [step, setStep] = useState("info"); // "info" | "code"
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [testMode, setTestMode] = useState(false);

  async function sendCode() {
    setError("");
    setBusy(true);
    try {
      const r = await apiSend("/api/auth/send-code", "POST", { phone: form.phone });
      setTestMode(!!r.testMode);
      setStep("code");
    } catch (e) {
      setError(e.message || (mode === "email" ? "Impossible d'envoyer le code. Vérifie l'adresse email." : "Impossible d'envoyer le code. Vérifie le numéro."));
    }
    setBusy(false);
  }

  async function verify() {
    setError("");
    setBusy(true);
    try {
      const { token } = await apiSend("/api/auth/verify-code", "POST", { phone: form.phone, code });
      savePhoneToken(form.phone, token);
      onSubmit(form, token);
    } catch {
      setError("Code incorrect ou expiré.");
    }
    setBusy(false);
  }

  async function loginWithPassword() {
    setError("");
    setBusy(true);
    try {
      const { token, profile } = await apiSend("/api/auth/login-password", "POST", { role, phone: form.phone, password: form.password });
      savePhoneToken(form.phone, token);
      onSubmit({ ...form, name: profile?.name || form.name }, token);
    } catch (e) {
      setError(e.message || "Identifiant ou mot de passe incorrect.");
    }
    setBusy(false);
  }

  if (authMode === "login") {
    return (
      <div className="max-w-sm mx-auto px-4 py-8">
        <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">{title}</h2>
        <p className="f-body text-sm text-[#14213D]/50 mb-5">Connecte-toi avec ton mot de passe.</p>
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter" && form.phone && form.password) loginWithPassword(); }}>
          <input placeholder="Ton numéro ou ton email" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          <input type="password" placeholder="Mot de passe" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button disabled={!form.phone || !form.password || busy} onClick={loginWithPassword} className="w-full disabled:opacity-30 text-[#14213D] f-display font-semibold py-3 rounded-full text-sm" style={{ backgroundColor: accentColor }}>
            {busy ? "Connexion…" : "Se connecter"}
          </button>
          <div className="flex justify-between">
            <button onClick={() => { setAuthMode("register"); setError(""); }} className="f-mono text-xs text-[#14213D]/40 underline">Pas encore de compte ? S'inscrire</button>
            <button onClick={() => { setAuthMode("register"); setError(""); }} className="f-mono text-xs text-[#14213D]/40 underline">Mot de passe oublié ?</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="max-w-sm mx-auto px-4 py-8">
      <h2 className="f-display font-semibold text-xl text-[#14213D] mb-1">{title}</h2>
      <p className="f-body text-sm text-[#14213D]/50 mb-5">{subtitle}</p>
      {step === "info" ? (
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter" && form.name && form.phone) sendCode(); }}>
          <div className="grid grid-cols-2 gap-2 mb-1">
            <button type="button" onClick={() => { setMode("phone"); setForm({ ...form, phone: "" }); }} className={`f-mono text-xs px-3 py-2 rounded-lg border-2 ${mode === "phone" ? "border-current bg-black/5" : "border-[#14213D]/15 text-[#14213D]/50"}`} style={mode === "phone" ? { color: accentColor, borderColor: accentColor } : {}}>📱 Téléphone</button>
            <button type="button" onClick={() => { setMode("email"); setForm({ ...form, phone: "" }); }} className={`f-mono text-xs px-3 py-2 rounded-lg border-2 ${mode === "email" ? "border-current bg-black/5" : "border-[#14213D]/15 text-[#14213D]/50"}`} style={mode === "email" ? { color: accentColor, borderColor: accentColor } : {}}>📧 Email</button>
          </div>
          <input placeholder="Ton nom" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          <input
            type={mode === "email" ? "email" : "tel"}
            placeholder={mode === "email" ? "Ton adresse email" : "Ton numéro de téléphone"}
            value={form.phone}
            onChange={(e) => setForm({ ...form, phone: e.target.value })}
            onFocus={keepInView}
            className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none"
          />
          <input
            type="password"
            placeholder="Crée un mot de passe (pour te reconnecter facilement)"
            value={form.password}
            onChange={(e) => setForm({ ...form, password: e.target.value })}
            onFocus={keepInView}
            className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none"
          />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button
            disabled={!form.name || !form.phone || busy}
            onClick={sendCode}
            className="w-full disabled:opacity-30 text-[#14213D] f-display font-semibold py-3 rounded-full text-sm"
            style={{ backgroundColor: accentColor }}
          >
            {busy ? "Envoi…" : mode === "email" ? "Recevoir mon code par email" : "Recevoir mon code par SMS"}
          </button>
          <button onClick={() => { setAuthMode("login"); setError(""); }} className="w-full f-mono text-xs text-[#14213D]/40 underline">J'ai déjà un compte avec mot de passe</button>
        </div>
      ) : (
        <div className="space-y-3" onKeyDown={(e) => { if (e.key === "Enter" && code) verify(); }}>
          <p className="f-body text-xs text-[#14213D]/50">
            Code envoyé {mode === "email" ? "à" : "au"} {form.phone}.{testMode ? ` (Mode test — pas de ${mode === "email" ? "SMTP" : "Twilio"} configuré : regarde les logs du serveur pour le code.)` : ""}
          </p>
          <input placeholder={mode === "email" ? "Code reçu par email" : "Code reçu par SMS"} value={code} onChange={(e) => setCode(e.target.value)} onFocus={keepInView} className="f-body w-full px-3 py-2.5 rounded-lg border-2 border-[#14213D]/15 bg-white text-sm focus:outline-none" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <button disabled={!code || busy} onClick={verify} className="w-full disabled:opacity-30 text-[#14213D] f-display font-semibold py-3 rounded-full text-sm" style={{ backgroundColor: accentColor }}>
            {busy ? "Vérification…" : "Vérifier et entrer"}
          </button>
          <button onClick={() => { setStep("info"); setCode(""); setError(""); }} className="w-full f-mono text-xs text-[#14213D]/40 underline">{mode === "email" ? "Changer d'adresse" : "Changer de numéro"}</button>
        </div>
      )}
    </div>
  );
}

// Changer de numéro de téléphone (vendeur/livreur) : il faut vérifier le NOUVEAU
// numéro par SMS avant que le changement soit accepté par le serveur — voir
// POST /api/profiles/:role/change-phone.
function ChangePhoneNumber({ role, info, accentColor, onChanged }) {
  const [open, setOpen] = useState(false);
  const [newPhone, setNewPhone] = useState("");
  const [step, setStep] = useState("phone"); // "phone" | "code"
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [testMode, setTestMode] = useState(false);

  async function sendCode() {
    setError("");
    setBusy(true);
    try {
      const r = await apiSend("/api/auth/send-code", "POST", { phone: newPhone });
      setTestMode(!!r.testMode);
      setStep("code");
    } catch (e) {
      setError(e.message || "Impossible d'envoyer le code. Vérifie le numéro.");
    }
    setBusy(false);
  }

  async function verifyAndChange() {
    setError("");
    setBusy(true);
    try {
      const { token: newToken } = await apiSend("/api/auth/verify-code", "POST", { phone: newPhone, code });
      const profile = await apiSend(`/api/profiles/${role}/change-phone`, "POST", { newPhone, newToken, name: info.name }, getPhoneToken(info.phone));
      savePhoneToken(newPhone, newToken);
      setOpen(false);
      setStep("phone");
      setNewPhone("");
      setCode("");
      onChanged(profile);
    } catch (e) {
      setError(e.message && e.message.includes("déjà utilisé") ? "Ce numéro est déjà utilisé par un autre compte." : "Code incorrect, ou erreur pendant le changement.");
    }
    setBusy(false);
  }

  if (!open) {
    return <button onClick={() => setOpen(true)} className="f-mono text-[10px] text-[#14213D]/35 hover:text-[#14213D] underline">changer de numéro</button>;
  }

  return (
    <div className="ticket bg-white border-2 border-[#14213D]/10 p-3 mt-2 space-y-2">
      <p className="f-mono text-[11px] uppercase tracking-wide text-[#14213D]/60">Changer de numéro</p>
      {step === "phone" ? (
        <>
          <input placeholder="Nouveau numéro de téléphone" value={newPhone} onChange={(e) => setNewPhone(e.target.value)} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <div className="flex gap-2">
            <button disabled={!newPhone || busy} onClick={sendCode} className="flex-1 f-mono text-xs disabled:opacity-30 text-white py-2 rounded-full" style={{ backgroundColor: accentColor }}>
              {busy ? "Envoi…" : "Envoyer un code SMS"}
            </button>
            <button onClick={() => setOpen(false)} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-2 rounded-full">Annuler</button>
          </div>
        </>
      ) : (
        <>
          <p className="f-body text-xs text-[#14213D]/50">
            Code envoyé au {newPhone}.{testMode ? " (Mode test : regarde les logs du serveur.)" : ""}
          </p>
          <input placeholder="Code reçu par SMS" value={code} onChange={(e) => setCode(e.target.value)} className="f-body w-full px-3 py-2 rounded-lg border-2 border-[#14213D]/15 text-sm" />
          {error && <p className="f-body text-xs text-[#C1440E]">{error}</p>}
          <div className="flex gap-2">
            <button disabled={!code || busy} onClick={verifyAndChange} className="flex-1 f-mono text-xs disabled:opacity-30 text-white py-2 rounded-full" style={{ backgroundColor: accentColor }}>
              {busy ? "Vérification…" : "Vérifier et changer"}
            </button>
            <button onClick={() => { setOpen(false); setStep("phone"); setError(""); }} className="flex-1 f-mono text-xs bg-[#14213D]/10 text-[#14213D] py-2 rounded-full">Annuler</button>
          </div>
        </>
      )}
    </div>
  );
}

function BuyerView({ products, zone, setZone, cart, setCart, buyerInfo, registerBuyer, logoutBuyer, placeOrder, cancelOrder, deleteMyOrder, showCart, setShowCart, myOrders, chooseCourierForOrder, confirmDeliveryByBuyer, disputeOrder, proposeTransport, confirmTransport, tip, announcementMessage, announcementProductId, announcementCreatedAt, announcementVideoUrl }) {
  const [category, setCategory] = useState("");
  const [search, setSearch] = useState("");
  const [visibleCount, setVisibleCount] = useState(20);
  const [galleryProduct, setGalleryProduct] = useState(null);
  const [favorites, setFavorites] = useState([]);
  const [followedCategories, setFollowedCategories] = useState([]);
  useEffect(() => {
    if (!buyerInfo.phone) return;
    const token = getPhoneToken(buyerInfo.phone);
    if (!token) return;
    apiSend(`/api/favorites/${encodeURIComponent(buyerInfo.phone)}`, "GET", undefined, token).then(setFavorites).catch(() => {});
    apiSend(`/api/category-follows/${encodeURIComponent(buyerInfo.phone)}`, "GET", undefined, token).then(setFollowedCategories).catch(() => {});
  }, [buyerInfo.phone]);
  async function toggleFavorite(productId) {
    const token = getPhoneToken(buyerInfo.phone);
    if (!token) return;
    if (favorites.includes(productId)) {
      setFavorites((f) => f.filter((id) => id !== productId));
      await apiSend(`/api/favorites/${productId}`, "DELETE", { phone: buyerInfo.phone }, token).catch(() => {});
    } else {
      setFavorites((f) => [...f, productId]);
      await apiSend("/api/favorites", "POST", { phone: buyerInfo.phone, productId }, token).catch(() => {});
    }
  }
  async function toggleCategoryFollow(category) {
    const token = getPhoneToken(buyerInfo.phone);
    if (!token) return;
    if (followedCategories.includes(category)) {
      setFollowedCategories((c) => c.filter((x) => x !== category));
      await apiSend(`/api/category-follows/${encodeURIComponent(category)}`, "DELETE", { phone: buyerInfo.phone }, token).catch(() => {});
    } else {
      setFollowedCategories((c) => [...c, category]);
      await apiSend("/api/category-follows", "POST", { phone: buyerInfo.phone, category }, token).catch(() => {});
    }
  }
  // Mémorise la dernière annonce fermée par l'acheteur (sur cet appareil) —
  // si le propriétaire publie une nouvelle annonce, elle réapparaît quand
  // même puisque son horodatage est différent.
  const [dismissedAnnouncementAt, setDismissedAnnouncementAt] = useState(() => {
    try { return Number(localStorage.getItem("zonako_dismissed_announcement") || 0); } catch { return 0; }
  });
  function dismissAnnouncement() {
    setDismissedAnnouncementAt(announcementCreatedAt);
    try { localStorage.setItem("zonako_dismissed_announcement", String(announcementCreatedAt)); } catch {}
  }
  const showAnnouncement = announcementMessage && announcementCreatedAt && announcementCreatedAt !== dismissedAnnouncementAt;
  const announcementProduct = announcementProductId ? products.find((p) => p.id === announcementProductId) : null;
  const [receiptOrder, setReceiptOrder] = useState(null);
  const [view, setView] = useState("browse"); // browse | orders

  const [deliveryZone, setDeliveryZone] = useState("");
  const [shippingMethod, setShippingMethod] = useState("livreur"); // "livreur" | "transport"
  const [preferredTransportCompany, setPreferredTransportCompany] = useState("");
  const [buyerAddress, setBuyerAddress] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("cinetpay"); // "cinetpay" | "cod"
  const [payProcessing, setPayProcessing] = useState(false);
  const [showOrderReview, setShowOrderReview] = useState(false);
  const [payError, setPayError] = useState("");
  const [payNotice, setPayNotice] = useState("");
  const [reportingOrderId, setReportingOrderId] = useState(null);
  const [reportReason, setReportReason] = useState("");
  const [reportDetails, setReportDetails] = useState("");
  const [reportSending, setReportSending] = useState(false);
  const [reportedIds, setReportedIds] = useState([]);
  const [ratedIds, setRatedIds] = useState([]);
  const [ratingDraft, setRatingDraft] = useState({}); // { [orderId_role]: stars }
  const [ratingSending, setRatingSending] = useState(false);
  const [ratingPhotoAddedIds, setRatingPhotoAddedIds] = useState([]);
  const [uploadingRatingPhoto, setUploadingRatingPhoto] = useState(null);

  async function submitOrderRating(order, rateePhone, rateeRole, stars, photoUrl) {
    setRatingSending(true);
    try {
      await apiSend("/api/ratings", "POST", { orderId: order.id, rateePhone, rateeRole, stars, photoUrl }, getPhoneToken(buyerInfo.phone));
      ratingsCache.delete(rateePhone); // pour que le nouveau score s'affiche ailleurs
      setRatedIds((ids) => [...ids, `${order.id}_${rateeRole}`]);
    } catch {
      // échec silencieux, le bouton reste cliquable pour réessayer
    }
    setRatingSending(false);
  }
  async function addRatingPhoto(order, rateePhone, stars, file, key) {
    if (!file) return;
    setUploadingRatingPhoto(key);
    try {
      const url = await uploadImageToCloudinary(file);
      await submitOrderRating(order, rateePhone, "vendor", stars, url);
      setRatingPhotoAddedIds((ids) => [...ids, key]);
    } catch {
      // échec silencieux — l'avis (sans photo) reste déjà enregistré
    }
    setUploadingRatingPhoto(null);
  }

  async function submitReport(orderId) {
    if (!reportReason) return;
    setReportSending(true);
    try {
      await apiSend("/api/reports", "POST", { orderId, reason: reportReason, details: reportDetails }, getPhoneToken(buyerInfo.phone));
      setReportedIds((ids) => [...ids, orderId]);
      setReportingOrderId(null);
      setReportReason("");
      setReportDetails("");
    } catch {
      // Le message d'erreur reste discret ici — le formulaire réapparaît, l'acheteur peut réessayer.
    }
    setReportSending(false);
  }

  useEffect(() => {
    if (zone && zone !== NATIONAL && !deliveryZone) setDeliveryZone(zone);
  }, [zone]);

  const filtered = products.filter((p) => {
    const zoneMatch = !zone || zone === NATIONAL || p.zone === zone || p.zone === NATIONAL;
    const q = search.trim().toLowerCase();
    const searchMatch = !q || p.name.toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q) || p.vendorName.toLowerCase().includes(q);
    return zoneMatch && (!category || p.category === category) && searchMatch;
  });
  const visibleProducts = filtered.slice(0, visibleCount);

  if (!buyerInfo.registered) {
    return (
      <RegisterWithPhoneVerification
        title="Espace acheteur"

        accentColor="#F2A93B"
        role="buyer"
        onSubmit={(form) => registerBuyer(form)}
      />
    );
  }

  function addToCart(p) {
    setCart((c) => {
      const existing = c.find((i) => i.id === p.id);
      if (existing) return c.map((i) => (i.id === p.id ? { ...i, qty: i.qty + 1 } : i));
      return [...c, { id: p.id, name: p.name, price: p.price, qty: 1, vendorName: p.vendorName, vendorPhone: p.vendorPhone, zone: p.zone, deliveryTime: p.deliveryTime, vendorLandmark: p.vendorLandmark || "" }];
    });
  }
  function changeQty(id, delta) {
    setCart((c) => c.map((i) => (i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i)).filter((i) => i.qty > 0));
  }
  const goodsTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  // Les frais de livraison ne sont plus fixés par le vendeur : c'est le livreur qui
  // propose son prix au moment d'accepter la commande, et l'acheteur le règle
  // directement au livreur (en espèces) à la livraison — indépendamment du paiement
  // des articles en ligne ou à la commande.
  const total = goodsTotal;


  // Lance le guichet de paiement CinetPay (mobile money, carte...). À la confirmation
  // ("ACCEPTED"), on enregistre la commande comme payée. En cas de refus/annulation,
  // on laisse l'acheteur réessayer ou basculer sur le paiement à la livraison.
  async function launchCinetPayCheckout() {
    setPayError("");
    if (!window.CinetPay) {
      setPayError("Le module de paiement n'a pas pu se charger (vérifie ta connexion internet) — réessaie, ou choisis « paiement à la livraison ».");
      return;
    }
    setPayProcessing(true);
    try {
      // La commande est créée tout de suite, non payée — c'est /api/cinetpay/notify
      // (vérifié auprès de CinetPay côté serveur) qui la marquera payée. Si le
      // paiement échoue, on annule automatiquement cette commande.
      const order = await placeOrder(total, 0, deliveryZone, { paymentMethod: "cinetpay" }, shippingMethod, preferredTransportCompany, buyerAddress);
      setPreferredTransportCompany("");
      setBuyerAddress("");
      const transactionId = `ZK-${order.id}`;
      await apiSend("/api/payments/pending", "POST", { transactionId, kind: "order", orderId: order.id, amount: total }, getPhoneToken(buyerInfo.phone));

      const [firstName, ...rest] = (buyerInfo.name || "Client").trim().split(" ");
      window.CinetPay.setConfig({
        apikey: CINETPAY_CONFIG.apikey,
        site_id: CINETPAY_CONFIG.site_id,
        mode: CINETPAY_CONFIG.mode,
        notify_url: CINETPAY_CONFIG.notify_url,
      });
      window.CinetPay.getCheckout({
        transaction_id: transactionId,
        amount: total,
        currency: "XOF",
        channels: "ALL",
        description: `Commande Zonako · ${order.items.length} article${order.items.length > 1 ? "s" : ""}`,
        customer_name: firstName,
        customer_surname: rest.join(" ") || firstName,
        customer_phone_number: buyerInfo.phone,
        customer_address: deliveryZone || zone || "Côte d'Ivoire",
        customer_city: (deliveryZone || zone || "Abidjan").split(" – ")[0],
        customer_country: "CI",
        customer_state: "CI",
        customer_zip_code: "00225",
      });
      window.CinetPay.waitResponse((data) => {
        setPayProcessing(false);
        if (data.status === "ACCEPTED") {
          setPayNotice("Paiement reçu — vérification en cours, ta commande passera « payée » dans quelques instants.");
        } else {
          cancelOrder(order.id, true);
          setPayError("Paiement refusé ou annulé — la commande a été annulée. Tu peux réessayer, ou choisir « paiement à la livraison ».");
        }
      });
      window.CinetPay.onError((data) => {
        setPayProcessing(false);
        cancelOrder(order.id, true);
        setPayError("Une erreur est survenue pendant le paiement — la commande a été annulée. Réessaie dans un instant.");
        console.error("Erreur CinetPay:", data);
      });
    } catch (e) {
      setPayProcessing(false);
      setPayError("Erreur pendant la préparation de la commande. Réessaie.");
    }
  }

  function handleCheckout() {
    setPayError("");
    if (paymentMethod === "cod") {
      setPayProcessing(true);
      placeOrder(total, 0, deliveryZone, { paymentMethod: "cod" }, shippingMethod, preferredTransportCompany, buyerAddress)
        .then(() => { setPreferredTransportCompany(""); setBuyerAddress(""); })
        .catch((e) => setPayError(e.message || "Erreur pendant la commande. Réessaie."))
        .finally(() => setPayProcessing(false));
    } else {
      launchCinetPayCheckout();
    }
  }
